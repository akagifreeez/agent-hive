<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>agent-hive — UIモック</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #161617; --panel: #1d1d1f; --panel2: #262629; --line: #2b2b2f; --line2: #3b3b41;
    --label: #e9e9ea; --muted: #9d9da2; --faint: #6e6e73;
    --accent: #e8924a; --accent-fill: rgba(232, 146, 74, 0.12); --accent-contrast: #1c1208;
    --ok: #86efac; --warn: #fbbf24; --err: #fca5a5;
    --usermsg: #30363d;
    --font-ui: system-ui, "Segoe UI", "Meiryo", "Noto Sans JP", sans-serif;
    --font-mono: ui-monospace, "Cascadia Mono", Consolas, "SFMono-Regular", monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; overflow: hidden;
    font-family: var(--font-ui);
    background: var(--bg); color: var(--label);
    display: grid; grid-template-columns: 240px 1fr 380px;
    grid-template-rows: minmax(0, 1fr);
    font-size: 13px; line-height: 1.45;
  }
  a { color: var(--accent); }
  button { font-family: inherit; }

  /* ============ 左ナビ ============ */
  #nav { background: var(--panel); border-right: 1px solid var(--line2); display: flex; flex-direction: column; padding: 10px 8px; gap: 2px; min-height: 0; overflow-y: auto; }
  #nav .logo { padding: 2px 8px 12px; color: var(--label); font-weight: 700; font-size: 15px; }
  #nav .logo small { color: var(--muted); font-weight: 400; font-size: 10px; margin-left: 6px; }
  .navlabel { font-size: 11px; color: var(--muted); padding: 10px 8px 4px; }
  #newthread { margin: 2px 4px 8px; }
  #newthread button { width: 100%; background: none; border: 1px dashed var(--line2); color: var(--muted); border-radius: 6px; padding: 6px; cursor: pointer; font-size: 12px; }
  #newthread button:hover { color: var(--accent); border-color: var(--accent); }
  .folder-h { font-size: 10px; color: var(--faint); padding: 6px 8px 2px; font-weight: 600; }
  .room { padding: 5px 10px 6px; border-radius: 4px; cursor: pointer; font-size: 13px; position: relative; border-left: 2px solid transparent; }
  .room:hover { background: var(--panel2); }
  .room.active { background: var(--panel2); border-left-color: var(--accent); }
  .room .rname { font-weight: 600; }
  .room .rsub { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .room .rprog { position: absolute; right: 10px; top: 8px; font-size: 10px; color: var(--ok); }
  .badge { position: absolute; right: 10px; bottom: 8px; background: var(--err); color: #fff; border-radius: 8px; font-size: 10px; padding: 0 5px; }
  .navsec { margin-top: auto; border-top: 1px solid var(--line); padding-top: 8px; }
  .navrow { display: flex; gap: 6px; padding: 3px 6px; font-size: 12px; color: var(--muted); align-items: center; cursor: default; }
  .navrow b { color: var(--label); font-weight: 600; }
  #statusline { padding: 8px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--line); }

  /* ============ 中央 ============ */
  #chat { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #roomhead { border-bottom: 1px solid var(--line2); padding: 10px 16px 8px; background: var(--panel); }
  #rt-line1 { display: flex; align-items: center; gap: 10px; }
  #rt-name { font-size: 15px; font-weight: 700; }
  #rt-close { margin-left: auto; }
  #rt-goal { font-size: 12px; color: var(--muted); margin-top: 2px; }
  #members { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; background: var(--panel2); border: 1px solid var(--line2); border-radius: 12px; padding: 2px 10px; cursor: pointer; }
  .chip:hover { border-color: var(--accent); }
  .chip.sel { border-color: var(--accent); background: rgba(232,146,74,0.10); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.working { background: var(--warn); animation: pulse 1s infinite; }
  .dot.done { background: var(--ok); }
  .dot.error { background: var(--err); }
  @keyframes pulse { 50% { opacity: 0.4; } }
  #permzone { padding: 0 16px; }
  .permcard { background: #2a1c1c; border: 1px solid var(--err); border-radius: 6px; padding: 8px 12px; margin-top: 10px; font-size: 12px; }
  .permcard .cmd { font-family: Consolas, monospace; color: var(--warn); margin: 4px 0 6px; }
  .permcard button { background: var(--panel2); border: 1px solid var(--line2); color: var(--label); border-radius: 4px; padding: 3px 12px; margin-right: 6px; cursor: pointer; }
  .permcard button.ok { background: var(--ok); border-color: var(--ok); color: var(--accent-contrast); font-weight: 600; }
  #stream { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 1px; }
  .msg { padding: 5px 10px; border-radius: 4px; font-size: 13px; }
  .msg:hover { background: var(--panel2); }
  .msg .who { font-size: 12px; color: var(--muted); margin-bottom: 2px; font-weight: 600; }
  .msg.mine { background: var(--accent-fill); box-shadow: inset 2px 0 0 var(--accent); }
  .msg.mine .who { color: var(--accent); }
  .msg p { margin: 3px 0; }
  .msg pre { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 8px; overflow-x: auto; font-size: 12px; font-family: var(--font-mono); }
  .msg code { background: var(--bg); border-radius: 3px; padding: 0 4px; font-size: 12px; font-family: var(--font-mono); }
  .msg img { max-width: 100%; min-height: 40px; border-radius: 4px; display: block; margin: 4px 0; background: var(--bg); }
  .sysline { font-size: 11px; color: var(--faint); padding: 3px 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cmdout { align-self: flex-end; font-size: 12px; color: var(--faint); background: none; white-space: pre-wrap; max-width: 90%; }

  #composer { border-top: 1px solid var(--line2); padding: 10px 16px 12px; background: var(--panel); position: relative; }
  #composer .row { display: flex; gap: 8px; }
  #say { flex: 1; background: var(--bg); border: 1px solid var(--line2); color: var(--label); border-radius: 6px; padding: 8px 12px; font-size: 13px; }
  #say:focus { outline: none; border-color: var(--accent); }
  #send { background: var(--accent); border: none; color: var(--accent-contrast); border-radius: 6px; padding: 8px 16px; cursor: pointer; font-weight: 600; }
  #composer .hint { font-size: 11px; color: var(--faint); margin-top: 4px; min-height: 14px; }

  /* 候補ポップアップ */
  #sug { position: absolute; bottom: 100%; left: 16px; right: 16px; background: var(--panel2); border: 1px solid var(--line2); border-radius: 6px; max-height: 240px; overflow-y: auto; display: none; }
  #sug .item { padding: 5px 12px; cursor: pointer; font-size: 12px; }
  #sug .item:hover, #sug .item.sel { background: rgba(232,146,74,0.12); }
  #sug .item b { color: var(--accent); }
  #sug .item span { color: var(--muted); margin-left: 8px; }

  /* ============ 右パネル ============ */
  #ctx { background: var(--panel); border-left: 1px solid var(--line2); display: flex; flex-direction: column; min-height: 0; }
  #ctx-tabs { display: flex; border-bottom: 1px solid var(--line2); }
  #ctx-tabs .ct { flex: 1; text-align: center; padding: 9px 0; font-size: 12px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; }
  #ctx-tabs .ct.active { color: var(--accent); border-bottom-color: var(--accent); }
  #ctx-body { flex: 1; overflow-y: auto; padding: 10px; }
  .sec { font-size: 11px; color: var(--muted); margin: 10px 0 4px; }
  .sec:first-child { margin-top: 0; }
  .proj { font-size: 12px; color: var(--accent); font-weight: 600; margin: 8px 0 2px; }
  .taskrow { display: flex; align-items: baseline; gap: 6px; padding: 3px 4px; border-radius: 4px; font-size: 12px; }
  .taskrow:hover { background: var(--panel2); }
  .taskrow .tid { color: var(--accent); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }
  .taskrow .tsum { flex: 1; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .taskrow button { background: var(--panel2); border: 1px solid var(--line2); color: var(--label); border-radius: 4px; font-size: 10px; padding: 1px 7px; cursor: pointer; white-space: nowrap; }
  .taskrow button:hover { border-color: var(--accent); color: var(--accent); }
  #newtask { display: flex; flex-direction: column; gap: 4px; margin-top: 10px; border-top: 1px solid var(--line2); padding-top: 10px; }
  #newtask input, #newtask textarea { background: var(--bg); border: 1px solid var(--line2); color: var(--label); border-radius: 4px; padding: 4px 7px; font-size: 12px; }
  #newtask textarea { min-height: 40px; resize: vertical; }
  #newtask button { align-self: flex-end; background: var(--accent); border: none; color: var(--accent-contrast); border-radius: 4px; padding: 4px 10px; cursor: pointer; font-size: 12px; font-weight: 600; }
  .agentcard { background: transparent; border-radius: 4px; padding: 6px 10px; margin-bottom: 2px; cursor: pointer; font-size: 12px; }
  .agentcard:hover { background: var(--panel2); }
  .agentcard.sel { background: rgba(232,146,74,0.10); box-shadow: inset 2px 0 0 var(--accent); }
  .agentcard .nm { font-weight: 600; }
  .agentcard .st { float: right; font-size: 11px; }
  .agentcard .st.working { color: var(--warn); }
  .agentcard .st.done { color: var(--ok); }
  .agentcard .meta { color: var(--muted); font-size: 11px; margin-top: 2px; }
  .alog { max-height: 44vh; overflow-y: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; font-family: var(--font-mono); font-size: 11.5px; }
  .alog .l { padding: 3px 0; white-space: pre-wrap; word-break: break-word; }
  .alog .l .k { display: inline-block; min-width: 38px; margin-right: 6px; font-size: 10px; color: var(--faint); }
  .alog .l.think { color: var(--muted); }
  .alog .l.think .k { color: var(--faint); }
  .alog .l.say { color: var(--label); }
  .alog .l.say .k { color: var(--accent); }
  .alog .l.tool { color: var(--muted); }
  .alog .l.tool .k { color: var(--accent); }
  .alog .l.res { color: var(--muted); }
  ul.files { list-style: none; padding: 0; margin: 4px 0; font-size: 12px; }
  ul.files li { cursor: pointer; padding: 3px 6px; border-radius: 4px; font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); }
  ul.files li:hover { background: var(--panel2); color: var(--label); }
  pre.fv { background: var(--bg); border-radius: 4px; padding: 8px; font-size: 12px; overflow-x: auto; white-space: pre-wrap; }
  #term { display: flex; flex-direction: column; height: 100%; }
  #termout { flex: 1; background: var(--bg); border-radius: 4px; padding: 8px; font-size: 12px; overflow-y: auto; white-space: pre-wrap; color: var(--ok); }
  #termin { margin-top: 6px; background: var(--bg); border: 1px solid var(--line2); color: var(--label); border-radius: 4px; padding: 5px 8px; font-size: 12px; font-family: Consolas, monospace; }
  .hintbox { font-size: 11px; color: var(--muted); margin: 6px 0; }
  /* 設定ウィンドウ */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .dialog { background: var(--panel); border: 1px solid var(--line2); border-radius: 8px; width: 520px; max-height: 86vh; overflow-y: auto; padding: 16px 20px; }
  .dialog h2 { margin: 0 0 12px; font-size: 14px; color: var(--accent); }
  .dialog .frow { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .dialog .frow label { width: 150px; font-size: 12px; color: var(--muted); flex-shrink: 0; }
  .dialog .frow input, .dialog .frow select { flex: 1; background: var(--bg); border: 1px solid var(--line2); color: var(--label); border-radius: 4px; padding: 4px 8px; font-size: 12px; }
  .dialog .frow .note { font-size: 11px; color: var(--faint); }
  .dialog .fbtns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .dialog .fbtns button { border-radius: 4px; padding: 5px 14px; cursor: pointer; font-size: 12px; border: 1px solid var(--line2); background: var(--panel2); color: var(--label); }
  .dialog .fbtns button.save { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); font-weight: 600; }
  .dialog h3 { margin: 14px 0 6px; font-size: 12px; color: var(--label); border-bottom: 1px solid var(--line2); padding-bottom: 4px; }
  #toast { position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--ok); color: var(--ok); border-radius: 6px; padding: 8px 18px; font-size: 12px; display: none; z-index: 99; }
  #gear { background: none; border: 1px solid var(--line2); border-radius: 4px; color: var(--muted); cursor: pointer; font-size: 13px; padding: 2px 8px; margin-left: auto; }
  #gear:hover { color: var(--accent); border-color: var(--accent); }
</style>
</head>
<body>
  <aside id="nav">
    <div class="logo">agent-hive<small>UIモック</small></div>
    <div class="navlabel">検索</div>
    <input id="navsearch" placeholder="スレッドを検索…" style="margin: 2px 4px 6px; background: var(--bg); border: 1px solid var(--line2); color: var(--label); border-radius: 4px; padding: 4px 8px; font-size: 12px; width: calc(100% - 8px);">
    <div class="navlabel">スレッド</div>
    <button id="newthread">新しいスレッド</button>
    <div id="rooms"></div>
    <div class="navsec">
      <div class="navlabel">状態</div>
      <div class="navrow"><span class="dot done"></span>リーダー: 待機</div>
      <div class="navrow"><span class="dot"></span>モデル: glm-5.3-flash</div>
    </div>
    <div id="statusline">[running]</div>
  </aside>

  <main id="chat">
    <div id="roomhead">
      <div id="rt-line1"><span id="rt-name"></span><button id="gear" title="設定">設定</button><button id="rt-close" style="margin-left:6px">部屋を閉じる</button></div>
      <div id="rt-goal"></div>
      <div id="members"></div>
    </div>
    <div id="permzone"></div>
    <div id="stream"></div>
    <div id="composer">
      <div id="sug"></div>
      <div class="row">
        <input id="say" placeholder="メッセージ">
        <button id="send">送信</button>
      </div>
      <div class="hint" id="hint"></div>
    </div>
  </main>

  <aside id="ctx">
    <div id="ctx-tabs">
      <div class="ct active" data-tab="tasks">タスク</div>
      <div class="ct" data-tab="agents">エージェント</div>
      <div class="ct" data-tab="files">ファイル</div>
      <div class="ct" data-tab="term">ターミナル</div>
    </div>
    <div id="ctx-body"></div>
  </aside>

  <div id="toast"></div>
  <div class="overlay" id="askbox" style="display:none">
    <div class="dialog" style="width:380px">
      <h2 id="ask-title" style="color:var(--label)"></h2>
      <input id="ask-input" style="width:100%; background: var(--bg); border: 1px solid var(--line2); color: var(--label); border-radius: 4px; padding: 6px 8px; font-size: 13px;">
      <div class="fbtns">
        <button id="ask-cancel">キャンセル</button>
        <button class="save" id="ask-ok">決定</button>
      </div>
    </div>
  </div>
  <div class="overlay" id="settings" style="display:none">
    <div class="dialog">
      <h2>設定</h2>
      <h3>モデルと実行</h3>
      <div class="frow"><label>モデル</label><input id="st-model"></div>
      <div class="frow"><label>思考レベル</label>
        <select id="st-effort"><option value="low">low(速い・安い)</option><option value="medium">medium</option><option value="high">high(じっくり)</option></select>
      </div>
      <div class="frow"><label>フォールバック</label><input id="st-fallback" placeholder="カンマ区切り(例: glm-4.5-air,qwen3"></div>
      <div class="frow"><label>1ラウンドの上限</label><input id="st-turns" type="number" min="4" max="60"><span class="note">ターン</span></div>
      <div class="frow"><label>自動継続ラウンド</label><input id="st-auto" type="number" min="0" max="10"><span class="note">回</span></div>
      <h3>権限と予算</h3>
      <div class="frow"><label>権限モード</label>
        <select id="st-perm"><option value="normal">normal(要承認)</option><option value="auto">auto(自動許可)</option></select>
      </div>
      <div class="frow"><label>予算/ラン</label><input id="st-budget" type="number" min="10000" step="10000"><span class="note">トークン</span></div>
      <h3>発見器</h3>
      <div class="frow"><label>確認間隔</label><input id="st-disc" type="number" min="5" max="600"><span class="note">秒</span></div>
      <div class="fbtns">
        <button id="st-cancel">キャンセル</button>
        <button class="save" id="st-save">保存</button>
      </div>
    </div>
  </div>

<script>
// ============ モックデータ ============
const S = {
  rooms: [
    { id: "__main__", name: "メイン", goal: "リーダーと壁打ち・計画", pinned: true, folder: null },
    { id: "cuda", name: "# cuda-compress", goal: "CUDA圧縮ツールの実装と検証", prog: "3/9", unread: 0, folder: "AI開発" },
    { id: "cal", name: "# calendar-app", goal: "カレンダーMVPの実装", prog: "2/4", unread: 2, folder: "アプリ" },
  ],
  sel: "__main__",
  agents: {
    lead: { name: "リーダー", status: "idle", turn: 0, thread: "__main__" },
    "cuda-alpha": { name: "アルファ", status: "working", turn: 4, thread: "cuda" },
    "cuda-beta": { name: "ベータ", status: "idle", turn: 6, thread: "cuda" },
    "cuda-gamma": { name: "ガンマ", status: "done", turn: 8, thread: "cuda" },
    "cal-alpha": { name: "アルファ", status: "working", turn: 2, thread: "cal" },
  },
  board: {
    "__main__": [
      { from: "you", text: "cuda-compressの続き、どうなってる?" },
      { from: "lead", text: "実装は9割完了です。残るはレビューとベンチだけなので、スレッドを開いて仕上げます。" },
    ],
    "cuda": [
      { from: "system", text: "[マージ] アルファ がタスク impl-compress の成果を main へ取り込みました" },
      { from: "cuda-alpha", text: "圧縮カーネルを実装しました。LZ77風トークンで 2.1x 出ています。\n\n- 探索は共有メモリのハッシュテーブル\n- ブロック内逐次(ワープリーダー)" },
      { from: "cuda-beta", text: "検証します。ラウンドトリップとスループットを見ます。" },
    ],
    "cal": [
      { from: "cal-alpha", text: "カレンダーMVPの骨組みができました。月表示とイベント追加が動きます。" },
      { from: "cal-beta", text: "レビュー指摘: 月跨ぎの表示で境界バグの疑い。修正タスクを起票しました。" },
    ],
  },
  tasks: {
    cuda: [
      { id: "impl-decompress", st: "done", sum: "解凍カーネル実装" },
      { id: "impl-tests", st: "open", sum: "ベンチマーク追加" },
    ],
    cal: [
      { id: "cal-mvp", st: "done", sum: "月表示とイベント追加" },
      { id: "cal-review", st: "claimed", agent: "cal-beta", sum: "月跨ぎ表示の修正確認" },
    ],
  },
  logs: {
    "cuda-alpha": [
      { k: "think", t: "ハッシュテーブルの衝突処理を線形探索からバケットに変えよう…" },
      { k: "tool", t: "write_file src/compress.cu (148行)" },
      { k: "res", t: "書き込み完了" },
      { k: "tool", t: "bash nvcc -O2 -arch=sm_89 compress.cu" },
      { k: "res", t: "exit=0" },
      { k: "say", t: "圧縮率2.1xを確認。ベンチに回します" },
    ],
    "cuda-beta": [
      { k: "think", t: "ラウンドトリップ検証の境界条件を列挙…" },
      { k: "tool", t: "bash node --test" },
      { k: "res", t: "pass 6" },
    ],
    lead: [],
  },
};
let sel = "__main__";
let searchQuery = "";
let selAgent = null;
let ctxTab = "tasks";
const ST_JA = { idle: "待機", working: "作業中", done: "完了", error: "エラー" };

const $ = (id) => document.getElementById(id);
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

// ============ 描画 ============
function renderRooms() {
  const el = $("rooms");
  el.innerHTML = "";
  const q = searchQuery.trim().toLowerCase();
  const match = (r) => !q || r.name.toLowerCase().includes(q) || (r.goal || "").toLowerCase().includes(q);
  const makeRoom = (r) => {
    const t = S.tasks[r.id];
    const prog = t ? `${t.filter((x) => x.st === "done").length}/${t.length} 完了` : "";
    const unread = r.unread ?? 0;
    const d = document.createElement("div");
    d.className = "room" + (sel === r.id ? " active" : "");
    d.innerHTML = `<span class="rname">${esc(r.name)}</span><span class="rsub">${esc(r.goal || "")}${prog ? " · " + prog : ""}</span>`;
    if (unread) { const b = document.createElement("span"); b.className = "badge"; b.textContent = unread; d.appendChild(b); }
    d.onclick = () => { sel = r.id; r.unread = 0; render(); };
    el.appendChild(d);
  };
  // メインはスレッド一覧から分離して最上部の独立セクションに置く
  const main = S.rooms.find((r) => r.id === "__main__");
  if (main && match(main)) makeRoom(main);
  const ths = S.rooms.filter((r) => r.id !== "__main__" && match(r));
  if (q) { for (const r of ths) makeRoom(r); return; }
  const groups = {};
  for (const r of ths) (groups[r.folder || "未分類"] ??= []).push(r);
  for (const [f, rs] of Object.entries(groups).sort(([a], [b]) => a.localeCompare(b, "ja"))) {
    const h = document.createElement("div");
    h.className = "folder-h";
    h.textContent = f;
    el.appendChild(h);
    for (const r of rs) makeRoom(r);
  }
}

function members(roomId) {
  return Object.entries(S.agents).filter(([id, a]) => a.thread === roomId);
}

function renderRoom() {
  const r = S.rooms.find((x) => x.id === sel);
  $("rt-name").textContent = r ? r.name : "";
  $("rt-goal").textContent = r ? (r.goal || "") : "";
  const mem = $("members");
  mem.innerHTML = "";
  for (const [id, a] of Object.entries(S.agents).filter(([id, a]) => a.thread === sel)) {
    const c = document.createElement("span");
    c.className = "chip" + (selAgent === id ? " sel" : "");
    c.innerHTML = `<span class="dot ${a.status}"></span>${esc(a.name)}`;
    c.title = `${ST_JA[a.status] ?? a.status} · turn ${a.turn} · クリックでログ`;
    c.onclick = () => { selAgent = id; render(); };
    mem.appendChild(c);
  }
  const h = $("hint");
  h.textContent = sel === "__main__" ? "宛先: リーダー" : `宛先: ${sel} のメンバー全員`;
  $("rt-close").style.display = sel === "__main__" ? "none" : "";
}

function renderStream() {
  const st = $("stream");
  const posts = S.board[sel] ?? [];
  st.innerHTML = "";
  for (const p of posts) {
    if (p.from === "system") {
      const d = document.createElement("div");
      d.className = "sysline";
      d.textContent = p.text.replace(/^\[[^\]]+\]\s*/, "");
      d.title = p.text;
      st.appendChild(d);
      continue;
    }
    const mine = p.from === "you";
    const d = document.createElement("div");
    d.className = "msg" + (mine ? " mine" : "");
    const who = document.createElement("div");
    who.className = "who";
    who.textContent = mine ? "あなた" : p.name;
    const body = document.createElement("div");
    body.textContent = p.text;
    d.append(who, body);
    st.appendChild(d);
  }
  st.scrollTop = st.scrollHeight;
}

function renderTasks() {
  const body = $("ctx-body");
  if (ctxTab !== "tasks") return;
  body.innerHTML = "";
  const list = S.tasks[sel];
  if (!list) { const h = document.createElement("div"); h.className = "hintbox"; h.textContent = "この部屋にはタスクがありません(メインは壁打ち専用)"; body.appendChild(h); return; }
  const secs = [["done", "完了"], ["claimed", "作業中"], ["open", "未着手"]];
  for (const [st, label] of secs) {
    const rows = list.filter((t) => t.st === st);
    if (!rows.length) continue;
    const sh = document.createElement("div");
    sh.className = "sec";
    sh.textContent = `${label}(${rows.length})`;
    body.appendChild(sh);
    for (const t of rows) {
      const row = document.createElement("div");
      row.className = "taskrow";
      const id = document.createElement("span");
      id.className = "tid";
      id.textContent = t.id;
      const sum = document.createElement("span");
      sum.className = "tsum";
      sum.textContent = t.sum;
      sum.title = t.sum;
      const b = document.createElement("button");
      if (st === "open") { b.textContent = "中止"; b.onclick = () => { t.st = "done"; render(); }; }
      else if (st === "claimed") { b.textContent = "解放"; b.onclick = () => { t.st = "open"; render(); }; }
      else { b.textContent = "再開"; b.onclick = () => { t.st = "open"; render(); }; }
      row.append(id, sum, b);
      body.appendChild(row);
    }
  }
  const form = document.createElement("div");
  form.id = "newtask";
  form.innerHTML = `<div class="sec">新しいタスク</div>
    <input placeholder="task_id(空欄で自動)">
    <textarea placeholder="何を / 完了条件"></textarea>
    <button>投入(トークン消費なし)</button>`;
  form.querySelector("button").onclick = () => {
    const ta = form.querySelector("textarea");
    if (!ta.value.trim()) { showToast("本文を入力してください", "var(--err)"); return; }
    const id = "user-" + Math.random().toString(36).slice(2, 6);
    S.tasks[sel].push({ id, st: "open", sum: ta.value.trim().slice(0, 40) });
    ta.value = "";
    render();
  };
  body.appendChild(form);
}

function renderAgents() {
  const body = $("ctx-body");
  body.innerHTML = "";
  const mem = members(sel);
  for (const [id, a] of mem) {
    const card = document.createElement("div");
    card.className = "agentcard" + (selAgent === id ? " sel" : "");
    card.innerHTML = `<span class="nm">${esc(a.name)}</span><span class="st ${a.status}">${ST_JA[a.status] ?? a.status}</span><div class="meta">turn ${a.turn} / ${a.tokens ?? "1,234"}tok</div>`;
    card.onclick = () => { selAgent = id; render(); };
    body.appendChild(card);
    if (selAgent === id) {
      const log = document.createElement("div");
      log.className = "alog";
      const lines = S.logs[id] ?? [
        { k: "think", t: "設計に沿って実装を進める。まず境界条件を確認…" },
        { k: "tool", t: "bash node --test" },
        { k: "res", t: "pass 6" },
      ];
      for (const l of lines) {
        const d = document.createElement("div");
        d.className = "l " + l.k;
        const k = document.createElement("span");
        k.className = "k";
        k.textContent = ({ think: "思考", say: "発言", tool: "ツール", res: "結果" }[l.k] ?? "·");
        d.append(k, document.createTextNode(l.t));
        log.appendChild(d);
      }
      body.appendChild(log);
    }
  }
}

function renderFiles() {
  const body = $("ctx-body");
  body.innerHTML = "";
  const sh = document.createElement("div");
  sh.className = "sec";
  sh.textContent = "ワークスペースのファイル";
  body.appendChild(sh);
  for (const f of ["docs/design.md", "src/compress.cu", "tests/rt.test.mjs", "todo.js"]) {
    const li = document.createElement("div");
    li.className = "taskrow";
    li.style.cursor = "pointer";
    li.style.fontFamily = "var(--font-mono)";
    li.style.fontSize = "11.5px";
    li.style.color = "var(--muted)";
    li.textContent = f;
    li.onclick = () => {
      const pre = document.createElement("pre");
      pre.className = "fv";
      pre.textContent = "// " + f + " の内容(モック)\n…";
      body.appendChild(pre);
    };
    body.appendChild(li);
  }
}

function renderTerm() {
  const body = $("ctx-body");
  body.innerHTML = "";
  const h = document.createElement("div");
  h.className = "hintbox";
  h.textContent = "ワークスペース直下でコマンド実行(モック: ダミー応答)";
  body.appendChild(h);
  const out = document.createElement("pre");
  out.className = "fv";
  out.textContent = "$ node --test\npass 6\n";
  const input = document.createElement("input");
  input.className = "filter";
  input.placeholder = "コマンド…";
  input.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" || !input.value.trim()) return;
    out.textContent += "\n$ " + input.value + "\n(モック: 実行はシミュレーション)\n";
    input.value = "";
    out.scrollTop = out.scrollHeight;
  });
  body.appendChild(input);
  body.appendChild(out);
}

function renderCtx() {
  for (const b of document.querySelectorAll(".ct")) b.classList.toggle("active", b.dataset.tab === ctxTab);
  const body = $("ctx-body");
  body.innerHTML = "";
  if (ctxTab === "tasks") renderTasks();
  else if (ctxTab === "agents") renderAgents();
  else if (ctxTab === "files") renderFiles();
  else renderTerm();
}

function render() {
  renderRooms();
  renderRoom();
  renderStream();
  renderCtx();
}

// タブ・部屋切替
for (const b of document.querySelectorAll(".ct")) {
  b.onclick = () => { ctxTab = b.dataset.tab; renderCtx(); };
}
$("send").onclick = () => {
  const v = $("say").value.trim();
  if (!v) return;
  $("say").value = "";
  (S.board[sel] ??= []).push({ from: "you", name: "あなた", text: v });
  // モック: 相手が2秒後に応答する演出
  setTimeout(() => {
    const responder = sel === "__main__" ? "lead" : members(sel)[0]?.id;
    const name = S.agents[responder]?.name ?? "リーダー";
    (S.board[sel] ??= []).push({ from: responder, name, text: "了解しました。進めてきます。" });
    renderStream();
  }, 800);
  renderStream();
};
$("say").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("send").click(); } });
$("rt-close").onclick = async () => {
  if (sel === "__main__") return;
  const r = S.rooms.find((x) => x.id === sel);
  if (await ask(`スレッド ${r.name} を閉じますか?(ログは残ります)`, { confirmMode: true })) {
    S.rooms = S.rooms.filter((x) => x.id !== sel);
    sel = "__main__";
    render();
  }
};
document.getElementById("navsearch").addEventListener("input", (e) => {
    searchQuery = e.target.value;
    renderRooms();
  });
  $("newthread").onclick = async () => {
  const folder = (await ask("フォルダ名(空欄で未分類):")) ?? "";
  const name = await ask("スレッド名(英数字):");
  if (!name) return;
  const goal = (await ask("目標:")) ?? "";
  S.rooms.push({ id: name, name: "# " + name, goal, folder: folder || null });
  sel = name;
  S.agents[name + "-alpha"] = { name: "アルファ", status: "idle", thread: name };
  render();
};

// ============ ダイアログとトースト ============
function ask(title, { value = "", confirmMode = false } = {}) {
  return new Promise((resolve) => {
    $("ask-title").textContent = title;
    const inp = $("ask-input");
    inp.style.display = confirmMode ? "none" : "block";
    inp.value = value;
    $("ask-ok").textContent = confirmMode ? "はい" : "決定";
    $("askbox").style.display = "flex";
    if (!confirmMode) { inp.focus(); inp.select(); }
    const done = (v) => { $("askbox").style.display = "none"; resolve(v); };
    $("ask-ok").onclick = () => done(confirmMode ? true : inp.value.trim());
    $("ask-cancel").onclick = () => done(null);
    $("askbox").onclick = (e) => { if (e.target === $("askbox")) done(null); };
    inp.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); $("ask-ok").click(); } };
  });
}
function showToast(msg, color = "var(--ok)") {
  const t = $("toast");
  t.textContent = msg;
  t.style.color = color;
  t.style.borderColor = color;
  t.style.display = "block";
  setTimeout(() => (t.style.display = "none"), 2500);
}

// ============ 設定ウィンドウ ============
const SET = {
  model: "glm-5.3-flash", effort: "low", fallback: "", perm: "normal",
  turns: 12, auto: 2, budget: 150000, disc: 30,
};
function openSettings() {
  $("st-model").value = SET.model;
  $("st-effort").value = SET.effort;
  $("st-fallback").value = SET.fallback;
  $("st-perm").value = SET.perm;
  $("st-turns").value = SET.turns;
  $("st-auto").value = SET.auto;
  $("st-budget").value = SET.budget;
  $("st-disc").value = SET.disc;
  $("settings").style.display = "flex";
}
$("gear").onclick = openSettings;
$("st-cancel").onclick = () => { $("settings").style.display = "none"; };
$("st-save").onclick = () => {
  SET.model = $("st-model").value.trim() || SET.model;
  SET.effort = $("st-effort").value;
  SET.fallback = $("st-fallback").value.trim();
  SET.perm = $("st-perm").value;
  SET.turns = Number($("st-turns").value) || SET.turns;
  SET.auto = Number($("st-auto").value);
  SET.budget = Number($("st-budget").value) || SET.budget;
  SET.disc = Number($("st-disc").value) || SET.disc;
  $("settings").style.display = "none";
  showToast("設定を保存しました(モック: ローカルのみ)");
  render();
};
$("settings").addEventListener("click", (e) => { if (e.target === $("settings")) $("settings").style.display = "none"; });

render();
</script>
