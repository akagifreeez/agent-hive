<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>agent-hive</title>
<script src="/markdown.js"></script>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1216; --panel: #14181e; --panel2: #1a2028; --line: #242c37;
    --text: #d8dce2; --sub: #8b96a5; --accent: #4f8ef7; --accent2: #7fb5ff;
    --green: #8fd6a5; --amber: #ffd479; --red: #ff7a7a; --violet: #c8a7ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; overflow: hidden;
    font-family: "Meiryo", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--text);
    display: grid; grid-template-columns: 230px 1fr 360px;
  }
  h1 { font-size: 15px; margin: 0; }

  /* ============ 左: ナビ ============ */
  #nav { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 12px 10px; gap: 4px; }
  #nav .logo { padding: 4px 8px 12px; color: var(--accent2); font-weight: bold; font-size: 16px; }
  .navlabel { font-size: 11px; color: var(--sub); padding: 10px 8px 4px; text-transform: none; }
  .room { padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; position: relative; }
  .room:hover { background: var(--panel2); }
  .room.active { background: var(--accent); color: #fff; }
  .room .sub { display: block; font-size: 11px; color: var(--sub); margin-top: 2px; }
  .room.active .sub { color: #dbe7ff; }
  .badge { position: absolute; right: 8px; top: 8px; background: var(--red); color: #fff; border-radius: 9px; font-size: 10px; padding: 1px 6px; }
  #nav .foot { margin-top: auto; font-size: 11px; color: var(--sub); padding: 8px; }

  /* ============ 中央: 会話 ============ */
  #chat { display: flex; flex-direction: column; min-width: 0; }
  #roomhead { border-bottom: 1px solid var(--line); padding: 10px 18px; background: var(--panel); }
  #room-title { font-size: 15px; font-weight: bold; }
  #room-goal { font-size: 12px; color: var(--sub); margin-top: 2px; }
  #room-members { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .member { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; background: var(--panel2); border: 1px solid var(--line); border-radius: 14px; padding: 3px 10px; cursor: pointer; }
  .member:hover { border-color: var(--accent); }
  .member.sel { border-color: var(--accent); background: #1c2c44; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sub); }
  .dot.working { background: var(--amber); }
  .dot.done { background: var(--green); }
  .dot.error, .dot.budget-stop { background: var(--red); }
  #permzone { padding: 0 18px; }
  .permcard { background: #2a1c1c; border: 1px solid var(--red); border-radius: 8px; padding: 8px 12px; margin-top: 10px; font-size: 12px; }
  .permcard .cmd { font-family: Consolas, monospace; color: var(--amber); margin: 4px 0 8px; word-break: break-all; }
  .permcard button { background: var(--panel2); border: 1px solid var(--line); color: var(--text); border-radius: 6px; padding: 4px 14px; margin-right: 6px; cursor: pointer; }
  .permcard button.ok { background: var(--accent); border-color: var(--accent); color: #fff; }

  #stream { flex: 1; overflow-y: auto; padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 82%; border-radius: 10px; padding: 8px 12px; font-size: 13px; background: var(--panel2); border: 1px solid var(--line); }
  .msg .who { font-size: 11px; color: var(--accent2); margin-bottom: 3px; font-weight: bold; }
  .msg .who.beta { color: var(--green); }
  .msg .who.gamma { color: var(--amber); }
  .msg .who.system { color: var(--sub); }
  .msg p { margin: 4px 0; }
  .msg h1, .msg h2, .msg h3, .msg h4 { margin: 8px 0 4px; font-size: 13px; color: #cfe3ff; }
  .msg ul, .msg ol { margin: 4px 0; padding-left: 20px; }
  .msg blockquote { border-left: 3px solid var(--line); margin: 4px 0; padding: 2px 10px; color: var(--sub); }
  .msg code { background: #10131a; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; font-size: 12px; }
  .msg pre { background: #10131a; border: 1px solid var(--line); border-radius: 6px; padding: 8px; overflow-x: auto; font-size: 12px; }
  .msg pre code { border: none; padding: 0; background: none; }
  .msg table { border-collapse: collapse; margin: 6px 0; font-size: 12px; }
  .msg th, .msg td { border: 1px solid var(--line); padding: 3px 8px; text-align: left; }
  .msg a { color: var(--accent2); }
  .msg hr { border: none; border-top: 1px solid var(--line); margin: 8px 0; }
  .msg.mine { align-self: flex-end; background: #233246; border-color: #33475f; }
  .msg.mine .who { color: #e8ecf2; text-align: right; }
  .sysline { align-self: center; font-size: 11px; color: var(--sub); background: none; border: 1px dashed var(--line); border-radius: 12px; padding: 2px 12px; max-width: 90%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #composer { border-top: 1px solid var(--line); padding: 10px 18px 14px; background: var(--panel); }
  #composer .row { display: flex; gap: 8px; }
  #saytext { flex: 1; background: var(--panel2); border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 9px 12px; font-size: 13px; }
  #saybtn { background: var(--accent); border: none; color: #fff; border-radius: 8px; padding: 9px 18px; cursor: pointer; font-size: 13px; }
  #composer .hint { font-size: 11px; color: var(--sub); margin-top: 5px; }

  /* ============ 右: 状況パネル ============ */
  #ctx { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  #ctx-tabs { display: flex; border-bottom: 1px solid var(--line); }
  #ctx-tabs .ct { flex: 1; text-align: center; padding: 10px 0; font-size: 12px; color: var(--sub); cursor: pointer; border-bottom: 2px solid transparent; }
  #ctx-tabs .ct.active { color: var(--text); border-bottom-color: var(--accent); }
  #ctx-body { flex: 1; overflow-y: auto; padding: 12px; }
  .sec { font-size: 11px; color: var(--sub); margin: 10px 0 4px; }
  .sec:first-child { margin-top: 0; }
  .proj { font-size: 12px; color: var(--accent2); margin: 8px 0 2px; }
  .taskrow { display: flex; align-items: baseline; gap: 6px; padding: 3px 4px; border-radius: 4px; font-size: 12px; }
  .taskrow:hover { background: var(--panel2); }
  .taskrow .tid { color: var(--accent2); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 52%; flex-shrink: 0; }
  .taskrow .tsum { flex: 1; color: var(--sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .taskrow button { background: var(--panel2); border: 1px solid var(--line); color: var(--text); border-radius: 4px; font-size: 11px; padding: 1px 7px; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
  .taskrow button:hover { background: var(--line); }
  #newtask { display: flex; flex-direction: column; gap: 4px; margin-top: 10px; border-top: 1px solid var(--line); padding-top: 10px; }
  #newtask input, #newtask textarea { background: #10131a; border: 1px solid var(--line); color: var(--text); border-radius: 4px; padding: 4px 6px; font-size: 12px; }
  #newtask textarea { min-height: 44px; resize: vertical; }
  #newtask button { align-self: flex-end; background: var(--accent); border: none; color: #fff; border-radius: 4px; padding: 4px 10px; cursor: pointer; font-size: 12px; }

  .agentcard { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; cursor: pointer; font-size: 12px; }
  .agentcard:hover { border-color: var(--accent); }
  .agentcard.sel { border-color: var(--accent); background: #1c2c44; }
  .agentcard .nm { font-weight: bold; }
  .agentcard .st { float: right; color: var(--sub); font-size: 11px; }
  .agentcard .st.working { color: var(--amber); }
  .agentcard .st.done { color: var(--green); }
  .agentcard .st.error, .agentcard .st.budget-stop { color: var(--red); }
  .agentcard .meta { color: var(--sub); font-size: 11px; margin-top: 3px; }

  .alog { max-height: 46vh; overflow-y: auto; background: #10131a; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 12px; }
  .alog .entry { padding: 3px 0; border-bottom: 1px solid var(--panel); white-space: pre-wrap; word-break: break-word; }
  .alog .entry:last-child { border-bottom: none; }
  .alog .entry .k { color: var(--sub); margin-right: 4px; }
  .alog .entry.think .txt { color: var(--sub); }
  .alog .entry.say .txt { color: var(--text); }
  .alog .entry.tool .txt, .alog .entry.result .txt { font-family: Consolas, monospace; font-size: 11px; color: #8fb8d8; }
  .alog .entry.result .txt { color: #7fa88f; }
  .alog .entry.compact .txt { color: var(--violet); font-size: 11px; }
  .hint { color: var(--sub); font-size: 12px; padding: 6px 2px; }
  ul.files { list-style: none; padding: 0; margin: 4px 0; font-size: 12px; }
  ul.files li { cursor: pointer; padding: 2px 6px; border-radius: 4px; }
  ul.files li:hover { background: var(--panel2); }
  pre.fileview { background: #10131a; border: 1px solid var(--line); border-radius: 6px; padding: 8px; font-size: 12px; overflow-x: auto; white-space: pre-wrap; }
</style>
</head>
<body>
  <aside id="nav">
    <div class="logo">agent-hive</div>
    <div class="navlabel">スレッド</div>
    <div id="nav-rooms"></div>
    <div class="foot" id="nav-foot"></div>
  </aside>

  <main id="chat">
    <header id="roomhead">
      <div id="room-title"></div>
      <div id="room-goal"></div>
      <div id="room-members"></div>
    </header>
    <div id="permzone"></div>
    <div id="stream"></div>
    <div id="composer">
      <div class="row">
        <input id="saytext" placeholder="メッセージ">
        <button id="saybtn">送信</button>
      </div>
      <div class="hint" id="composer-hint"></div>
    </div>
  </main>

  <aside id="ctx">
    <div id="ctx-tabs">
      <div class="ct active" data-tab="tasks">タスク</div>
      <div class="ct" data-tab="agents">エージェント</div>
      <div class="ct" data-tab="files">ファイル</div>
    </div>
    <div id="ctx-body"></div>
  </aside>

<script>
/* ================= 状態 ================= */
let selectedThread = "__main__";
let selectedAgent = null;
let ctxTab = "tasks";
let projectFilter = "";
const unread = {}; // thread => 件数
let lastState = null;
const NAMES = { alpha: "アルファ", beta: "ベータ", gamma: "ガンマ", delta: "デルタ", system: "システム", you: "あなた", lead: "リーダー" };
const threadOf = (a) => a?.thread ?? "__main__";
const $ = (id) => document.getElementById(id);

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

/* ================= 左ナビ ================= */
function renderNav(threads) {
  const el = $("nav-rooms");
  el.innerHTML = "";
  const rooms = [
    { id: "__main__", label: "🤝 メイン", sub: "リーダーと壁打ち・計画" },
    ...(threads ?? []).filter((t) => t.name !== "__main__").map((t) => ({ id: t.name, label: "🧵 " + t.name, sub: t.goal })),
  ];
  for (const t of rooms) {
    const d = document.createElement("div");
    d.className = "room" + (selectedThread === t.id ? " active" : "");
    d.innerHTML = `${escapeHtml(t.label)}<span class="sub">${escapeHtml(t.sub ?? "")}</span>`;
    if (unread[t.id]) {
      const b = document.createElement("span");
      b.className = "badge";
      b.textContent = unread[t.id];
      d.appendChild(b);
    }
    d.onclick = () => {
      selectedThread = t.id;
      unread[t.id] = 0;
      selectedAgent = null;
      projectFilter = t.id === "__main__" ? "" : t.id;
      renderAll();
    };
    el.appendChild(d);
  }
}

/* ================= 中央: 会話 ================= */
function currentMembers(state) {
  return Object.entries(state.live.agents).filter(([id, a]) => threadOf(a) === selectedThread);
}

function renderRoomHead(state) {
  const th = (state.live.threads ?? []).find((t) => t.name === selectedThread);
  if (selectedThread === "__main__") {
    $("room-title").textContent = "🤝 メイン(壁打ち)";
    $("room-goal").textContent = "リーダーと計画を固める。実行はサブスレッドへ";
  } else {
    $("room-title").textContent = "🧵 " + selectedThread;
    $("room-goal").textContent = th?.goal ?? "";
  }
  const mem = $("room-members");
  mem.innerHTML = "";
  for (const [id, a] of currentMembers(state)) {
    const chip = document.createElement("span");
    chip.className = "member" + (selectedAgent === id ? " sel" : "");
    chip.innerHTML = `<span class="dot ${(a.status ?? "idle").replace(/\s/g, "")}"></span>${escapeHtml(a.displayName ?? NAMES[id] ?? id)}`;
    chip.title = `${a.status ?? "idle"} / turn ${a.turn ?? 0} — クリックで思考と活動`;
    chip.onclick = () => { selectedAgent = selectedAgent === id ? null : id; ctxTab = "agents"; renderAll(); };
    mem.appendChild(chip);
  }
  const hint = $("composer-hint");
  hint.textContent = selectedThread === "__main__"
    ? "このメッセージは リーダー に届きます"
    : `このメッセージは ${selectedThread} のメンバー全員に届きます`;
  $("saytext").placeholder = selectedThread === "__main__" ? "リーダーへメッセージ" : `${selectedThread} のメンバーへメッセージ`;
}

function renderStream(state) {
  const stream = $("stream");
  const nearBottom = stream.scrollHeight - stream.scrollTop - stream.clientHeight < 120;
  stream.innerHTML = "";
  for (const p of state.live.board) {
    if ((p.thread ?? "__main__") !== selectedThread) continue;
    if (p.from === "system") {
      const d = document.createElement("div");
      d.className = "sysline";
      d.textContent = "⚙ " + p.text.replace(/^\[[^\]]+\]\s*/, "");
      d.title = p.text;
      stream.appendChild(d);
      continue;
    }
    const mine = p.from === "you";
    const d = document.createElement("div");
    d.className = "msg" + (mine ? " mine" : "");
    const who = document.createElement("div");
    who.className = "who " + p.from;
    who.textContent = (mine ? "あなた" : (NAMES[p.from] ?? p.from)) + (mine ? "" : ` #${p.id}`);
    const body = document.createElement("div");
    body.innerHTML = renderMarkdown(p.text);
    d.append(who, body);
    stream.appendChild(d);
  }
  if (nearBottom) stream.scrollTop = stream.scrollHeight;
}

function renderPerms(requests) {
  const el = $("permzone");
  el.innerHTML = "";
  for (const r of (requests ?? []).filter((x) => x.state === "pending")) {
    const d = document.createElement("div");
    d.className = "permcard";
    d.innerHTML = `<b>🔐 コマンドの承認要求 #${r.id}</b><div class="cmd">${escapeHtml(r.command)}</div>`;
    const ok = document.createElement("button");
    ok.className = "ok";
    ok.textContent = "承認";
    ok.onclick = () => decide(r.id, true);
    const no = document.createElement("button");
    no.textContent = "拒否";
    no.onclick = () => decide(r.id, false);
    d.append(ok, no);
    el.appendChild(d);
  }
}

/* ================= 右: 状況パネル ================= */
function renderCtx(state) {
  for (const b of document.querySelectorAll("#ctx-tabs .ct")) {
    b.classList.toggle("active", b.dataset.tab === ctxTab);
  }
  const body = $("ctx-body");
  body.innerHTML = "";
  if (ctxTab === "tasks") renderTasksTab(body, state);
  if (ctxTab === "agents") renderAgentsTab(body, state);
  if (ctxTab === "files") renderFilesTab(body);
}

function renderTasksTab(body, state) {
  const list = state.taskList ?? { open: [], claimed: [], done: [] };
  const inThread = selectedThread !== "__main__";
  const all = [...list.open, ...list.claimed, ...list.done].filter((t) => !inThread || (t.project || "") === selectedThread);
  const projects = [...new Set(all.map((t) => t.project || ""))].sort();

  if (inThread) {
    const s = document.createElement("div");
    s.className = "sec";
    s.textContent = `このスレッド(${selectedThread})のタスク`;
    body.appendChild(s);
  } else {
    const sel = document.createElement("select");
    sel.id = "projfilter";
    sel.style.cssText = "width:100%;background:#10131a;border:1px solid var(--line);color:var(--text);border-radius:4px;padding:4px 6px;font-size:12px;";
    const opts = ["", ...projects, "__none__"];
    const cur = projectFilter;
    for (const p of opts) {
      const o = document.createElement("option");
      o.value = p;
      o.textContent = p === "" ? "すべてのプロジェクト" : p === "__none__" ? "(未分類)" : p;
      sel.appendChild(o);
    }
    sel.value = cur;
    if (!opts.includes(cur)) { projectFilter = ""; sel.value = ""; }
    sel.onchange = (e) => { projectFilter = e.target.value; renderCtx(lastState); };
    body.appendChild(sel);
  }

  const visible = all.filter((t) => inThread || projectFilter === "" || (projectFilter === "__none__" ? !t.project : (t.project || "") === projectFilter));
  const groups = inThread ? [["", ""]] : [...projects.map((p) => [p, p]), ["", "(未分類)"]];
  const secs = [
    ["open", "未着手", () => ({ label: "中止", action: "cancel" })],
    ["claimed", "作業中", () => ({ label: "解放", action: "release" })],
    ["done", "完了", () => ({ label: "再開", action: "reopen" })],
  ];
  for (const [proj, label] of groups) {
    const inProj = visible.filter((t) => (t.project || "") === proj);
    if (!inProj.length) continue;
    const ph = document.createElement("div");
    ph.className = "proj";
    ph.textContent = "◆ " + label;
    body.appendChild(ph);
    for (const [st, stLabel, btn] of secs) {
      const rows = inProj.filter((t) => t.state === st);
      if (!rows.length) continue;
      const sh = document.createElement("div");
      sh.className = "sec";
      sh.textContent = `${stLabel}(${rows.length})`;
      body.appendChild(sh);
      for (const t of rows) {
        const row = document.createElement("div");
        row.className = "taskrow";
        const id = document.createElement("span");
        id.className = "tid";
        id.textContent = t.id + (t.agent && !["auto", "you"].includes(t.agent) ? ` @${t.agent}` : "");
        id.title = t.summary;
        id.onclick = () => showTaskBody(t);
        const sum = document.createElement("span");
        sum.className = "tsum";
        sum.textContent = t.summary;
        sum.onclick = () => showTaskBody(t);
        const mv = document.createElement("button");
        mv.textContent = "移動";
        mv.title = "プロジェクトを付け替える";
        mv.onclick = async (e) => {
          e.stopPropagation();
          const p = prompt(`プロジェクト名(空欄で未分類):`, t.project || "");
          if (p === null) return;
          await taskAction({ action: "reproject", path: t.path, project: p });
        };
        const b = document.createElement("button");
        const spec = btn(t);
        b.textContent = spec.label;
        b.onclick = (e) => { e.stopPropagation(); taskAction({ action: spec.action, id: t.id, agent: t.agent }); };
        row.append(id, sum, mv, b);
        body.appendChild(row);
      }
    }
  }

  const form = document.createElement("div");
  form.id = "newtask";
  form.innerHTML = `
    <div class="sec">新しいタスクを投入${inThread ? `(project: ${escapeHtml(selectedThread)})` : ""}</div>
    <input id="nt-id" placeholder="task_id(空欄で自動採番)">
    ${inThread ? "" : '<input id="nt-project" placeholder="project(任意、例: cuda-compress)">'}
    <input id="nt-role" placeholder="role(impl/review等、空欄で誰でも)">
    <textarea id="nt-body" placeholder="何を / どう確認するか / 完了条件"></textarea>
    <button id="nt-add">投入(トークン消費なし)</button>`;
  body.appendChild(form);
  form.querySelector("#nt-add").onclick = createTask;
}

function renderAgentsTab(body, state) {
  const members = currentMembers(state);
  const sel = document.createElement("div");
  sel.className = "sec";
  sel.textContent = "このスレッドのエージェント(クリックで思考ログ)";
  body.appendChild(sel);
  for (const [id, a] of members) {
    const card = document.createElement("div");
    card.className = "agentcard" + (selectedAgent === id ? " sel" : "");
    const label = a.displayName ?? NAMES[id] ?? id;
    card.innerHTML = `<span class="nm">${escapeHtml(label)}</span><span class="st ${(a.status ?? "idle").replace(/\s/g, "")}">${escapeHtml(a.status ?? "idle")}</span>` +
      `<div class="meta">turn ${a.turn ?? 0}${a.lastTool ? ` / ${escapeHtml(a.lastTool)}` : ""}${a.tokens ? ` / ${a.tokens.toLocaleString()}tok / $${(a.costUsd ?? 0).toFixed(4)}` : ""}</div>`;
    card.onclick = () => { selectedAgent = selectedAgent === id ? null : id; renderCtx(lastState); };
    body.appendChild(card);
    if (selectedAgent === id) body.appendChild(renderAgentLog(a));
  }
  if (!members.length) {
    const h = document.createElement("div");
    h.className = "hint";
    h.textContent = "このスレッドにはまだエージェントがいません。";
    body.appendChild(h);
  }
}

function renderAgentLog(a) {
  const wrap = document.createElement("div");
  wrap.className = "alog";
  const icons = { think: "💭", say: "💬", tool: "🔧", result: "↳", status: "●", compact: "🗜" };
  if (!a.log?.length) {
    const h = document.createElement("div");
    h.className = "hint";
    h.textContent = "まだ活動がありません。稼働すると思考(💭)・発言(💬)・ツール(🔧)・結果(↳)が流れます。";
    wrap.appendChild(h);
  }
  for (const e of a.log ?? []) {
    const d = document.createElement("div");
    d.className = "entry " + e.kind;
    const k = document.createElement("span");
    k.className = "k";
    k.textContent = icons[e.kind] ?? "•";
    const t = document.createElement("span");
    t.className = "txt";
    t.textContent = e.text;
    d.append(k, t);
    wrap.appendChild(d);
  }
  requestAnimationFrame(() => { wrap.scrollTop = wrap.scrollHeight; });
  return wrap;
}

async function renderFilesTab(body) {
  const files = lastState?.files ?? [];
  const ul = document.createElement("ul");
  ul.className = "files";
  for (const f of files) {
    const li = document.createElement("li");
    li.textContent = f;
    li.onclick = async () => {
      const r = await (await fetch("/api/file?path=" + encodeURIComponent(f))).json();
      let pre = body.querySelector("pre.fileview");
      if (pre) pre.remove();
      pre = document.createElement("pre");
      pre.className = "fileview";
      pre.textContent = r.content ?? "";
      body.appendChild(pre);
    };
    ul.appendChild(li);
  }
  body.appendChild(ul);
  const h = document.createElement("div");
  h.className = "hint";
  h.textContent = "ファイル名をクリックすると内容が下に表示されます。";
  body.appendChild(h);
}

async function showTaskBody(t) {
  const r = await (await fetch("/api/file?path=" + encodeURIComponent(t.path))).json();
  ctxTab = "tasks";
  const body = $("ctx-body");
  let pre = body.querySelector("pre.fileview");
  if (pre) pre.remove();
  pre = document.createElement("pre");
  pre.className = "fileview";
  pre.textContent = `# ${t.id}\n\n` + (r.content ?? "");
  body.appendChild(pre);
}

/* ================= アクション ================= */
async function taskAction(payload) {
  const r = await (await fetch("/api/tasks", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(payload) })).json();
  if (r.error) alert(r.error);
  refresh();
}

async function createTask() {
  const id = $("nt-id")?.value.trim() ?? "";
  const projectInput = $("nt-project");
  const project = projectInput ? projectInput.value.trim() : selectedThread === "__main__" ? "" : selectedThread;
  const role = $("nt-role").value.trim();
  const body = $("nt-body").value.trim();
  if (!body) { alert("本文(何を/完了条件)を書いてください"); return; }
  const r = await (await fetch("/api/tasks", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ action: "create", id, project, role, body }) })).json();
  if (r.error) { alert(r.error); return; }
  $("nt-id").value = "";
  if (projectInput) projectInput.value = "";
  $("nt-role").value = "";
  $("nt-body").value = "";
  refresh();
}

async function decide(id, approve) {
  await fetch("/api/permission", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ id, approve }) });
  refresh();
}

async function sendSay() {
  const el = $("saytext");
  const text = el.value.trim();
  if (!text) return;
  el.value = "";
  await fetch("/api/say", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ text, thread: selectedThread === "__main__" ? null : selectedThread }) });
}

/* ================= 全体描画 ================= */
function renderAll() {
  if (!lastState) return;
  renderNav(lastState.live.threads);
  renderRoomHead(lastState);
  renderStream(lastState);
  renderPerms(lastState.live.requests);
  renderCtx(lastState);
  $("nav-foot").textContent = lastState.live.scenario ? `${lastState.live.scenario.name} [${lastState.live.scenario.phase}]` : "";
}

async function refresh() {
  lastState = await (await fetch("/api/state")).json();
  renderAll();
}

let refreshQueued = false;
function refreshSoon() {
  if (refreshQueued) return;
  refreshQueued = true;
  setTimeout(() => { refreshQueued = false; refresh(); }, 600);
}

/* ================= イベント配線 ================= */
const es = new EventSource("/events");
es.onmessage = (e) => {
  const { type, payload } = JSON.parse(e.data);
  if (type === "board") {
    const th = payload.thread ?? "__main__";
    if (th === selectedThread) {
      refreshSoon(); // デバウンス付きで全再描画(ストリームは毎回全件から組み直す)
    } else {
      unread[th] = (unread[th] ?? 0) + 1;
      if (lastState) renderNav(lastState.live.threads);
    }
    return;
  }
  if (["agent.turn", "tool.call", "tool.result", "agent.status", "agent.spawned", "thread.opened",
       "task.claimed", "task.finished", "task.created", "task.released", "task.cancelled", "task.autoResolved",
       "scenario.started", "scenario.finished"].includes(type)) {
    refreshSoon();
  }
};
$("saybtn").onclick = sendSay;
$("saytext").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) sendSay(); });
for (const b of document.querySelectorAll("#ctx-tabs .ct")) {
  b.onclick = () => { ctxTab = b.dataset.tab; renderCtx(lastState); };
}
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
