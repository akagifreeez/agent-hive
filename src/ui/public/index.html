<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>agent-hive</title>
<script src="/markdown.js"></script>
<style>
  /* 構造はDiscord、色は黒灰基調+細部のオレンジアクセントのみ。
     設計上の要点: UIはサンセリフ/等幅はログ・ID・コードのみ、絵文字は使わない、
     案内文は書かずhoverと色で示す、サイズは11/12/13/15の4段階 */
  :root {
    color-scheme: dark;
    --bg: #19191b;
    --panel: #151517;
    --panel2: #2b2b30;
    --line: #2c2c31;
    --line-strong: #43434b;
    --label: #eaeaea;
    --label-secondary: #a3a3a8;
    --label-tertiary: #717177;
    --separator: #2c2c31;
    --fill: rgba(255, 255, 255, 0.055);
    --fill-strong: rgba(255, 255, 255, 0.10);
    --accent: #f5a35b;
    --accent-fill: rgba(245, 163, 91, 0.12);
    --accent-contrast: #1c1208;
    --ok: #86efac; --warn: #fbbf24; --err: #fca5a5;
    --bg-elevated: #202023;
    --recess: #131315;
    --sub: #a3a3a8;
    --shadow-overlay: 0 8px 24px rgba(0, 0, 0, 0.55);
    --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.30), 0 2px 6px rgba(0, 0, 0, 0.18);
    --inset-field: inset 0 1px 2px rgba(0, 0, 0, 0.28);
    --ease: cubic-bezier(0.25, 0.1, 0.25, 1);
    --duration: 150ms;
    --font-ui: system-ui, "Segoe UI", "Meiryo", "Noto Sans JP", sans-serif;
    --font-mono: ui-monospace, "Cascadia Mono", Consolas, "SFMono-Regular", monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f0f0f2;
      --panel: #f7f7f8;
      --panel2: #e8e8ea;
      --line: #e3e3e5;
      --line-strong: #c0c0c6;
      --label: #212124;
      --label-secondary: #6d6d72;
      --label-tertiary: #939398;
      --separator: #e2e2e4;
      --fill: rgba(0, 0, 0, 0.05);
      --fill-strong: rgba(0, 0, 0, 0.09);
      --accent: #b45309;
      --accent-fill: rgba(180, 83, 9, 0.10);
      --accent-contrast: #ffffff;
      --ok: #1a7f37; --warn: #9a6700; --err: #cf222e;
      --bg-elevated: #ffffff;
      --recess: #e9e9ec;
      --sub: #6d6d72;
      --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.08), 0 2px 6px rgba(0, 0, 0, 0.06);
      --inset-field: inset 0 1px 2px rgba(0, 0, 0, 0.06);
    }
  }
  * { box-sizing: border-box; }
  @media (prefers-color-scheme: light) {
    .member .anm, .msg .who, .agentcard .nm { color: hsl(var(--ah, 210) 45% 36%); }
  }
  body {
    margin: 0; height: 100vh; overflow: hidden;
    font-family: var(--font-ui);
    background: var(--bg); color: var(--label);
    display: grid; grid-template-columns: 240px 1fr 340px;
    grid-template-rows: minmax(0, 1fr);
    font-size: 13px; line-height: 1.45;
  }
  .mono { font-family: var(--font-mono); }

  .btn { background: var(--fill); border: none; color: var(--label); border-radius: 4px; padding: 4px 12px; font-size: 12px; font-family: var(--font-ui); cursor: pointer; transition: background var(--duration) var(--ease), box-shadow var(--duration) var(--ease), transform var(--duration) var(--ease); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 1px 2px rgba(0, 0, 0, 0.22); }
  .btn:hover { background: var(--fill-strong); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 2px 5px rgba(0, 0, 0, 0.28); }
  .btn:active { transform: translateY(1px); box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.20); }
  .btn.primary { background: var(--accent); color: var(--accent-contrast); font-weight: 600; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25), 0 1px 3px rgba(0, 0, 0, 0.35); }

  /* ============ 左: ナビ ============ */
  #nav { background: var(--bg-elevated); border-right: 1px solid var(--separator); display: flex; flex-direction: column; padding: 10px 8px; gap: 1px; min-height: 0; overflow-y: auto; }
  #nav .logo { padding: 4px 8px 12px; color: var(--label); font-weight: 700; font-size: 15px; }
  #nav-search { background: var(--recess); border: 1px solid var(--separator); color: var(--label); border-radius: 4px; padding: 5px 8px; font-size: 12px; font-family: var(--font-ui); margin: 0 8px 4px; box-shadow: var(--inset-field); }
  #nav-search:focus { outline: none; border-color: var(--accent); }
  #nav-search::placeholder { color: var(--label-tertiary); }
  .navlabel { font-size: 11px; color: var(--label-tertiary); border-top: 1px solid var(--separator); margin: 8px 4px 0; padding: 8px 4px 3px; }
  #nav-main { margin-bottom: 2px; }
  .room { padding: 5px 8px 6px; border-radius: 4px; cursor: pointer; font-size: 13px; position: relative; transition: background var(--duration) var(--ease); }
  .room:hover { background: var(--fill); }
  .room.active { background: var(--fill-strong); box-shadow: inset 2px 0 0 var(--accent); }
  .room .sub { display: block; font-size: 11px; color: var(--label-tertiary); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .room.active .sub { color: var(--label-secondary); }
  .badge { position: absolute; right: 8px; top: 6px; background: var(--err); color: var(--accent-contrast); border-radius: 8px; font-size: 10px; font-weight: 700; padding: 0 5px; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.35); }
  #nav .foot { margin-top: auto; font-size: 11px; color: var(--label-tertiary); padding: 8px; }

  /* ============ 中央: 会話 ============ */
  #chat { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #roomhead { border-bottom: 1px solid var(--separator); padding: 9px 16px; background: var(--bg-elevated); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.16); position: relative; z-index: 2; }
  #room-title { font-size: 15px; font-weight: 700; }
  #room-goal { font-size: 12px; color: var(--label-secondary); margin-top: 1px; }
  #room-members { display: flex; gap: 6px; margin-top: 7px; flex-wrap: wrap; align-items: center; }
  .member .anm { color: hsl(var(--ah, 210) 45% 74%); }
  .member { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; background: var(--fill); border: none; border-radius: 12px; padding: 2px 9px; cursor: pointer; color: var(--label); transition: background var(--duration) var(--ease), box-shadow var(--duration) var(--ease); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 1px 2px rgba(0, 0, 0, 0.18); }
  .member:hover { background: var(--fill-strong); }
  .member.sel { background: var(--accent-fill); box-shadow: 0 0 0 1px var(--accent), 0 1px 3px rgba(0, 0, 0, 0.25); }
  .member.passive { cursor: default; color: var(--label-secondary); }
  .member.passive:hover { background: var(--fill); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--label-tertiary); flex-shrink: 0; }
  .dot.working { background: var(--warn); }
  .dot.done { background: var(--ok); }
  .dot.error, .dot.budget-stop { background: var(--err); }
  #permzone { padding: 0 16px; }
  .permcard { background: var(--bg-elevated); border: 1px solid var(--line-strong); border-radius: 6px; padding: 8px 12px; margin-top: 10px; font-size: 13px; box-shadow: var(--shadow-card); }
  .permcard b { color: var(--err); font-size: 12px; }
  .permcard .cmd { font-family: var(--font-mono); font-size: 12px; color: var(--label); margin: 4px 0 8px; word-break: break-all; }
  .permcard .btn { margin-right: 6px; }

  #stream { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 1px; }
  /* 投稿をflexで縮めない: 潰れると文字がクリップされて読めなくなる。あふれはスクロールで扱う */
  #stream > * { flex-shrink: 0; }
  .msg { padding: 5px 10px; font-size: 13px; border-radius: 4px; }
  .msg:hover { background: var(--fill); }
  .msg .who { font-size: 12px; color: hsl(var(--ah, 210) 45% 74%); margin-bottom: 2px; font-weight: 600; }
  .msg.mine { background: var(--accent-fill); box-shadow: inset 2px 0 0 var(--accent); }
  .msg.mine .who { color: var(--accent); }
  .msg p { margin: 3px 0; }
  .msg h1, .msg h2, .msg h3, .msg h4 { margin: 8px 0 4px; font-size: 13px; color: var(--label); }
  .msg ul, .msg ol { margin: 3px 0; padding-left: 20px; }
  .msg blockquote { border-left: 2px solid var(--separator); margin: 3px 0; padding: 2px 10px; color: var(--label-secondary); }
  .msg code { background: var(--fill); border-radius: 3px; padding: 0 4px; font-family: var(--font-mono); font-size: 12px; }
  .msg pre { background: var(--recess); border: 1px solid var(--separator); border-radius: 4px; padding: 8px; overflow-x: auto; font-family: var(--font-mono); font-size: 12px; box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.18); }
  .msg pre code { padding: 0; background: none; }
  .msg table { border-collapse: collapse; margin: 5px 0; font-size: 12px; }
  .msg th, .msg td { border: 1px solid var(--separator); padding: 2px 8px; text-align: left; }
  .msg a { color: var(--accent); }
  .msg hr { border: none; border-top: 1px solid var(--separator); margin: 8px 0; }
  .msg img.md-img { min-height: 48px; max-width: 100%; object-fit: contain; background: var(--bg); border-radius: 4px; display: block; margin: 4px 0; }
  .sysline { font-size: 11px; color: var(--label-tertiary); padding: 3px 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sysline.merge { cursor: pointer; border-radius: 4px; }
  .sysline.merge:hover { background: var(--fill); color: var(--label-secondary); }
  .mergediff { background: var(--recess); border: 1px solid var(--separator); border-radius: 4px; padding: 8px; margin: 2px 10px; font-family: var(--font-mono); font-size: 11px; white-space: pre-wrap; word-break: break-word; max-height: 40vh; overflow-y: auto; color: var(--label-secondary); }
  .set-mcp-list .mcp-row { display: flex; gap: 6px; align-items: center; font-size: 11px; padding: 2px 0; font-family: var(--font-mono); }
  .set-mcp-list .mcp-row .nm { color: var(--label); font-weight: 600; }
  .set-mcp-list .mcp-row .cmd { color: var(--label-tertiary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .set-mcp-list .mcp-row .btn { padding: 1px 8px; font-size: 10px; }
  .mcp-add { display: flex; gap: 4px; margin-top: 4px; }
  .mcp-add input { background: var(--recess); border: 1px solid var(--separator); color: var(--label); border-radius: 4px; padding: 3px 6px; font-size: 11px; font-family: var(--font-ui); }
  .mcp-add input:focus { outline: none; border-color: var(--accent); }
  .mfb { display: flex; gap: 6px; margin: 4px 10px 6px; align-items: stretch; }
  .mfb textarea { flex: 1; background: var(--recess); border: 1px solid var(--separator); border-radius: 4px; color: var(--label); font: inherit; font-size: 12px; padding: 6px 8px; resize: vertical; }
  .mfb textarea:focus { outline: none; border-color: var(--accent); }
  .mfb .btn { white-space: nowrap; }
  .loadmore { align-self: center; font-size: 12px; color: var(--accent); cursor: pointer; padding: 6px 14px; border-radius: 4px; }
  .loadmore:hover { background: var(--fill); }
  .folder-h { font-size: 10px; color: var(--label-tertiary); padding: 8px 8px 2px; font-weight: 600; }
  .room-folder-btn { margin-left: auto; background: none; border: none; color: var(--label-tertiary); cursor: pointer; font-size: 10px; padding: 0 3px; opacity: 0; flex-shrink: 0; }
  .room:hover .room-folder-btn { opacity: 1; }
  .room-folder-btn:hover { color: var(--accent); }
  .room-folder-btn + .room-folder-btn { margin-left: 0; }
  .room-folder-btn.paused { opacity: 1; color: var(--accent); }
  .room.paused .sub { color: var(--accent); }

  #composer { border-top: 1px solid var(--separator); padding: 10px 16px 12px; background: var(--bg-elevated); position: relative; box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.14); }
  #suggest { position: absolute; bottom: 100%; left: 16px; right: 16px; background: var(--bg-elevated); border: 1px solid var(--line-strong); border-radius: 6px; box-shadow: var(--shadow-overlay); max-height: 240px; overflow-y: auto; z-index: 5; }
  #suggest .sug { padding: 4px 12px; cursor: pointer; font-size: 12px; color: var(--label); }
  #suggest .sug b { font-family: var(--font-mono); font-weight: 600; }
  #suggest .sug .d { color: var(--label-tertiary); margin-left: 8px; font-size: 11px; }
  #suggest .sug:hover, #suggest .sug.sel { background: var(--accent-fill); }
  #composer .row { display: flex; gap: 6px; }
  #saytext { flex: 1; background: var(--recess); border: 1px solid var(--separator); color: var(--label); border-radius: 4px; padding: 7px 10px; font-size: 13px; font-family: var(--font-ui); box-shadow: var(--inset-field); }
  #saytext:focus { outline: none; border-color: var(--accent); }
  #attachbtn { width: 34px; flex-shrink: 0; background: var(--fill); border: none; color: var(--label-secondary); border-radius: 4px; font-size: 16px; cursor: pointer; transition: background var(--duration) var(--ease), color var(--duration) var(--ease); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 1px 2px rgba(0, 0, 0, 0.22); }
  #attachbtn:hover { background: var(--fill-strong); color: var(--label); }
  #attachbtn:active { transform: translateY(1px); }
  #composer .hint { font-size: 11px; color: var(--label-tertiary); margin-top: 5px; }
  #composer .composer-opts { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  #composer .composer-opts .lbl { font-size: 11px; color: var(--label-tertiary); flex-shrink: 0; }
  #composer .composer-opts input { flex: 0 1 300px; background: var(--recess); border: 1px solid var(--separator); color: var(--label); border-radius: 4px; padding: 3px 8px; font-size: 11px; font-family: var(--font-ui); box-shadow: var(--inset-field); }
  #composer .composer-opts input:focus { outline: none; border-color: var(--accent); }
  #composer .composer-opts select { background: var(--recess); border: 1px solid var(--separator); color: var(--label); border-radius: 4px; padding: 3px 6px; font-size: 11px; font-family: var(--font-ui); }

  /* ============ 右: 状況パネル ============ */
  #ctx { background: var(--bg-elevated); border-left: 1px solid var(--separator); display: flex; flex-direction: column; min-height: 0; }
  table.usage-tbl { width: 100%; border-collapse: collapse; font-size: 11.5px; font-family: var(--font-mono); margin-bottom: 4px; }
  table.usage-tbl th { text-align: left; color: var(--label-tertiary); font-weight: 600; padding: 2px 6px; border-bottom: 1px solid var(--separator); }
  table.usage-tbl td { padding: 2px 6px; border-bottom: 1px solid var(--separator); }
  table.usage-tbl tr.total td { color: var(--label); border-top: 1px solid var(--line-strong); font-weight: 600; }
  table.audit-tbl { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 11px; font-family: var(--font-mono); }
  table.audit-tbl th { text-align: left; color: var(--label-tertiary); font-weight: 600; padding: 2px 6px; border-bottom: 1px solid var(--separator); position: sticky; top: 0; background: var(--bg); }
  table.audit-tbl td { padding: 2px 6px; border-bottom: 1px solid var(--separator); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
  table.audit-tbl td.okmark { width: 14px; text-align: center; }
  table.audit-tbl .ok-y { color: var(--ok); }
  table.audit-tbl .ok-n { color: var(--err); }
  table.audit-tbl tr.blk td { color: var(--label-tertiary); }
  .audit-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .session-row { display: flex; gap: 6px; margin-bottom: 6px; }
  .session-row input { flex: 1; background: var(--recess); border: 1px solid var(--separator); color: var(--label); border-radius: 4px; padding: 4px 8px; font-size: 12px; box-shadow: var(--inset-field); }
  .session-row input:focus { outline: none; border-color: var(--accent); }
  .session-item { display: flex; justify-content: space-between; align-items: center; padding: 3px 6px; font-size: 12px; border-bottom: 1px solid var(--separator); }
  .session-item:hover { background: var(--fill); }
  #ctx-tabs { display: flex; border-bottom: 1px solid var(--separator); overflow-x: auto; scrollbar-width: none; }
  #ctx-tabs::-webkit-scrollbar { display: none; }
  #ctx-tabs .ct { flex: 1 0 auto; white-space: nowrap; text-align: center; padding: 8px 7px; font-size: 11px; color: var(--label-secondary); cursor: pointer; border-bottom: 2px solid transparent; transition: color var(--duration) var(--ease); }
  #ctx-tabs .ct:hover { color: var(--label); }
  #ctx-tabs .ct.active { color: var(--accent); border-bottom-color: var(--accent); }
  body.nopanel { grid-template-columns: 240px 1fr; }
  body.nopanel #ctx { display: none; }
  body.widepanel { grid-template-columns: 240px 1fr 640px; }
  #panel-btn { position: absolute; right: 188px; top: 9px; background: var(--panel2); border: 1px solid var(--separator); color: var(--sub); border-radius: 4px; padding: 3px 10px; font-size: 11px; cursor: pointer; }
  #panel-btn:hover { color: var(--label); border-color: var(--line-strong); }
  #browserpane { display: none; flex: 1; flex-direction: column; min-height: 0; }
  .bbar { display: flex; gap: 4px; padding: 5px; border-bottom: 1px solid var(--separator); }
  .bbar input { flex: 1; background: var(--recess); border: 1px solid var(--separator); color: var(--label); border-radius: 4px; padding: 4px 8px; font-size: 11px; font-family: var(--font-mono); box-shadow: var(--inset-field); }
  .bbar input:focus { outline: none; border-color: var(--accent); }
  .bbar button { background: var(--fill); border: none; color: var(--label); border-radius: 4px; padding: 3px 9px; font-size: 12px; cursor: pointer; }
  .bbar button:hover { background: var(--fill-strong); }
  #bview { width: 100%; flex: 1; }
  #ctx-body { flex: 1; overflow-y: auto; padding: 10px; }
  .sec { font-size: 11px; color: var(--label-tertiary); margin: 10px 0 3px; }
  .sec:first-child { margin-top: 0; }
  .proj { font-size: 12px; color: var(--label); font-weight: 700; margin: 10px 0 2px; }
  .taskrow { display: flex; align-items: baseline; gap: 6px; padding: 2px 4px; border-radius: 4px; font-size: 12px; min-height: 24px; }
  .taskrow:hover { background: var(--fill); }
  .taskrow .tid { font-family: var(--font-mono); font-size: 11px; color: var(--accent); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 52%; flex-shrink: 0; }
  .taskrow .tsum { flex: 1; color: var(--label-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .acc { display: inline-block; font-size: 10px; color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); border-radius: 3px; padding: 0 4px; margin-right: 2px; vertical-align: 1px; }
  .acc.dep { color: #e8a33d; border-color: color-mix(in srgb, #e8a33d 45%, transparent); }
  .taskrow .btn { padding: 1px 8px; font-size: 11px; flex-shrink: 0; }
  select.filter { width: 100%; background: var(--recess); border: 1px solid var(--separator); color: var(--label); border-radius: 4px; padding: 4px 6px; font-size: 12px; font-family: var(--font-ui); box-shadow: var(--inset-field); }
  #newtask { display: flex; flex-direction: column; gap: 4px; margin-top: 12px; border-top: 1px solid var(--separator); padding-top: 10px; }
  #newtask input, #newtask textarea { background: var(--recess); border: 1px solid var(--separator); color: var(--label); border-radius: 4px; padding: 5px 7px; font-size: 12px; font-family: var(--font-ui); box-shadow: var(--inset-field); }
  #newtask input:focus, #newtask textarea:focus { outline: none; border-color: var(--accent); }
  #newtask textarea { min-height: 44px; resize: vertical; }
  #newtask .btn { align-self: flex-end; }

  .agentcard { background: transparent; border-radius: 4px; padding: 6px 8px; margin-bottom: 2px; cursor: pointer; font-size: 12px; transition: background var(--duration) var(--ease), box-shadow var(--duration) var(--ease); }
  .agentcard:hover { background: var(--fill); }
  .agentcard.sel { background: var(--accent-fill); box-shadow: inset 2px 0 0 var(--accent); }
  .agentcard .nm { font-weight: 600; color: hsl(var(--ah, 210) 45% 74%); }
  .agentcard .st { float: right; color: var(--label-secondary); font-size: 11px; }
  .agentcard .st.working { color: var(--warn); }
  .agentcard .st.done { color: var(--ok); }
  .agentcard .st.error, .agentcard .st.budget-stop { color: var(--err); }
  .agentcard .meta { color: var(--label-tertiary); font-size: 11px; font-family: var(--font-mono); margin-top: 2px; }
  .agentcard .wtdiff-btn { float: right; margin-right: 4px; background: var(--fill); border: 1px solid var(--separator); color: var(--label-secondary); border-radius: 4px; font-size: 10px; padding: 1px 6px; cursor: pointer; font-family: var(--font-ui); }
  .agentcard .wtdiff-btn:hover { color: var(--label); border-color: var(--line-strong); }
  .wtdiff { background: var(--recess); border: 1px solid var(--separator); border-radius: 4px; margin: 2px 0 8px; max-height: 55vh; overflow-y: auto; box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.18); }
  .wtdiff .wtdiff-head { display: flex; justify-content: space-between; align-items: center; padding: 3px 8px; background: var(--fill); font-family: var(--font-mono); font-size: 11px; color: var(--sub); position: sticky; top: 0; }
  .wtdiff .wtdiff-head button { background: none; border: none; color: var(--label-tertiary); cursor: pointer; font-size: 13px; padding: 0 3px; }
  .wtdiff .wtdiff-head button:hover { color: var(--label); }

<body>
  <aside id="nav">

<script>
/* ================= 状態 ================= */
// POST用CSRFトークン(サーバーがHTML配信時に下のnullを実トークンへ置換する)。
// 全POSTは hfetch 経由で X-Hive-Token を付ける
window.HIVE_TOKEN = "__HIVE_TOKEN__";
function hfetch(url, opts = {}) {
  if ((opts.method ?? "GET") === "POST") {
    opts.headers = { ...(opts.headers ?? {}), "x-hive-token": window.HIVE_TOKEN ?? "" };
  }
  return fetch(url, opts);
}
let selectedThread = "__main__";
// スラッシュコマンドの定義(/helpはこの一覧から自動生成)
const COMMANDS = {
  help: "コマンド一覧",
  workflow: "ワークフロー実行(/workflow <名前>)",
  tasks: "現在のタスク一覧(/tasks done で完了も)",
  usage: "エージェント別の消費",
  threads: "スレッド一覧",
  session: "セッションの保存/復元(/session save <名前>)",
  model: "現在のモデル表示",
  thread: "スレッドを直接開く(/thread <名前> <目標>)",
  close: "スレッドを閉じる(/close <名前>)",
  clear: "このスレッドのチャット履歴をクリア(/clear・タスクとメモリは残る)",
};
let customCommands = {};
let uiEffort = null;
let uiModelName = null;
let selectedAgent = null;
let ctxTab = "tasks";
let projectFilter = "";
let showDoneTasks = false; // タスクタブ: 既定は進行中のみ。チェックで完了済み(過去)も出す
const unread = {}; // thread => 件数
let lastState = null;
// ボード描画の窓(末尾N件)とマージ差分の展開状態。スレッド切替でリセット
const BOARD_WINDOW = 200;
let boardWindow = BOARD_WINDOW;
const expandedMerges = new Set();
// スレッド別ボードキャッシュ(thread → 投稿配列)。/api/state のRAM末尾はメイン会話で
// 埋まるため、スレッド表示はこれを使わずディスク(/api/board?thread=)から直接引く。
// refresh()でlastStateが差し替わってもキャッシュは消えない。新着はSSE経由でpush
const threadBoards = new Map();
const threadBoardFetching = new Set();
let anchorPid = null;
const NAMES = { alpha: "アルファ", beta: "ベータ", gamma: "ガンマ", delta: "デルタ", system: "システム", you: "あなた", lead: "リーダー" };
// ワーカー識別色: エージェントIDのハッシュから色相を安定生成する(状態はドットの色が担う)
const agentHue = (id) => {
  let h = 0;
  for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) % 360;
  return h;
};
const STATUS_JA = { idle: "待機", thinking: "思考中", working: "作業中", done: "完了", error: "エラー", "budget-stop": "停止" };
const statusJa = (s) => STATUS_JA[s ?? "idle"] ?? (s ?? "idle");
const KIND_JA = { think: "思考", say: "発言", tool: "ツール", result: "結果", status: "状態", compact: "要約" };
const threadOf = (a) => a?.thread ?? "__main__";
const $ = (id) => document.getElementById(id);

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

/* ================= 左ナビ ================= */
let navQuery = "";
function renderNav(threads) {
  // メインはスレッド一覧から分離してナビ最上部の独立セクションに置く
  const all = (threads ?? []).filter((t) => t.name !== "__main__");
  const q = navQuery.trim().toLowerCase();
  const ths = q ? all.filter((t) => t.name.toLowerCase().includes(q) || (t.goal ?? "").toLowerCase().includes(q) || (t.folder ?? "").toLowerCase().includes(q)) : all;
  $("nav-thread-label").textContent = `スレッド${all.length ? ` (${ths.length}/${all.length})` : ""}`;
  const makeRoom = (parent, t) => {
    const isPaused = t.id !== "__main__" && ((lastState?.live.threads ?? []).find((x) => x.name === t.id)?.paused ?? false);
    const d = document.createElement("div");
    d.className = "room" + (selectedThread === t.id ? " active" : "") + (isPaused ? " paused" : "");
    // 進捗(タスクの完了率)をサブに足す
    let prog = "";
    if (t.id !== "__main__") {
      const all = (lastState?.taskList ?? { open: [], claimed: [], done: [] });
      const inP = [...all.open, ...all.claimed, ...all.done].filter((x) => (x.project || "") === t.id);
      if (inP.length) {
        const doneN = inP.filter((x) => x.state === "done").length;
        prog = `${doneN}/${inP.length} 完了`;
      }
    }
    d.innerHTML = `${escapeHtml(t.label)}<span class="sub">${escapeHtml((t.sub ?? "") + (prog ? ` (${prog})` : ""))}</span>`;
    if (unread[t.id]) {
      const b = document.createElement("span");
      b.className = "badge";
      b.textContent = unread[t.id];
      d.appendChild(b);
    }
    d.onclick = () => {
      selectedThread = t.id;
      unread[t.id] = 0;
      selectedAgent = null;
      projectFilter = t.id === "__main__" ? "" : t.id;
      boardWindow = BOARD_WINDOW;
      expandedMerges.clear();
      renderNav(lastState.live.threads); // アクティブ表示は即時で反映
      if (threadBoards.has(selectedThread)) {
        renderAll();
      } else {
        // 未取得スレッド(メイン含む): 空のストリームを出してから差し替えるとちらつくので、
        // 末尾データの到着後に一度だけ描画する
        loadThreadTail(selectedThread).then(() => renderAll());
      }
    };
    if (t.id !== "__main__" && t.name) {
      const fb = document.createElement("button");
      fb.className = "room-folder-btn";
      fb.title = "フォルダを編集";
      fb.textContent = "編";
      fb.onclick = async (e) => {
        e.stopPropagation();
        const cur = (lastState?.live.threads ?? []).find((x) => x.name === t.id)?.folder ?? "";
        const v = await askText({ title: "フォルダを編集", label: `#${t.id} のフォルダ(空欄で未分類)`, value: cur, ok: "保存" });
        if (v === null) return;
        const r = await (await hfetch("/api/folder", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ project: t.id, folder: v }) })).json();
        if (r.error) toast(r.error);
        else refresh();
      };
      d.appendChild(fb);
      // 一時停止/再開(Claude Squad手本)。停止中はトークンを消さず、再開で続きから
      const pb = document.createElement("button");
      pb.className = "room-folder-btn" + (isPaused ? " paused" : "");
      pb.title = isPaused ? "稼働を再開" : "スレッドを一時停止(トークン消費なしで休ませる)";
      pb.textContent = isPaused ? "再" : "停";
      pb.onclick = async (e) => {
        e.stopPropagation();
        const r = await (await hfetch("/api/pause", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ project: t.id, paused: !isPaused }) })).json();
        if (r.error) toast(r.error);
        else refresh();
      };
      d.appendChild(pb);
    }
    parent.appendChild(d);
  };
  const mainBox = $("nav-main");
  mainBox.innerHTML = "";
  makeRoom(mainBox, { id: "__main__", label: "メイン", sub: "リーダーと壁打ち・計画" });
  const list = $("nav-rooms");
  list.innerHTML = "";
  if (ths.length && ths.some((t) => t.folder)) {
    // フォルダが1つでもあるときはフォルダ単位でグループ化
    const groups = {};
    for (const t of ths) (groups[t.folder || "未分類"] ??= []).push(t);
    for (const f of Object.keys(groups).sort((a, b) => a.localeCompare(b, "ja"))) {
      const h = document.createElement("div");
      h.className = "folder-h";
      h.textContent = f;
      list.appendChild(h);
      for (const t of groups[f]) makeRoom(list, { id: t.name, label: "# " + t.name, sub: t.goal });
    }
  } else {
    for (const t of ths) makeRoom(list, { id: t.name, label: "# " + t.name, sub: t.goal });
  }
}

/* ================= 中央: 会話 ================= */
function currentMembers(state) {
  return Object.entries(state.live.agents).filter(([id, a]) => threadOf(a) === selectedThread);
}

function renderRoomHead(state) {
  const th = (state.live.threads ?? []).find((t) => t.name === selectedThread);
  if (selectedThread === "__main__") {
    $("room-title").textContent = "メイン";
    $("room-goal").textContent = "リーダーと壁打ち・計画。実行はサブスレッドへ";
  } else {
    $("room-title").textContent = "# " + selectedThread;
    $("room-goal").textContent = th?.goal ?? "";
  }
  const mem = $("room-members");
  mem.innerHTML = "";
  let sumTokens = 0;
  let sumCost = 0;
  for (const [id, a] of currentMembers(state)) {
    sumTokens += a.tokens ?? 0;
    sumCost += a.costUsd ?? 0;
    const chip = document.createElement("span");
    chip.className = "member" + (selectedAgent === id ? " sel" : "");
    chip.style.setProperty("--ah", agentHue(id));
    chip.innerHTML = `<span class="dot ${(a.status ?? "idle").replace(/\s/g, "")}"></span><span class="anm">${escapeHtml(a.displayName ?? NAMES[id] ?? id)}</span>`;
    chip.title = `${statusJa(a.status)} · turn ${a.turn ?? 0} · クリックでログ`;
    chip.onclick = () => { selectedAgent = selectedAgent === id ? null : id; ctxTab = "agents"; renderAll(); };
    mem.appendChild(chip);
  }
  if (sumTokens > 0) {
    const s = document.createElement("span");
    s.className = "member passive";
    s.innerHTML = `計 ${sumTokens.toLocaleString()} tok · $${sumCost.toFixed(4)}`;
    s.title = "このスレッドのメンバーの合計消費";
    mem.appendChild(s);
  }
  const hint = $("composer-hint");
  hint.textContent = selectedThread === "__main__" ? "宛先: リーダー" : `宛先: ${selectedThread} のメンバー全員`;
  const isPausedThread = selectedThread !== "__main__" && ((lastState?.live.threads ?? []).find((t) => t.name === selectedThread)?.paused ?? false);
  if (isPausedThread) hint.textContent += " · ⏸ 停止中のためワーカーは起こされません";
  $("saytext").placeholder = selectedThread === "__main__" ? "リーダーへメッセージ" : `${selectedThread} のメンバーへメッセージ`;
}

function renderStream(state) {
  const stream = $("stream");
  const nearBottom = stream.scrollHeight - stream.scrollTop - stream.clientHeight < 120;
  const prevTop = stream.scrollTop;
  const prevHeight = stream.scrollHeight;
  // 組み立てはFragmentで行い最後に一括置換する(innerHTML=""からの逐次appendだと
  // DOMが空の時間が露出し、スレッド切替や高頻度再描画でちらつく)
  const frag = document.createDocumentFragment();
  // メインもスレッドも同一経路: ディスク直引きのスレッド別キャッシュで描画する。
  // (/api/stateのlive.boardはRAM末尾200で、メイン投稿が窓に入らないと空に見えるため。
  //  thread=__main__はboard__main__.jsonlを読む。Boardは投稿時に同期的にJSONL追記するので欠落なし)
  let posts = threadBoards.get(selectedThread) ?? [];
  if (!threadBoards.has(selectedThread) && !threadBoardFetching.has(selectedThread)) {
    threadBoardFetching.add(selectedThread);
    queueMicrotask(async () => {
      try {
        const data = await (await hfetch(`/api/board?thread=${encodeURIComponent(selectedThread)}`)).json();
        const known = new Set((threadBoards.get(selectedThread) ?? []).map((p) => p.id));
        const fresh = (data.posts ?? []).filter((p) => !known.has(p.id));
        // 空スレッドでも[]を載せてhas=trueにする(描画のたびに再fetchする連鎖を止める)
        threadBoards.set(selectedThread, [...fresh, ...(threadBoards.get(selectedThread) ?? [])].sort((a, b) => a.id - b.id));
      } finally {
        threadBoardFetching.delete(selectedThread);
        renderStream(lastState);
      }
    });
  }
  let shown = posts;
  if (posts.length > boardWindow) {
    shown = posts.slice(-boardWindow);
    const more = document.createElement("div");
    more.className = "loadmore";
    more.textContent = `以前の投稿を読み込む(${Math.max(0, ((state.live.boardTotal ?? posts.length) - (state.live.board?.length ?? posts.length)) + (posts.length - boardWindow))}件)`;
    more.onclick = () => loadOlderPosts(shown[0]?.id ?? null);
    frag.appendChild(more);
  }
  for (const p of shown) {
    if (p.from === "system") {
      const d = document.createElement("div");
      d.className = "sysline";
      d.textContent = p.text.replace(/^\[[^\]]+\]\s*/, "");
      d.title = p.text;
      // マージ行はクリックでマージ差分を開閉できる
      const tm = p.text.match(/^\[マージ\].*?タスク (\S+) の成果/);
      const rec = tm && (state.live.merges ?? []).find((m) => m.taskId === tm[1]);
      if (tm && rec && (rec.patch || rec.stat)) {
        d.classList.add("merge");
        d.title = "クリックでマージ差分";
        d.onclick = () => {
          if (expandedMerges.has(tm[1])) expandedMerges.delete(tm[1]);
          else expandedMerges.add(tm[1]);
          renderStream(lastState);
        };
        frag.appendChild(d);
        if (expandedMerges.has(tm[1])) {
          const pre = document.createElement("pre");
          pre.className = "mergediff";
          pre.textContent = (rec.stat ? rec.stat + "\n" : "") + (rec.patch ?? "");
          frag.appendChild(pre);
          // 差分への修正依頼: 送信でタスク起票+該当スレッドへ通知(レビュー→再実行のループ)
          const fb = document.createElement("div");
          fb.className = "mfb";
          const ta = document.createElement("textarea");
          ta.rows = 2;
          ta.placeholder = "この差分への修正依頼(例: 境界ケースのテストが足りない)";
          const btn = document.createElement("button");
          btn.className = "btn primary";
          btn.textContent = "修正依頼を送る";
          btn.onclick = async () => {
            const comment = ta.value.trim();
            if (!comment) { ta.focus(); return; }
            btn.disabled = true;
            btn.textContent = "送信中...";
            try {
              const r = await (await hfetch("/api/merge-feedback", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ taskId: tm[1], comment }) })).json();
              if (r.error) throw new Error(r.error);
              ta.value = "";
              btn.textContent = "起票: " + (r.id ?? "ok");
            } catch (e) {
              btn.disabled = false;
              btn.textContent = "失敗—再送";
            }
          };
          fb.append(ta, btn);
          frag.appendChild(fb);
        }
        continue;
      }
      frag.appendChild(d);
      continue;
    }
    const mine = p.from === "you";
    const d = document.createElement("div");
    d.className = "msg" + (mine ? " mine" : "");
    d.dataset.pid = p.id;
    const who = document.createElement("div");
    who.className = "who " + p.from;
    if (!mine) d.style.setProperty("--ah", agentHue(p.from));
    who.textContent = mine ? "あなた" : (NAMES[p.from] ?? p.from);
    const body = document.createElement("div");
    body.innerHTML = renderMarkdown(p.text);
    d.append(who, body);
    frag.appendChild(d);
  }
  // スラッシュコマンドの応答(ローカル)。board再描画の最後に足す
  for (const e of ephemeral) {
    const d = document.createElement("div");
    d.className = "msg mine";
    const who = document.createElement("div");
    who.className = "who";
    who.textContent = "/";
    const body = document.createElement("div");
    body.textContent = e.text;
    d.append(who, body);
    frag.appendChild(d);
  }
  // 一括置換はここで1回だけ(fragは中身を移すと空になるので二重呼びは禁止)
  stream.replaceChildren(frag);
  if (anchorPid !== null) {
    // 読み込み展開後は、展開前に見ていた先頭メッセージへスクロールを戻す
    const el = stream.querySelector(`[data-pid="${anchorPid}"]`);
    anchorPid = null;
    if (el) {
      stream.scrollTop = el.getBoundingClientRect().top - stream.getBoundingClientRect().top + stream.scrollTop - 12;
      return;
    }
  }
  if (nearBottom) stream.scrollTop = stream.scrollHeight;
  // 下端以外で再描画された場合は読書中の位置を保つ(最上部へのジャンプ防止)
  else stream.scrollTop = stream.scrollHeight - prevHeight + prevTop;
}

function renderPerms(requests) {
  const el = $("permzone");
  el.innerHTML = "";
  for (const r of (requests ?? []).filter((x) => x.state === "pending")) {
    const d = document.createElement("div");
    d.className = "permcard";
    d.innerHTML = `<b>承認要求 #${r.id}</b><div class="cmd">${escapeHtml(r.command)}</div>`;
    const ok = document.createElement("button");
    ok.className = "btn primary";
    ok.textContent = "承認";
    ok.onclick = () => decide(r.id, true);
    const no = document.createElement("button");
    no.className = "btn";
    no.textContent = "拒否";
    no.onclick = () => decide(r.id, false);
    d.append(ok, no);
    el.appendChild(d);
  }
}

/* ================= 右: 状況パネル ================= */
function renderCtx(state) {
  for (const b of document.querySelectorAll("#ctx-tabs .ct")) {
    b.classList.toggle("active", b.dataset.tab === ctxTab);
  }
  const body = $("ctx-body");
  const browsing = ctxTab === "browser";
  if (browsing) initBrowserPane();
  $("browserpane").style.display = browsing ? "flex" : "none";
  body.style.display = browsing ? "none" : "";
  document.body.classList.toggle("widepanel", browsing && !document.body.classList.contains("nopanel"));
  body.innerHTML = "";
  if (ctxTab === "tasks") renderTasksTab(body, state);
  if (ctxTab === "agents") renderAgentsTab(body, state);
  if (ctxTab === "files") renderFilesTab(body);
  if (ctxTab === "status") renderStatusTab(body);
  if (ctxTab === "memory") renderMemoryTab(body);
  if (ctxTab === "audit") renderAuditTab(body);
  if (ctxTab === "term") renderTerminalTab();
}

function renderTasksTab(body, state) {
  const list = state.taskList ?? { open: [], claimed: [], done: [] };
  const inThread = selectedThread !== "__main__";
  // 既定は進行中(未着手+作業中)のみ。過去(完了済み)は「過去も表示」で出す
  const all = [...list.open, ...list.claimed, ...(showDoneTasks ? list.done : [])].filter((t) => !inThread || (t.project || "") === selectedThread);
  const projects = [...new Set(all.map((t) => t.project || ""))].sort();

  if (inThread) {
    const s = document.createElement("div");
    s.className = "sec";
    s.textContent = `${selectedThread} のタスク`;
    body.appendChild(s);
  } else {
    const sel = document.createElement("select");
    sel.className = "filter";
    const opts = ["", ...projects, "__none__"];
    const cur = projectFilter;
    for (const p of opts) {
      const o = document.createElement("option");
      o.value = p;
      o.textContent = p === "" ? "すべてのプロジェクト" : p === "__none__" ? "(未分類)" : p;
      sel.appendChild(o);
    }
    sel.value = cur;
    if (!opts.includes(cur)) { projectFilter = ""; sel.value = ""; }
    sel.onchange = (e) => { projectFilter = e.target.value; renderCtx(lastState); };
    body.appendChild(sel);
  }

  // 過去(完了済み)の表示トグル
  const toggle = document.createElement("label");
  toggle.style.cssText = "display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--sub);margin-left:8px;cursor:pointer";
  const cb = document.createElement("input");
  cb.type = "checkbox";
  cb.checked = showDoneTasks;
  cb.onchange = () => { showDoneTasks = cb.checked; renderCtx(lastState); };
  toggle.append(cb, document.createTextNode("過去も表示"));
  body.appendChild(toggle);

  const visible = all.filter((t) => inThread || projectFilter === "" || (projectFilter === "__none__" ? !t.project : (t.project || "") === projectFilter));
  if (!visible.length) {
    const empty = document.createElement("div");
    empty.className = "sec";
    empty.textContent = showDoneTasks ? "タスクはありません" : "進行中のタスクはありません(「過去も表示」で完了済みを出せます)";
    body.appendChild(empty);
  }
  const groups = inThread ? [["", ""]] : [...projects.map((p) => [p, p]), ["", "(未分類)"]];
  const secs = [
    ["open", "未着手", () => ({ label: "中止", action: "cancel" })],
    ["claimed", "作業中", () => ({ label: "解放", action: "release" })],
    ["done", "完了", () => ({ label: "再開", action: "reopen" })],
  ];
  for (const [proj, label] of groups) {
    const inProj = visible.filter((t) => (t.project || "") === proj);
    if (!inProj.length) continue;
    const ph = document.createElement("div");
    ph.className = "proj";
    ph.textContent = label;
    body.appendChild(ph);
    for (const [st, stLabel, btn] of secs) {
      const rows = inProj.filter((t) => t.state === st);
      if (!rows.length) continue;
      const sh = document.createElement("div");
      sh.className = "sec";
      sh.textContent = `${stLabel}(${rows.length})`;
      body.appendChild(sh);
      for (const t of rows) {
        const row = document.createElement("div");
        row.className = "taskrow";
        const id = document.createElement("span");
        id.className = "tid";
        id.textContent = t.id + (t.agent && !["auto", "you"].includes(t.agent) ? ` @${t.agent}` : "");
        id.title = t.summary;
        id.onclick = () => showTaskBody(t);
        const sum = document.createElement("span");
        sum.className = "tsum";
        sum.textContent = t.summary;
        if (t.acceptance) {
          sum.title = `受け入れ基準: ${t.acceptance}`;
          const tag = document.createElement("span");
          tag.className = "acc";
          tag.textContent = "基準あり";
          tag.title = `受け入れ基準: ${t.acceptance}`;
          sum.prepend(tag, " ");
        }
        if (Array.isArray(t.dependsOn) && t.dependsOn.length) {
          const depTag = document.createElement("span");
          depTag.className = "acc dep";
          const depState = t.state === "open" && t.blocked ? "依存待ち" : "依存";
          depTag.textContent = `${depState}:${t.dependsOn.join(",")}`;
          depTag.title = `依存タスク: ${t.dependsOn.join(", ")}(全て完了で請求可能)`;
          sum.prepend(depTag, " ");
        }
        sum.onclick = () => showTaskBody(t);
        const mv = document.createElement("button");
        mv.className = "btn";
        mv.textContent = "移動";
        mv.title = "プロジェクトを付け替える";
        mv.onclick = async (e) => {
          e.stopPropagation();
          const p = await askText({ title: "プロジェクトを付け替え", label: `${t.id} のプロジェクト名(空欄で未分類)`, value: t.project || "" });
          if (p === null) return;
          await taskAction({ action: "reproject", path: t.path, project: p });
        };
        const b = document.createElement("button");
        b.className = "btn";
        const spec = btn(t);
        b.textContent = spec.label;
        b.onclick = (e) => { e.stopPropagation(); taskAction({ action: spec.action, id: t.id, agent: t.agent }); };
        row.append(id, sum, mv, b);
        body.appendChild(row);
      }
    }
  }

  const form = document.createElement("div");
  form.id = "newtask";
  form.innerHTML = `
    <div class="sec">新しいタスク${inThread ? ` · ${escapeHtml(selectedThread)}` : ""}</div>
    <input id="nt-id" placeholder="task_id(空欄で自動採番)">
    ${inThread ? "" : '<input id="nt-project" placeholder="project(任意、例: cuda-compress)">'}
    <input id="nt-role" placeholder="role(impl/review等、空欄で誰でも)">
    <input id="nt-acc" placeholder="受け入れ基準(任意、例: npm testが通る)">
    <input id="nt-dep" placeholder="依存タスクid(任意、カンマ区切り。完了まで請求不可)">
    <textarea id="nt-body" placeholder="何を / どう確認するか / 完了条件"></textarea>
    <button id="nt-add" class="btn">投入(トークン消費なし)</button>`;
  body.appendChild(form);
  form.querySelector("#nt-add").onclick = createTask;
}

function renderAgentsTab(body, state) {
  const members = currentMembers(state);
  for (const [id, a] of members) {
    const card = document.createElement("div");
    card.className = "agentcard" + (selectedAgent === id ? " sel" : "");
    card.style.setProperty("--ah", agentHue(id));
    const label = a.displayName ?? NAMES[id] ?? id;
    card.innerHTML = `<span class="nm">${escapeHtml(label)}</span><span class="st ${(a.status ?? "idle").replace(/\s/g, "")}">${escapeHtml(statusJa(a.status))}</span>` +
      `<div class="meta">turn ${a.turn ?? 0}${a.lastTool ? ` / ${escapeHtml(a.lastTool)}` : ""}${a.tokens ? ` / ${a.tokens.toLocaleString()}tok / $${(a.costUsd ?? 0).toFixed(4)}` : ""}</div>`;
    const wdb = document.createElement("button");
    wdb.className = "wtdiff-btn";
    wdb.textContent = "差分";
    wdb.onclick = async (e) => {
      e.stopPropagation();
      const r = await (await hfetch(`/api/wtdiff?agent=${encodeURIComponent(id)}`)).json();
      if (r.error) { toast(r.error); return; }
      showWtdiff(id, r);
    };
    card.appendChild(wdb);
    // 会話検査ビュー(#5): mem-<id>.jsonの直近メッセージの概要をダイアログで見る
    const memBtn = document.createElement("button");
    memBtn.className = "wtdiff-btn";
    memBtn.textContent = "会話";
    memBtn.title = "このエージェントの直近の会話(messages)を検査する";
    memBtn.onclick = async (e) => {
      e.stopPropagation();
      const r = await (await hfetch(`/api/agent-memory?agent=${encodeURIComponent(id)}`)).json();
      const dlg = $("dlg");
      $("dlg-title").textContent = `会話検査: ${label}`;
      $("dlg-body").textContent = r.tail?.length
        ? r.tail.map((m) => `[${m.role}] ${m.preview}`).join("\n\n")
        : `会話メモリはまだありません(${r.count}件)`;
      const inp = $("dlg-input");
      inp.style.display = "none";
      $("dlg-ok").textContent = "閉じる";
      $("dlg-cancel").style.display = "none";
      dlg.showModal();
      $("dlg-ok").onclick = () => { dlg.close(); inp.style.display = ""; $("dlg-cancel").style.display = ""; };
      $("dlg-cancel").onclick = () => { dlg.close(); inp.style.display = ""; $("dlg-cancel").style.display = ""; };
    };
    card.appendChild(memBtn);
    card.onclick = () => { selectedAgent = selectedAgent === id ? null : id; renderCtx(lastState); };
    body.appendChild(card);
    if (selectedAgent === id) body.appendChild(renderAgentLog(a));
  }
  if (!members.length) {
    const h = document.createElement("div");
    h.className = "hint";
    h.textContent = "このスレッドにはまだエージェントがいません。";
    body.appendChild(h);
  }
}

// /api/wtdiff の結果を等幅パネルで表示(stat部とpatch部を分離・末尾省略)
function showWtdiff(id, r) {
  const dlg = document.createElement("dialog");
  dlg.className = "wtdiff";
  const head = document.createElement("div");
  head.className = "wtdiff-head";
  const title = document.createElement("span");
  title.textContent = `agent/${id} の差分` + (r.truncated ? "(末尾省略)" : "");

/* ================= devserver: scriptsの起動/停止(エージェントを起こさない操作) ================= */
async function renderDevserver(body) {
  const h = document.createElement("div");
  h.className = "sec";
  h.textContent = "開発サーバー";
  body.appendChild(h);
  const box = document.createElement("div");
  box.id = "devserver-box";
  body.appendChild(box);
  const render = async () => {
    const st = await (await hfetch("/api/devserver")).json();
    box.innerHTML = "";
    const row = document.createElement("div");
    row.className = "session-row";
    const sel = document.createElement("select");
    sel.id = "devserver-script";
    sel.style.cssText = "flex:1;background:var(--recess);border:1px solid var(--separator);color:var(--label);border-radius:4px;padding:5px 8px;font-size:12px;font-family:var(--font-ui);box-shadow:var(--inset-field);";
    for (const s of st.scripts ?? []) {
      const o = document.createElement("option");
      o.value = s; o.textContent = s;
      sel.appendChild(o);
    }
    const startB = document.createElement("button");
    startB.className = "btn";
    startB.textContent = "起動";
    startB.onclick = async () => {
      const script = sel.value;
      const url = await askText({ title: "起動後のURL", label: "ブラウザで開く先", value: "http://localhost:3000/", ok: "起動" });
      const r = await (await hfetch("/api/devserver", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ action: "start", script, url, open: true }) })).json();
      if (!r.ok) { toast(`エラー: ${r.error}`, "err"); return; }
      toast(`devserver ${script} を起動しました(pid ${r.pid})`, "ok");
      render();
    };
    row.append(sel, startB);
    box.appendChild(row);
    if (st.running) {
      const rr = document.createElement("div");
      rr.className = "session-row";
      const info = document.createElement("span");
      info.style.cssText = "font-size:11px;color:var(--sub);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;";
      info.textContent = `${st.running.script} (pid ${st.running.pid})`;
      const openB = document.createElement("button");
      openB.className = "btn";
      openB.textContent = "ブラウザで開く";
      openB.onclick = () => { initBrowserPane(); $("burl").value = st.running.url; $("bgo").click(); document.querySelector('.ct[data-tab=browser]').click(); };
      const stopB = document.createElement("button");
      stopB.className = "btn";
      stopB.textContent = "停止";
      stopB.onclick = async () => {
        const r = await (await hfetch("/api/devserver", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ action: "stop" }) })).json();
        if (!r.ok) { toast(`エラー: ${r.error}`, "err"); return; }
        toast("devserverを停止しました", "ok");
        render();
      };
      rr.append(info, openB, stopB);
      box.appendChild(rr);
    } else {
      const hint = document.createElement("div");
      hint.className = "hint";
      hint.textContent = "起動中のサーバーはありません。";
      box.appendChild(hint);
    }
  };
  await render();
}

async function sendSay() {
  const el = $("saytext");
  const text = el.value.trim();
  if (!text && !pendingImage) return;
  if (text.startsWith("/")) { el.value = ""; handleCommand(text); return; }
  const img = pendingImage;
  const th = selectedThread === "__main__" ? null : selectedThread;
  // 成功応答を確認してから入力を消す(サーバーエラーや通信断で書いた指示を失わない)
  if (text) {
    const r = await (await sendSayText(text)).json();
    if (r.error) {
      toast(`送信に失敗しました: ${r.error}(入力は残っています)`);
      return;
    }
  }
  el.value = "";
  pendingImage = null;
  if (img) {
    // 画像添付: 保存→メンバーへマルチモーダルで届く。テキストがあれば本文としても届く(note)
    await hfetch("/api/attach", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ thread: th, dataUrl: img.dataUrl, note: text }) });
  }
  refresh();
}

// スラッシュコマンド: 入力欄からローカル操作(エージェントを起こさない)
// スラッシュコマンドの応答(ローカル表示)。5秒ごとの再描画で消えないよう保持する
const ephemeral = [];
function pushEphemeral(text) {
  ephemeral.push({ at: Date.now(), text });
  if (ephemeral.length > 30) ephemeral.shift();
}

async function handleCommand(text) {
  const [cmd, ...args] = text.slice(1).split(/\s+/);
  const post = (t) => {
    pushEphemeral(t);
    renderStream(lastState ?? { live: { board: [] } });
  };
  if (cmd === "help") {
    const rows = Object.entries(COMMANDS).map(([c, d]) => `/${c} — ${d}`);
    const custom = Object.entries(lastState?.commands ?? {});
    if (custom.length) rows.push(...custom.map(([c, d]) => `/${c} — ${d}(カスタム)`));
    post("コマンド一覧:\n" + rows.join("\n"));
  } else if (cmd === "discuss") {
    // モデル横断ディスカッション: 接続済みプロバイダの代表モデル同士が1つのスレッドで議論する
    const topic = args.join(" ");
    if (!topic) { post("論点を指定してください(/discuss <論点>)"); return; }
    const r = await (await hfetch("/api/discuss", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ topic }) })).json();
    if (r.error) { post(`エラー: ${r.error}`); return; }
    post(`ディスカッションを開始しました(#${r.thread})\n参加: ${r.participants.join(", ")}${r.notes?.length ? `\n除外: ${r.notes.join(" / ")}` : ""}\nスレッド「${r.thread}」で発言が流れます。`);
  } else if (cmd === "session" || cmd === "sessions") {
    const arg = text.slice(("/" + cmd).length).trim();
    const [op, ...rest] = arg.split(/\s+/);
    const name = rest.join("-");
    if (!op || op === "list") {
      const r = await (await hfetch("/api/session", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ action: "list" }) })).json();
      post(r.list?.length ? "保存済みセッション:\n" + r.list.join("\n") : "保存済みセッションはありません(/session save <名前> で保存)");
    } else if (op === "save" || op === "load") {
      if (!name) { post("セッション名を指定してください"); return; }
      const r = await (await hfetch("/api/session", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ action: op, name }) })).json();
      post(r.error ? `エラー: ${r.error}` : `セッション ${name} を${op === "save" ? "保存" : "復元"}しました${op === "load" ? "(反映には再起動が必要です)" : ""}`);
    }
  } else if (cmd === "tasks") {
    if (!lastState) return post("まだ状態を取得していません");
    const l = lastState.taskList;
    const showDone = args[0] === "done" || args[0] === "all";
    const rows = [...l.open, ...l.claimed, ...(showDone ? l.done : [])]
      .filter((t) => selectedThread === "__main__" || (t.project || "") === selectedThread)
      .map((t) => `${t.state}: ${t.id}${t.project ? ` (${t.project})` : ""}`);
    const note = showDone ? "" : (l.done.length ? `\n(完了${l.done.length}件は /tasks done で表示)` : "");
    post(rows.length || note ? rows.join("\n") + note : "タスクはありません");
  } else if (cmd === "usage") {
    if (!lastState) return post("まだ状態を取得していません");
    const rows = Object.entries(lastState.live.agents).map(([id, a]) =>
      `${a.displayName ?? id}: ${statusJa(a.status)} / ${a.tokens?.toLocaleString() ?? 0}tok / $${(a.costUsd ?? 0).toFixed(4)}`);
    post(rows.length ? rows.join("\n") : "usageはまだありません");
  } else if (cmd === "threads") {
    const ts = lastState?.live.threads ?? [];
    post(ts.map((t) => `${t.name} — ${t.goal}`).join("\n") || "開いているスレッドはありません");
  } else if (cmd === "thread") {
    const rest = text.slice(("/" + cmd).length).trim();
    const sp = rest.search(/\s/);
    const name = sp === -1 ? rest : rest.slice(0, sp);
    const goal = sp === -1 ? "" : rest.slice(sp + 1).trim();
    if (!name) { post("スレッド名を指定してください(/thread <名前> <目標>)"); return; }
    const r = await (await hfetch("/api/thread", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ project: name, goal }) })).json();
    post(r.error ? `エラー: ${r.error}` : `スレッド ${name} を開きました(3ワーカー並行開始)`);
  } else if (cmd === "close") {
    const name = text.slice(("/" + cmd).length).trim();
    if (!name) { post("スレッド名を指定してください"); return; }
    const r = await (await hfetch("/api/close", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ project: name }) })).json();
    post(r.error ? `エラー: ${r.error}` : `スレッド ${name} を閉じました`);
  } else if (cmd === "workflow") {
    const name = args[0];
    if (!name) {
      const list = lastState?.workflows ?? [];
      post(list.length ? "実行可能なワークフロー:\n" + list.join("\n") : "ワークフローがありません(workspace/workflows/ に <名前>.mjs を置いてください)");
      return;
    }
    const r = await (await hfetch("/api/workflow", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ name }) })).json();
    post(r.error ? `エラー: ${r.error}` : `ワークフロー ${name} を実行開始しました`);
  } else if (cmd === "model") {
    const m = lastState?.model;
    if (args[0] === "list") {
      const provs = m?.providers ?? [];
      const lines = provs.map((p) => `${p.authHint ? "●" : "○"} ${p.name}(${p.id}) ${p.api} 鍵${p.authHint ?? "未設定"} モデル${p.models.length}個: ${p.models.slice(0, 4).join(", ")}${p.models.length > 4 ? "…" : ""}`);
      post([`既定: ${m?.name ?? "(未設定)"}(${m?.ref ?? "-"})`, `フォールバック: ${m?.fallbacks?.join(" → ") || "なし"}`, ...lines, "", "変更: /model <provider/model またはモデル名> / 鍵は設定の「モデルと接続」から"].join("\n"));
    } else if (!args[0]) {
      const e = lastState?.live.modelEffort;
      const lines = (m?.providers ?? []).map((p) => `${p.authHint ? "●" : "○"} ${p.name}`);
      post(`モデル: ${m?.name ?? "(不明)"}(${m?.ref ?? "-"})\n思考レベル: ${e ?? lastState?.live.modelEffort ?? "config値"}\nフォールバック: ${m?.fallbacks?.join(" → ") || "なし"}\n接続: ${lines.join(" ") || "(なし)"}\n\n変更: /model <名前> / 一覧: /model list / 鍵: 設定の「モデルと接続」`);
    } else {
      const r = await (await hfetch("/api/model", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ model: args.join(" ") }) })).json();
      if (!r.error) { uiEffort = null; uiModelName = r.model ?? ""; }
      post(r.error ? `エラー: ${r.error}` : `モデルを ${r.model} に変更しました(次のラウンドから)`);
    }
  } else if (cmd === "clear") {
    // チャット履歴のクリア。確認ダイアログを挟む(破壊的操作)。タスク・メモリには影響しない
    const dlg = $("dlg");
    const inp = $("dlg-input");
    $("dlg-title").textContent = "チャット履歴のクリア";
    $("dlg-body").textContent = `このスレッド(#${selectedThread === "__main__" ? "メイン" : selectedThread})のチャット履歴を削除します。\nタスク・メモリには影響しません(過去のタスクは残ります)。`;
    inp.style.display = "none";
    $("dlg-ok").textContent = "クリア";
    dlg.showModal();
    $("dlg-ok").onclick = async () => {
      dlg.close();
      inp.style.display = "";
      const r = await (await hfetch("/api/clear-board", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ thread: selectedThread }) })).json();
      if (r.error) { toast(`クリア: ${r.error}`); return; }
      toast(`チャット履歴をクリアしました(${r.clearedPosts}件)`, "ok");
      threadBoards.delete(selectedThread);
      renderAll();
    };
    $("dlg-cancel").onclick = () => { dlg.close(); inp.style.display = ""; };
  } else if (cmd === "effort") {
    const lv = (args[0] ?? "").toLowerCase();
    if (!["low", "medium", "high"].includes(lv)) { post("low / medium / high のいずれかを指定してください"); return; }
    const r = await (await hfetch("/api/model", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ effort: lv }) })).json();
    if (!r.error) uiEffort = r.effort;
    post(r.error ? `エラー: ${r.error}` : `思考レベルを ${r.effort} に変更しました(次のラウンドから)`);
  } else if (cmd === "perm") {
    const mode = (args[0] ?? "").toLowerCase();
    if (!["normal", "auto"].includes(mode)) { post("normal または auto を指定してください"); return; }
    const r = await (await hfetch("/api/perm", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ mode }) })).json();
    post(r.error ? `エラー: ${r.error}` : `権限モードを ${r.mode} に変更しました(${mode === "auto" ? "承認要求を自動許可" : "承認要求は都度確認"})`);
  } else if (cmd === "git") {
    const r = await (await hfetch("/api/git")).json();
    post(`[GIT状況]\n${r.text ?? r.error}`);
  } else if (customCommands[cmd]) {
    // configで定義したカスタムプロンプトコマンド → リーダーへ送信
    sendSayText(customCommands[cmd].replace(/\$ARGS/g, text.slice(cmd.length + 2).trim()));
  } else {
    post(`不明なコマンド: ${cmd}(/help で一覧)`);
  }
}

/* ================= ダイアログとトースト ================= */
function toast(msg, kind = "err") {
  const t = document.createElement("div");
  t.className = "toast " + kind;
  t.textContent = msg;
  t.title = "クリックで展開/閉じる";
  t.onclick = () => t.classList.toggle("expanded");
  $("toasts").appendChild(t);
  setTimeout(() => { if (!t.classList.contains("expanded")) t.remove(); }, 5000);
}

// ブラウザ標準のpromptの代替。テキスト入力つきダイアログ。キャンセル/Escはnull
function askText({ title, label, value = "", ok = "決定" }) {
  return new Promise((resolve) => {
    const dlg = $("dlg");
    $("dlg-title").textContent = title;
    $("dlg-body").textContent = label;
    const inp = $("dlg-input");
    inp.value = value;
    $("dlg-ok").textContent = ok;
    dlg.showModal();
    inp.focus();
    inp.select();
    const done = (v) => { dlg.close(); resolve(v); };
    $("dlg-ok").onclick = () => done(inp.value.trim());
    $("dlg-cancel").onclick = () => done(null);
    dlg.oncancel = () => resolve(null);
    inp.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); $("dlg-ok").click(); } };
  });
}

// 頁送りAPIで以前の投稿を取得し、表示に前置きする(アンカーへスクロール復帰)
// メインもスレッドも同一経路: スレッド別キャッシュ(threadBoards)の最古IDより前をディスクから取得して前方マージ
async function loadOlderPosts(beforeId) {
  const cache = threadBoards.get(selectedThread) ?? [];
  const anchor = cache.length ? Math.min(...cache.map((p) => p.id)) : beforeId;
  if (!cache.length) {
    // キャッシュ無しで特定ID指定は不自然なので末尾から取得し直す
    if (beforeId != null) return loadThreadTail(selectedThread);
    return;
  }
  const r = await hfetch(`/api/board?before=${anchor}&thread=${encodeURIComponent(selectedThread)}`);
  if (!r.ok) return;
  const data = await r.json();
  const known = new Set(cache.map((p) => p.id));
  const fresh = (data.posts ?? []).filter((p) => !known.has(p.id));
  if (!fresh.length) return;
  threadBoards.set(selectedThread, [...fresh, ...cache].sort((a, b) => a.id - b.id));
  anchorPid = beforeId;
  boardWindow += fresh.length || BOARD_WINDOW;
  renderStream(lastState);
}

// スレッドの末尾200をディスクから取得してキャッシュへ(未取得スレッドの初期ロード)
async function loadThreadTail(thread) {
  if (threadBoardFetching.has(thread)) return;
  threadBoardFetching.add(thread);
  try {
    const data = await (await hfetch(`/api/board?thread=${encodeURIComponent(thread)}`)).json();
    const known = new Set((threadBoards.get(thread) ?? []).map((p) => p.id));
    const fresh = (data.posts ?? []).filter((p) => !known.has(p.id));
    // 空スレッドでも[]を入れてhas=trueにする(開くたびに再fetchしてちらつく連鎖を止める)
    threadBoards.set(thread, [...fresh, ...(threadBoards.get(thread) ?? [])].sort((a, b) => a.id - b.id));
  } catch { /* 取得失敗は次回以降 */ } finally {
    threadBoardFetching.delete(thread);
  }
}

// 選択値はModelRef。未接続(鍵なし)プロバイダのモデルは選べない(既定のみ表示)
function syncComposerModelOpts() {
  const cm = $("composer-model");
  const liveEffort = lastState?.live?.modelEffort ?? "low";
  cm.innerHTML = "";
  const def = document.createElement("option");
  def.value = "";
  def.textContent = `設定どおり(${lastState?.model?.name ?? "既定"})`;
  cm.appendChild(def);
  for (const p of lastState?.model?.providers ?? []) {
    const og = document.createElement("optgroup");
    og.label = `${p.name}${p.authHint ? "" : "(未接続)"}`;
    for (const mid of p.models) {
      const o = document.createElement("option");
      o.value = `${p.id}/${mid}`;
      o.textContent = mid;
      if (!p.authHint) o.disabled = true;
      og.appendChild(o);
    }
    if (og.children.length) cm.appendChild(og);
  }
  cm.value = uiModelName ?? "";
  if (cm.value !== (uiModelName ?? "")) cm.value = ""; // 選択済みが一覧に無ければ既定へ
  $("composer-effort").value = uiEffort ?? liveEffort ?? "low";
  $("composer-perm").value = lastState?.live?.permMode ?? "normal";
}
async function applyComposerModelChange({ model, effort } = {}) {
  if (model != null) {
    const cur = uiModelName ?? "";
    if (model !== cur) {
      const rm = await (await hfetch("/api/model", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ model }) })).json();
      if (rm.error) { toast(`モデル: ${rm.error}`); return; }
      uiModelName = rm.model ?? "";
      toast(rm.model ? `モデルを ${rm.model} に変更しました(次のラウンドから)` : `モデルを設定どおりに戻しました(次のラウンドから)`, "ok");
    }
  }
  if (effort != null) {
    const re = await (await hfetch("/api/model", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ effort }) })).json();
    if (re.error) { toast(`思考レベル: ${re.error}`); return; }
    uiEffort = re.effort;
    toast(`思考レベルを ${re.effort} に変更しました(次のラウンドから)`, "ok");
  }
  syncComposerModelOpts();
}

/* ================= ボード全文検索(/api/board?q=) ================= */
// ヘッダの検索ボックスで全スレッド横断の本文検索。結果クリックでそのスレッドを開く
let boardSearchSeq = 0;
async function runBoardSearch() {
  const q = $("board-search").value.trim();
  const box = $("board-search-results");
  if (!q) { box.style.display = "none"; box.innerHTML = ""; return; }
  const seq = ++boardSearchSeq;
  try {
    const r = await hfetch(`/api/board?q=${encodeURIComponent(q)}&limit=50`);
    const data = await r.json();
    if (seq !== boardSearchSeq) return; // 古い応答は捨てる
    box.innerHTML = "";
    if (data.error) {
      const d = document.createElement("div");
      d.className = "bs-head";
      d.textContent = data.error;
      box.appendChild(d);
    } else {
      const head = document.createElement("div");
      head.className = "bs-head";
      const label = document.createElement("span");
      label.textContent = `「${q}」のヒット: ${data.total}件${data.posts.length < data.total ? `(先頭${data.posts.length}件)` : ""}`;
      const close = document.createElement("span");
      close.className = "bs-close";
      close.textContent = "閉じる ×";
      close.onclick = () => { box.style.display = "none"; box.innerHTML = ""; };
      head.append(label, close);
      box.appendChild(head);
      for (const p of data.posts) openBoardSearchResult(box, p);
    }
    box.style.display = "block";
  } catch {
    /* 通信失敗は無視(次の入力で再試行) */
  }
}
// ヒット1件の行を生成。クリックでそのスレッドへ切替(既存のスレッドクリックと同じ状態遷移)
function openBoardSearchResult(box, p) {
  const th = p.thread ?? "__main__";
  const d = document.createElement("div");
  d.className = "bs-hit";
  const meta = document.createElement("div");
  meta.className = "bs-meta";
  const at = p.at ? new Date(p.at).toLocaleString("ja-JP", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }) : "";
  meta.innerHTML = `<span class="bs-thread">${escapeHtml(th === "__main__" ? "メイン" : "#" + th)}</span> · ${escapeHtml(NAMES[p.from] ?? p.from)} · ${escapeHtml(at)}`;
  const text = document.createElement("div");
  text.className = "bs-text";
  text.textContent = String(p.text ?? "").replace(/\s+/g, " ").slice(0, 200);
  d.append(meta, text);
  d.onclick = () => {
    selectedThread = th;
    unread[th] = 0;
    selectedAgent = null;
    projectFilter = th === "__main__" ? "" : th;
    boardWindow = BOARD_WINDOW;
    expandedMerges.clear();
    $("board-search-results").style.display = "none";
    $("board-search-results").innerHTML = "";
    renderAll();
  };
  box.appendChild(d);
}
$("board-search").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); runBoardSearch(); }
  if (e.key === "Escape") {
    const box = $("board-search-results");
    box.style.display = "none";
    box.innerHTML = "";
    e.target.value = "";
  }
});

// プロバイダごとの行(鍵の状態ドット・鍵入力+保存・テスト送信)。生の鍵は表示しない
async function renderModelsList() {
  const box = $("set-models-list");
  try {
    // モデル状態は軽量エンドポイントから取り直す(鍵保存の反映を見せるため)
    const { model: m } = await (await hfetch("/api/models")).json();

    const head = document.createElement("div");

    box.appendChild(head);
    for (const p of m?.providers ?? []) {
      const row = document.createElement("div");
      row.className = "prov-row";
      const dot = document.createElement("span");
      dot.className = "dot " + (p.authHint ? "on" : "off");
      dot.title = p.authHint ? `鍵設定済み(${p.authHint})` : "鍵未設定";
      const nm = document.createElement("span");
      nm.className = "prov-name";
      nm.textContent = p.name;
      const isOauth = p.auth === "oauth";
      const meta = document.createElement("span");
      meta.className = "prov-meta";
      meta.textContent = `${p.api} / ${isOauth ? (p.authHint ? `認証済み(${p.authHint})` : "未認証") : `鍵${p.authHint ?? "未設定"}`} / モデル${p.models.length}個`;
      const keyInput = document.createElement("input");
      keyInput.type = "password";
      keyInput.autocomplete = "off";
      keyInput.spellcheck = false;
      keyInput.className = "prov-key";
      keyInput.placeholder = p.authHint ? "差し替え" : "鍵を入力";
      const save = document.createElement("button");
      save.className = "btn";
      let keyControls;
      if (isOauth) {
        // OAuth型(ChatGPT Plus/Pro): 鍵ではなくブラウザ認証。コールバックが自動受信
        // できない場合に備え、リダイレクト先URLを貼り付ける欄も併設する
        keyInput.style.display = "none";
        const authBtn = document.createElement("button");
        authBtn.className = "btn";
        authBtn.textContent = "認証";
        authBtn.onclick = async () => {
          authBtn.disabled = true;
          result.className = "prov-result";
          result.textContent = "発行中…";
          try {
            const r = await (await hfetch("/api/openai-auth", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ provider: p.id }) })).json();
            if (r.error) { toast(`認証: ${r.error}`); result.textContent = ""; return; }
            if (r.lastError) toast(`前回の認証は失敗しています: ${r.lastError}`);
            const a = document.createElement("a");
            a.href = r.authUrl;
            a.target = "_blank";
            a.rel = "noreferrer";
            a.textContent = "認証ページを開く";
            a.style.color = "var(--accent)";
            result.className = "prov-result";
            result.textContent = "";
            result.appendChild(a);
            if (r.manualOnly && r.note) result.appendChild(document.createTextNode(` ${r.note}`));
            else result.appendChild(document.createTextNode(" ブラウザでログインしてください"));
            window.open(r.authUrl, "_blank", "noreferrer");
            setTimeout(() => renderModelsList(), 8000);
            setTimeout(() => renderModelsList(), 20000);
          } finally {
            authBtn.disabled = false;
          }
        };
        save.textContent = "送る";
        save.title = "貼り付けたURLで認証を完了する";
        save.onclick = async () => {
          const url = keyInput2.value.trim();
          if (!url) { toast("リダイレクト先のURLを貼り付けてください"); return; }
          const r = await (await hfetch("/api/openai-auth", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ provider: p.id, pasteUrl: url }) })).json();
          if (r.error) { toast(`認証: ${r.error}`); return; }
          keyInput2.value = "";
          toast(`${p.name} の認証を完了しました`, "ok");
          renderModelsList();
        };
        keyControls = [authBtn];
      } else {
        save.textContent = "保存";
        save.onclick = async () => {
          const key = keyInput.value.trim();
          if (!key) { toast("鍵が空です"); return; }
          const r = await (await hfetch("/api/key", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ provider: p.id, key }) })).json();
          if (r.error) { toast(`鍵: ${r.error}`); return; }
          keyInput.value = "";
          toast(`${p.name} の鍵を保存しました(${r.hint})`, "ok");
          renderModelsList();
        };
        keyControls = [keyInput];
      }
      const keyInput2 = document.createElement("input");
      keyInput2.className = "prov-key";
      keyInput2.spellcheck = false;
      keyInput2.placeholder = "リダイレクト先URL";
      if (!isOauth) keyInput2.style.display = "none";
      const test = document.createElement("button");
      test.className = "btn";
      test.textContent = "テスト";
      const result = document.createElement("span");
      result.className = "prov-result";
      test.onclick = async () => {
        test.disabled = true;
        result.className = "prov-result";
        result.textContent = "確認中…";
        try {
          const r = await (await hfetch("/api/model-test", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ provider: p.id }) })).json();
          if (r.ok) { result.className = "prov-result ok"; result.textContent = `OK ${r.ref}`; }
          else { result.className = "prov-result err"; result.textContent = String(r.error ?? "失敗").slice(0, 80); }
        } catch (e) {
          result.className = "prov-result err";
          result.textContent = `失敗: ${e.message}`;
        } finally {
          test.disabled = false;
        }
      };
      row.append(dot, nm, meta, ...keyControls, keyInput2, save, test, result);
      box.appendChild(row);
    }
  } catch (e) {
    box.textContent = `一覧の取得に失敗: ${e.message}`;
  }
}

/* ================= 設定ウィンドウ: MCPサーバーの追加/削除 ================= */
async function renderMcpList() {
  const box = $("set-mcp-list");
  try {
    const { servers } = await (await hfetch("/api/mcp")).json();
    box.innerHTML = "";
    if (!servers.length) {
      const none = document.createElement("div");
      none.style.cssText = "font-size:11px;color:var(--label-tertiary)";
      none.textContent = "接続中のサーバーはありません";
      box.appendChild(none);
      return;
    }
    for (const srv of servers) {
      const row = document.createElement("div");
      row.className = "mcp-row";
      const nm = document.createElement("span");
      nm.className = "nm";
      nm.textContent = srv.name;
      const cmd = document.createElement("span");
      cmd.className = "cmd";
      cmd.textContent = `${srv.command} ${(srv.args ?? []).join(" ")} / ツール${(srv.tools ?? []).length}個${(srv.envKeys ?? []).length ? ` / env:${(srv.envKeys ?? []).join(",")}` : ""}`;
      const del = document.createElement("button");
      del.className = "btn";
      del.textContent = "削除";
      del.onclick = async () => {
        const r = await (await hfetch("/api/mcp", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ op: "remove", name: srv.name }) })).json();
        if (r.error) { toast(`MCP: ${r.error}`); return; }
        toast(`MCPサーバー ${srv.name} を切断しました`, "ok");
        renderMcpList();
      };
      row.append(nm, cmd, del);
      box.appendChild(row);
    }
  } catch (e) {
    box.textContent = `一覧の取得に失敗: ${e.message}`;
  }
}

let browserWired = false;
function initBrowserPane() {
  if (browserWired) return;
  browserWired = true;
  const v = $("bview");
  const norm = (u) => {
    u = u.trim();
    if (!u) return u;
    if (!/^https?:\/\//i.test(u)) u = "https://" + u;
    return u;
  };
  // iframeはcross-originの履歴操作ができないため、URL履歴を自前で持つ
  const history = [];
  let pointer = -1;
  let internal = false;
  const show = (u, push = true) => {
    if (push) { history.splice(pointer + 1); history.push(u); pointer = history.length - 1; }
    $("burl").value = u;
    internal = true;
    v.src = u;
  };
  const go = () => { const u = norm($("burl").value); if (u) show(u); };
  $("bgo").onclick = go;
  $("burl").addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
  $("bback").onclick = () => { if (pointer > 0) { pointer -= 1; show(history[pointer], false); } };
  $("bfwd").onclick = () => { if (pointer < history.length - 1) { pointer += 1; show(history[pointer], false); } };
  $("breload").onclick = () => { if (history[pointer]) show(history[pointer], false); };
  $("bwindow").onclick = () => { if (history[pointer]) window.open(history[pointer], "_blank", "width=1100,height=800"); };
}

const es = new EventSource("/events");
es.onmessage = (e) => {
  const { type, payload } = JSON.parse(e.data);
  if (type === "board") {
    const th = payload.thread ?? "__main__";
    // スレッド別キャッシュがあれば新着をpush(開いたことのあるスレッドのみ)
    if (threadBoards.has(th)) {
      const arr = threadBoards.get(th);
      if (!arr.some((p) => p.id === payload.id)) arr.push(payload);
    }
    if (th === selectedThread) {
      refreshSoon(); // デバウンス付きで全再描画(ストリームは毎回全件から組み直す)
    } else {
      unread[th] = (unread[th] ?? 0) + 1;
      if (lastState) renderNav(lastState.live.threads);
    }
    return;
  }
  if (type === "board.cleared") {
    const th = payload?.thread ?? "__main__";
    threadBoards.delete(th); // スレッド別キャッシュを捨てる(次回は空のディスクから読み直す)
    unread[th] = 0;
    if (th === selectedThread) renderAll();
    else if (lastState) renderNav(lastState.live.threads);
    return;
  }
  if (["agent.turn", "agent.delta", "tool.call", "tool.result", "agent.status", "agent.spawned", "thread.opened", "merge.completed", "model.changed",
       "task.claimed", "task.finished", "task.created", "task.released", "task.cancelled", "task.autoResolved",
       "scenario.started", "scenario.finished"].includes(type)) {
    refreshSoon();
  }
};
const ALL_COMMANDS = () => ({
    ...COMMANDS,
    ...Object.fromEntries(Object.entries(customCommands ?? {}).map(([c, d]) => [c, d + "(カスタム)"])),
  });
  function renderSuggestions(input) {
    const box = document.getElementById("suggest");
    if (!input.startsWith("/")) { box.style.display = "none"; return; }
    const word = input.slice(1).split(/\s/)[0].toLowerCase();
    const matches = Object.entries(ALL_COMMANDS()).filter(([c]) => word === "" || c.toLowerCase().startsWith(word));
    if (!matches.length) { box.style.display = "none"; return; }
    box.style.display = "block";
    box.innerHTML = "";
    for (const [c, d] of matches) {
      const div = document.createElement("div");
      div.className = "sug";
      div.innerHTML = "<b>/" + c + "</b><span class='d'>" + d + "</span>";
      div.onclick = () => {
        const needsArgs = ["session", "thread", "close"].includes(c) || customCommands[c];
        document.getElementById("saytext").value = "/" + c + (needsArgs ? " " : "");
        box.style.display = "none";
        document.getElementById("saytext").focus();
      };
      box.appendChild(div);
    }
  }
  $("saytext").addEventListener("input", () => renderSuggestions($("saytext").value));
  function renderTerminalTab() {
    const body = document.getElementById("ctx-body");
    body.innerHTML = "";
    const topRow = document.createElement("div");
    topRow.style.cssText = "display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;";
    const sec = document.createElement("div");
    sec.className = "sec";
    sec.style.margin = "0";
    sec.textContent = "ターミナル";
    const clearBtn = document.createElement("button");
    clearBtn.className = "btn";
    clearBtn.textContent = "消去";
    clearBtn.onclick = () => {
      window.__termOut = "";
      if (out) out.textContent = "";
    };
    topRow.append(sec, clearBtn);
    const out = document.createElement("pre");
    out.className = "fileview mono";
    out.style.minHeight = "200px";
    out.style.marginTop = "8px";
    out.textContent = window.__termOut ?? "";
    const input = document.createElement("input");
    input.className = "filter mono";
    input.placeholder = "コマンド(ワークスペース直下で実行)";
    input.addEventListener("keydown", async (e) => {
      if (e.key !== "Enter" || !input.value.trim()) return;
      const cmd = input.value.trim();
      input.value = "";
      window.__termOut = (window.__termOut ?? "") + "$ " + cmd + "\n";
      out.textContent = window.__termOut + "実行中...";
      out.scrollTop = out.scrollHeight;
      const r = await (await hfetch("/api/exec", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ command: cmd }) })).json();
      window.__termOut += (r.text ?? "") + "\n";
      out.textContent = window.__termOut;
      out.scrollTop = out.scrollHeight;
    });
    body.appendChild(topRow);
    body.appendChild(input);
    body.appendChild(out);
  }
  $("saybtn").onclick = sendSay;
$("saytext").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) sendSay(); });
// 画像添付: 添付ボタン or 入力欄へのペースト。dataURL化してからサーバーへ保存させる

});

// 日別・スレッド別の消費集計ビュー(GitHubイシュー#6)を描画する。
// データ源は /api/usage の aggregate(aggregateUsage: byDate/byThread/matrix)。
async function renderUsageAggregate(box) {
  const byDate = document.createElement("div");
  const byThread = document.createElement("div");
  box.append(byDate, byThread);
  let agg = null;
  try {
    const r = await (await hfetch("/api/usage")).json();
    agg = r.aggregate ?? null;
  } catch {}
  if (!agg || !(agg.byDate ?? []).length) {
    const h = document.createElement("div");
    h.className = "hint";
    h.textContent = "集計できる消費記録はまだありません。";
    box.appendChild(h);
    return;
  }
  const mkTable = (head, rows) => {
    const tbl = document.createElement("table");
    tbl.className = "usage-tbl";
    tbl.innerHTML = "<thead><tr>" + head.map((h) => "<th>" + escapeHtml(h) + "</th>").join("") + "</tr></thead>";
    const tb = document.createElement("tbody");
    for (const r of rows) tb.appendChild(r);
    tbl.appendChild(tb);
    return tbl;
  };
  const td = (t, cls) => {
    const c = document.createElement("td");
    if (cls) c.className = cls;
    c.textContent = t;
    return c;
  };
  const money = (n) => "$" + Number(n ?? 0).toFixed(4);
  // 日別(新しい順)
  const dh = document.createElement("div");
  dh.className = "sec";
  dh.textContent = "日別の消費(直近14日)";
  const dateRows = agg.byDate.map((r) => {
    const tr = document.createElement("tr");
    tr.append(td(r.date), td((r.calls ?? 0).toLocaleString()), td((r.promptTokens ?? 0).toLocaleString()),
      td((r.completionTokens ?? 0).toLocaleString()), td((r.reasoningTokens ?? 0).toLocaleString()), td(money(r.costUsd)));
    return tr;
  });
  byDate.append(dh, mkTable(["日付", "calls", "prompt", "completion", "reasoning", "cost"], dateRows));
  // スレッド別(消費の大きい順)+ 日別xスレッド
  const sh = document.createElement("div");
  sh.className = "sec";
  sh.textContent = "スレッド別の消費";
  const threadRows = agg.byThread.map((r) => {
    const tr = document.createElement("tr");
    tr.append(td(r.thread), td((r.calls ?? 0).toLocaleString()), td((r.promptTokens ?? 0).toLocaleString()),
      td((r.completionTokens ?? 0).toLocaleString()), td((r.reasoningTokens ?? 0).toLocaleString()), td(money(r.costUsd)));
    return tr;
  });
  byThread.append(sh, mkTable(["スレッド", "calls", "prompt", "completion", "reasoning", "cost"], threadRows));
  const total = agg.byThread.reduce((a, r) => a + (r.costUsd ?? 0), 0);
  const sum = document.createElement("div");
  sum.className = "hint";
  sum.textContent = "集計期間内の合計: " + money(total) + " / " + agg.byThread.length + "スレッド";
  byThread.appendChild(sum);
}
}
