<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>agent-hive</title>
<script src="/markdown.js"></script>
<style>
  /* 構造はDiscord、色は黒灰基調+細部のオレンジアクセントのみ。
     設計上の要点: UIはサンセリフ/等幅はログ・ID・コードのみ、絵文字は使わない、
     案内文は書かずhoverと色で示す、サイズは11/12/13/15の4段階 */
  :root {
    color-scheme: dark;
    --bg: #19191b;
    --panel: #151517;
    --panel2: #2b2b30;
    --line: #2c2c31;
    --line-strong: #43434b;
    --label: #eaeaea;
    --label-secondary: #a3a3a8;
    --label-tertiary: #717177;
    --separator: #2c2c31;
    --fill: rgba(255, 255, 255, 0.055);
    --fill-strong: rgba(255, 255, 255, 0.10);
    --accent: #f5a35b;
    --accent-fill: rgba(245, 163, 91, 0.12);
    --accent-contrast: #1c1208;
    --ok: #86efac; --warn: #fbbf24; --err: #fca5a5;
    --bg-elevated: #202023;
    --recess: #131315;
    --sub: #a3a3a8;
    --shadow-overlay: 0 8px 24px rgba(0, 0, 0, 0.55);
    --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.30), 0 2px 6px rgba(0, 0, 0, 0.18);
    --inset-field: inset 0 1px 2px rgba(0, 0, 0, 0.28);
    --ease: cubic-bezier(0.25, 0.1, 0.25, 1);
    --duration: 150ms;
    --font-ui: system-ui, "Segoe UI", "Meiryo", "Noto Sans JP", sans-serif;
    --font-mono: ui-monospace, "Cascadia Mono", Consolas, "SFMono-Regular", monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f0f0f2;
      --panel: #f7f7f8;
      --panel2: #e8e8ea;
      --line: #e3e3e5;
      --line-strong: #c0c0c6;
      --label: #212124;
      --label-secondary: #6d6d72;
      --label-tertiary: #939398;
      --separator: #e2e2e4;
      --fill: rgba(0, 0, 0, 0.05);
      --fill-strong: rgba(0, 0, 0, 0.09);
      --accent: #b45309;
      --accent-fill: rgba(180, 83, 9, 0.10);
      --accent-contrast: #ffffff;
      --ok: #1a7f37; --warn: #9a6700; --err: #cf222e;
      --bg-elevated: #ffffff;
      --recess: #e9e9ec;
      --sub: #6d6d72;
      --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.08), 0 2px 6px rgba(0, 0, 0, 0.06);
      --inset-field: inset 0 1px 2px rgba(0, 0, 0, 0.06);
    }
  }
  * { box-sizing: border-box; }
  @media (prefers-color-scheme: light) {
    .member .anm, .msg .who, .agentcard .nm { color: hsl(var(--ah, 210) 45% 36%); }
  }
  body {
    margin: 0; height: 100vh; overflow: hidden;
    font-family: var(--font-ui);
    background: var(--bg); color: var(--label);
    display: grid; grid-template-columns: 240px 1fr 340px;
    grid-template-rows: minmax(0, 1fr);
    font-size: 13px; line-height: 1.45;
  }
  .mono { font-family: var(--font-mono); }

  .btn { background: var(--fill); border: none; color: var(--label); border-radius: 4px; padding: 4px 12px; font-size: 12px; font-family: var(--font-ui); cursor: pointer; transition: background var(--duration) var(--ease), box-shadow var(--duration) var(--ease), transform var(--duration) var(--ease); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 1px 2px rgba(0, 0, 0, 0.22); }
  .btn:hover { background: var(--fill-strong); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 2px 5px rgba(0, 0, 0, 0.28); }
  .btn:active { transform: translateY(1px); box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.20); }
  .btn.primary { background: var(--accent); color: var(--accent-contrast); font-weight: 600; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25), 0 1px 3px rgba(0, 0, 0, 0.35); }

  /* ============ 左: ナビ ============ */
  #nav { background: var(--bg-elevated); border-right: 1px solid var(--separator); display: flex; flex-direction: column; padding: 10px 8px; gap: 1px; min-height: 0; overflow-y: auto; }
  #nav .logo { padding: 4px 8px 12px; color: var(--label); font-weight: 700; font-size: 15px; }
  #nav-search { background: var(--recess); border: 1px solid var(--separator); color: var(--label); border-radius: 4px; padding: 5px 8px; font-size: 12px; font-family: var(--font-ui); margin: 0 8px 4px; box-shadow: var(--inset-field); }
  #nav-search:focus { outline: none; border-color: var(--accent); }
  #nav-search::placeholder { color: var(--label-tertiary); }
  .navlabel { font-size: 11px; color: var(--label-tertiary); border-top: 1px solid var(--separator); margin: 8px 4px 0; padding: 8px 4px 3px; }
  #nav-main { margin-bottom: 2px; }
  .room { padding: 5px 8px 6px; border-radius: 4px; cursor: pointer; font-size: 13px; position: relative; transition: background var(--duration) var(--ease); }
  .room:hover { background: var(--fill); }
  .room.active { background: var(--fill-strong); box-shadow: inset 2px 0 0 var(--accent); }
  .room .sub { display: block; font-size: 11px; color: var(--label-tertiary); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .room.active .sub { color: var(--label-secondary); }
  .badge { position: absolute; right: 8px; top: 6px; background: var(--err); color: var(--accent-contrast); border-radius: 8px; font-size: 10px; font-weight: 700; padding: 0 5px; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.35); }
  #nav .foot { margin-top: auto; font-size: 11px; color: var(--label-tertiary); padding: 8px; }

  /* ============ 中央: 会話 ============ */
  #chat { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #roomhead { border-bottom: 1px solid var(--separator); padding: 9px 16px; background: var(--bg-elevated); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.16); position: relative; z-index: 2; }
  #room-title { font-size: 15px; font-weight: 700; }
  #room-goal { font-size: 12px; color: var(--label-secondary); margin-top: 1px; }
  #room-members { display: flex; gap: 6px; margin-top: 7px; flex-wrap: wrap; align-items: center; }
  .member .anm { color: hsl(var(--ah, 210) 45% 74%); }
  .member { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; background: var(--fill); border: none; border-radius: 12px; padding: 2px 9px; cursor: pointer; color: var(--label); transition: background var(--duration) var(--ease), box-shadow var(--duration) var(--ease); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 1px 2px rgba(0, 0, 0, 0.18); }
  .member:hover { background: var(--fill-strong); }
  .member.sel { background: var(--accent-fill); box-shadow: 0 0 0 1px var(--accent), 0 1px 3px rgba(0, 0, 0, 0.25); }
  .member.passive { cursor: default; color: var(--label-secondary); }
  .member.passive:hover { background: var(--fill); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--label-tertiary); flex-shrink: 0; }
  .dot.working { background: var(--warn); }
  .dot.done { background: var(--ok); }
  .dot.error, .dot.budget-stop { background: var(--err); }
  #permzone { padding: 0 16px; }
  .permcard { background: var(--bg-elevated); border: 1px solid var(--line-strong); border-radius: 6px; padding: 8px 12px; margin-top: 10px; font-size: 13px; box-shadow: var(--shadow-card); }
  .permcard b { color: var(--err); font-size: 12px; }
  .permcard .cmd { font-family: var(--font-mono); font-size: 12px; color: var(--label); margin: 4px 0 8px; word-break: break-all; }
  .permcard .btn { margin-right: 6px; }

  #stream { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 1px; }
  .msg { padding: 5px 10px; font-size: 13px; border-radius: 4px; }
  .msg:hover { background: var(--fill); }
  .msg .who { font-size: 12px; color: hsl(var(--ah, 210) 45% 74%); margin-bottom: 2px; font-weight: 600; }
  .msg.mine { background: var(--accent-fill); box-shadow: inset 2px 0 0 var(--accent); }
  .msg.mine .who { color: var(--accent); }
  .msg p { margin: 3px 0; }
  .msg h1, .msg h2, .msg h3, .msg h4 { margin: 8px 0 4px; font-size: 13px; color: var(--label); }
  .msg ul, .msg ol { margin: 3px 0; padding-left: 20px; }
  .msg blockquote { border-left: 2px solid var(--separator); margin: 3px 0; padding: 2px 10px; color: var(--label-secondary); }
  .msg code { background: var(--fill); border-radius: 3px; padding: 0 4px; font-family: var(--font-mono); font-size: 12px; }
  .msg pre { background: var(--recess); border: 1px solid var(--separator); border-radius: 4px; padding: 8px; overflow-x: auto; font-family: var(--font-mono); font-size: 12px; box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.18); }
  .msg pre code { padding: 0; background: none; }
  .msg table { border-collapse: collapse; margin: 5px 0; font-size: 12px; }
  .msg th, .msg td { border: 1px solid var(--separator); padding: 2px 8px; text-align: left; }
  .msg a { color: var(--accent); }
  .msg hr { border: none; border-top: 1px solid var(--separator); margin: 8px 0; }
  .msg img.md-img { min-height: 48px; max-width: 100%; object-fit: contain; background: var(--bg); border-radius: 4px; display: block; margin: 4px 0; }
  .sysline { font-size: 11px; color: var(--label-tertiary); padding: 3px 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sysline.merge { cursor: pointer; border-radius: 4px; }
  .sysline.merge:hover { background: var(--fill); color: var(--label-secondary); }
  .mergediff { background: var(--recess); border: 1px solid var(--separator); border-radius: 4px; padding: 8px; margin: 2px 10px; font-family: var(--font-mono); font-size: 11px; white-space: pre-wrap; word-break: break-word; max-height: 40vh; overflow-y: auto; color: var(--label-secondary); }
  .loadmore { align-self: center; font-size: 12px; color: var(--accent); cursor: pointer; padding: 6px 14px; border-radius: 4px; }
  .loadmore:hover { background: var(--fill); }
  .folder-h { font-size: 10px; color: var(--label-tertiary); padding: 8px 8px 2px; font-weight: 600; }
  .room-folder-btn { margin-left: auto; background: none; border: none; color: var(--label-tertiary); cursor: pointer; font-size: 10px; padding: 0 3px; opacity: 0; flex-shrink: 0; }
  .room:hover .room-folder-btn { opacity: 1; }
  .room-folder-btn:hover { color: var(--accent); }

  #composer { border-top: 1px solid var(--separator); padding: 10px 16px 12px; background: var(--bg-elevated); position: relative; box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.14); }
  #suggest { position: absolute; bottom: 100%; left: 16px; right: 16px; background: var(--bg-elevated); border: 1px solid var(--line-strong); border-radius: 6px; box-shadow: var(--shadow-overlay); max-height: 240px; overflow-y: auto; z-index: 5; }
  #suggest .sug { padding: 4px 12px; cursor: pointer; font-size: 12px; color: var(--label); }
  #suggest .sug b { font-family: var(--font-mono); font-weight: 600; }
  #suggest .sug .d { color: var(--label-tertiary); margin-left: 8px; font-size: 11px; }
  #suggest .sug:hover, #suggest .sug.sel { background: var(--accent-fill); }
  #composer .row { display: flex; gap: 6px; }
  #saytext { flex: 1; background: var(--recess); border: 1px solid var(--separator); color: var(--label); border-radius: 4px; padding: 7px 10px; font-size: 13px; font-family: var(--font-ui); box-shadow: var(--inset-field); }
  #saytext:focus { outline: none; border-color: var(--accent); }
  #attachbtn { width: 34px; flex-shrink: 0; background: var(--fill); border: none; color: var(--label-secondary); border-radius: 4px; font-size: 16px; cursor: pointer; transition: background var(--duration) var(--ease), color var(--duration) var(--ease); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 1px 2px rgba(0, 0, 0, 0.22); }
  #attachbtn:hover { background: var(--fill-strong); color: var(--label); }
  #attachbtn:active { transform: translateY(1px); }
  #composer .hint { font-size: 11px; color: var(--label-tertiary); margin-top: 5px; }

  /* ============ 右: 状況パネル ============ */
  #ctx { background: var(--bg-elevated); border-left: 1px solid var(--separator); display: flex; flex-direction: column; min-height: 0; }
  table.usage-tbl { width: 100%; border-collapse: collapse; font-size: 11.5px; font-family: var(--font-mono); margin-bottom: 4px; }
  table.usage-tbl th { text-align: left; color: var(--label-tertiary); font-weight: 600; padding: 2px 6px; border-bottom: 1px solid var(--separator); }
  table.usage-tbl td { padding: 2px 6px; border-bottom: 1px solid var(--separator); }
  table.usage-tbl tr.total td { color: var(--label); border-top: 1px solid var(--line-strong); font-weight: 600; }
  .session-row { display: flex; gap: 6px; margin-bottom: 6px; }
  .session-row input { flex: 1; background: var(--recess); border: 1px solid var(--separator); color: var(--label); border-radius: 4px; padding: 4px 8px; font-size: 12px; box-shadow: var(--inset-field); }
  .session-row input:focus { outline: none; border-color: var(--accent); }
  .session-item { display: flex; justify-content: space-between; align-items: center; padding: 3px 6px; font-size: 12px; border-bottom: 1px solid var(--separator); }
  .session-item:hover { background: var(--fill); }
  #ctx-tabs { display: flex; border-bottom: 1px solid var(--separator); }
  #ctx-tabs .ct { flex: 1; text-align: center; padding: 8px 0; font-size: 12px; color: var(--label-secondary); cursor: pointer; border-bottom: 2px solid transparent; transition: color var(--duration) var(--ease); }
  #ctx-tabs .ct:hover { color: var(--label); }
  #ctx-tabs .ct.active { color: var(--accent); border-bottom-color: var(--accent); }
  body.nopanel { grid-template-columns: 240px 1fr; }
  body.nopanel #ctx { display: none; }
  body.widepanel { grid-template-columns: 240px 1fr 640px; }
  #panel-btn { position: absolute; right: 126px; top: 9px; background: var(--panel2); border: 1px solid var(--separator); color: var(--sub); border-radius: 4px; padding: 3px 10px; font-size: 11px; cursor: pointer; }
  #panel-btn:hover { color: var(--label); border-color: var(--line-strong); }
  #browserpane { display: none; flex: 1; flex-direction: column; min-height: 0; }
  .bbar { display: flex; gap: 4px; padding: 5px; border-bottom: 1px solid var(--separator); }
  .bbar input { flex: 1; background: var(--recess); border: 1px solid var(--separator); color: var(--label); border-radius: 4px; padding: 4px 8px; font-size: 11px; font-family: var(--font-mono); box-shadow: var(--inset-field); }
  .bbar input:focus { outline: none; border-color: var(--accent); }
  .bbar button { background: var(--fill); border: none; color: var(--label); border-radius: 4px; padding: 3px 9px; font-size: 12px; cursor: pointer; }
  .bbar button:hover { background: var(--fill-strong); }
  #bview { width: 100%; flex: 1; }
  #ctx-body { flex: 1; overflow-y: auto; padding: 10px; }
  .sec { font-size: 11px; color: var(--label-tertiary); margin: 10px 0 3px; }
  .sec:first-child { margin-top: 0; }
  .proj { font-size: 12px; color: var(--label); font-weight: 700; margin: 10px 0 2px; }
  .taskrow { display: flex; align-items: baseline; gap: 6px; padding: 2px 4px; border-radius: 4px; font-size: 12px; min-height: 24px; }
  .taskrow:hover { background: var(--fill); }
  .taskrow .tid { font-family: var(--font-mono); font-size: 11px; color: var(--accent); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 52%; flex-shrink: 0; }
  .taskrow .tsum { flex: 1; color: var(--label-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .taskrow .btn { padding: 1px 8px; font-size: 11px; flex-shrink: 0; }
  select.filter { width: 100%; background: var(--recess); border: 1px solid var(--separator); color: var(--label); border-radius: 4px; padding: 4px 6px; font-size: 12px; font-family: var(--font-ui); box-shadow: var(--inset-field); }
  #newtask { display: flex; flex-direction: column; gap: 4px; margin-top: 12px; border-top: 1px solid var(--separator); padding-top: 10px; }
  #newtask input, #newtask textarea { background: var(--recess); border: 1px solid var(--separator); color: var(--label); border-radius: 4px; padding: 5px 7px; font-size: 12px; font-family: var(--font-ui); box-shadow: var(--inset-field); }
  #newtask input:focus, #newtask textarea:focus { outline: none; border-color: var(--accent); }
  #newtask textarea { min-height: 44px; resize: vertical; }
  #newtask .btn { align-self: flex-end; }

  .agentcard { background: transparent; border-radius: 4px; padding: 6px 8px; margin-bottom: 2px; cursor: pointer; font-size: 12px; transition: background var(--duration) var(--ease), box-shadow var(--duration) var(--ease); }
  .agentcard:hover { background: var(--fill); }
  .agentcard.sel { background: var(--accent-fill); box-shadow: inset 2px 0 0 var(--accent); }
  .agentcard .nm { font-weight: 600; color: hsl(var(--ah, 210) 45% 74%); }
  .agentcard .st { float: right; color: var(--label-secondary); font-size: 11px; }
  .agentcard .st.working { color: var(--warn); }
  .agentcard .st.done { color: var(--ok); }
  .agentcard .st.error, .agentcard .st.budget-stop { color: var(--err); }
  .agentcard .meta { color: var(--label-tertiary); font-size: 11px; font-family: var(--font-mono); margin-top: 2px; }
  .agentcard .wtdiff-btn { float: right; margin-right: 4px; background: var(--fill); border: 1px solid var(--separator); color: var(--label-secondary); border-radius: 4px; font-size: 10px; padding: 1px 6px; cursor: pointer; font-family: var(--font-ui); }
  .agentcard .wtdiff-btn:hover { color: var(--label); border-color: var(--line-strong); }
  .wtdiff { background: var(--recess); border: 1px solid var(--separator); border-radius: 4px; margin: 2px 0 8px; max-height: 55vh; overflow-y: auto; box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.18); }
  .wtdiff .wtdiff-head { display: flex; justify-content: space-between; align-items: center; padding: 3px 8px; background: var(--fill); font-family: var(--font-mono); font-size: 11px; color: var(--sub); position: sticky; top: 0; }
  .wtdiff .wtdiff-head button { background: none; border: none; color: var(--label-tertiary); cursor: pointer; font-size: 13px; padding: 0 3px; }
  .wtdiff .wtdiff-head button:hover { color: var(--label); }
  .wtdiff pre { margin: 0; padding: 8px; font-family: var(--font-mono); font-size: 11px; white-space: pre-wrap; word-break: break-word; color: var(--label-secondary); }
  .wtdiff pre.stat { border-bottom: 1px solid var(--separator); color: var(--label); }

  .alog { max-height: 46vh; overflow-y: auto; background: var(--recess); border: 1px solid var(--separator); border-radius: 4px; padding: 6px 8px; font-family: var(--font-mono); font-size: 11.5px; margin: 2px 0 8px; box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.18); }
  .alog .entry { padding: 3px 0; border-bottom: 1px solid var(--separator); white-space: pre-wrap; word-break: break-word; }
  .alog .entry:last-child { border-bottom: none; }
  .alog .entry .k { display: inline-block; min-width: 38px; margin-right: 6px; color: var(--label-tertiary); font-size: 10px; }
  .alog .entry.think .k { color: var(--label-tertiary); }
  .alog .entry.say .k { color: var(--accent); }
  .alog .entry.think .txt { color: var(--label-secondary); }
  .alog .entry.say .txt { color: var(--label); }
  .alog .entry.tool .txt, .alog .entry.result .txt { color: var(--label-secondary); }
  .alog .entry.compact .txt { color: var(--label-secondary); }
  .hint { color: var(--label-tertiary); font-size: 11px; padding: 6px 2px; }
  ul.files { list-style: none; padding: 0; margin: 4px 0; font-size: 12px; }
  ul.files li { cursor: pointer; padding: 2px 6px; border-radius: 4px; font-family: var(--font-mono); font-size: 11.5px; color: var(--label-secondary); }
  ul.files li:hover { background: var(--fill); color: var(--label); }
  .filepanel { margin-top: 8px; border: 1px solid var(--separator); border-radius: 6px; overflow: hidden; }
  .filepanel .filehead { display: flex; justify-content: space-between; align-items: center; padding: 3px 8px; background: var(--fill); font-family: var(--font-mono); font-size: 11px; color: var(--sub); }
  .filepanel .filehead button { background: none; border: none; color: var(--label-tertiary); cursor: pointer; font-size: 13px; padding: 0 3px; }
  .filepanel .filehead button:hover { color: var(--label); }
  pre.fileview { background: var(--recess); border-radius: 0; padding: 8px; font-family: var(--font-mono); font-size: 11.5px; overflow-x: auto; white-space: pre-wrap; margin: 0; max-height: 50vh; overflow-y: auto; }

  /* ダイアログとトースト */
  #settings-dlg { background: var(--bg-elevated); color: var(--label); border: 1px solid var(--line-strong); border-radius: 8px; padding: 14px 16px; width: 420px; box-shadow: var(--shadow-overlay); }
  #settings-dlg::backdrop { background: rgba(0, 0, 0, 0.5); }
  #settings-dlg h3 { margin: 0 0 10px; font-size: 14px; }
  #settings-dlg .set-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  #settings-dlg .set-row label { width: 110px; font-size: 12px; color: var(--sub); flex-shrink: 0; }
  #settings-dlg .set-row input, #settings-dlg .set-row select { flex: 1; background: var(--recess); border: 1px solid var(--separator); color: var(--label); border-radius: 4px; padding: 5px 8px; font-size: 12px; font-family: var(--font-ui); box-shadow: var(--inset-field); }
  #settings-dlg .set-row input:focus, #settings-dlg .set-row select:focus { outline: none; border-color: var(--accent); }
  #settings-dlg .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
  #monitor-btn { position: absolute; right: 64px; top: 9px; background: var(--panel2); border: 1px solid var(--separator); color: var(--sub); border-radius: 4px; padding: 3px 10px; font-size: 11px; cursor: pointer; }
  #monitor-btn:hover { color: var(--label); border-color: var(--line-strong); }
  #monview { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: none; flex-direction: column; }
  #monview .monbar { display: flex; justify-content: space-between; align-items: center; padding: 7px 16px; border-bottom: 1px solid var(--separator); background: var(--bg-elevated); font-size: 12px; color: var(--sub); }
  #monview .monbar button { background: var(--fill); border: none; color: var(--label); border-radius: 4px; padding: 2px 10px; font-size: 12px; cursor: pointer; }
  #monview iframe { flex: 1; border: none; width: 100%; }
  #settings-btn { position: absolute; right: 12px; top: 9px; background: var(--panel2); border: 1px solid var(--separator); color: var(--sub); border-radius: 4px; padding: 3px 10px; font-size: 11px; cursor: pointer; }
  #settings-btn:hover { color: var(--label); border-color: var(--line-strong); }
  #dlg { background: var(--bg-elevated); color: var(--label); border: 1px solid var(--line-strong); border-radius: 8px; padding: 14px 16px; width: 380px; box-shadow: var(--shadow-overlay); }
  #dlg::backdrop { background: rgba(0, 0, 0, 0.5); }
  #dlg h3 { margin: 0 0 6px; font-size: 14px; }
  #dlg .body { font-size: 12px; color: var(--sub); margin-bottom: 10px; white-space: pre-wrap; }
  #dlg input { display: block; width: 100%; background: var(--recess); border: 1px solid var(--separator); color: var(--label); border-radius: 4px; padding: 6px 8px; font-size: 13px; font-family: var(--font-ui); margin-bottom: 12px; box-shadow: var(--inset-field); }
  #dlg input:focus { outline: none; border-color: var(--accent); }
  #dlg .row { display: flex; justify-content: flex-end; gap: 8px; }
  #toasts { position: fixed; bottom: 16px; right: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 50; }
  .toast { background: var(--panel2); border: 1px solid var(--line-strong); border-left: 3px solid var(--accent); color: var(--label); border-radius: 6px; padding: 8px 12px; font-size: 12px; box-shadow: var(--shadow-overlay); max-width: 340px; }
  .toast.err { border-left-color: var(--err); }
</style>
</head>
<body>
  <aside id="nav">
    <div class="logo">agent-hive</div>
    <input id="nav-search" type="text" placeholder="スレッドを検索" autocomplete="off">
    <div id="nav-main"></div>
    <div class="navlabel" id="nav-thread-label">スレッド</div>
    <div id="nav-rooms"></div>
    <div class="foot" id="nav-foot"></div>
  </aside>

  <main id="chat">
    <header id="roomhead">
      <div id="room-title"></div>
      <div id="room-goal"></div>
      <div id="room-members"></div>
      <button id="panel-btn" title="右パネルの表示/非表示">パネル</button>
      <button id="monitor-btn" title="モニタ(読み取り専用ダッシュボード)">モニタ</button>
      <button id="settings-btn" title="設定">設定</button>
    </header>
    <div id="permzone"></div>
    <div id="stream"></div>
    <div id="composer">
      <div id="suggest" style="display:none"></div>
      <div class="row">
        <input id="saytext" placeholder="メッセージ">
        <button id="attachbtn" title="画像を添付">+</button>
        <button id="saybtn" class="btn primary">送信</button>
        <input type="file" id="attachfile" accept="image/png,image/jpeg,image/gif,image/webp" style="display:none">
      </div>
      <div class="hint" id="composer-hint"></div>
    </div>
  </main>

  <div id="monview" style="display:none">
    <div class="monbar"><span>agent-hive monitor(読み取り専用)</span><button id="monclose" title="閉じる">×</button></div>
    <iframe id="monframe" title="monitor"></iframe>
  </div>

  <aside id="ctx">
    <div id="ctx-tabs">
      <div class="ct active" data-tab="tasks">タスク</div>
      <div class="ct" data-tab="agents">エージェント</div>
      <div class="ct" data-tab="files">ファイル</div>
      <div class="ct" data-tab="status">状況</div>
      <div class="ct" data-tab="term">ターミナル</div>
      <div class="ct" data-tab="browser">ブラウザ</div>
      <div class="ct" data-tab="memory">メモリ</div>
    </div>
    <div id="ctx-body"></div>
    <div id="browserpane">
      <div class="bbar">
        <button id="bback" title="戻る">‹</button>
        <button id="bfwd" title="進む">›</button>
        <button id="breload" title="再読み込み">↻</button>
        <input id="burl" placeholder="URLを入力してEnter(例: https://example.com)">
        <button id="bgo">開く</button>
        <button id="bwindow" title="フレーム表示を許可しないサイトはこちらから">ウィンドウ</button>
      </div>
      <iframe id="bview" title="browser"></iframe>
    </div>
  </aside>

  <dialog id="settings-dlg">
    <h3>設定</h3>
    <div class="set-row"><label>思考レベル</label>
      <select id="set-effort"><option value="low">low(速い・安い)</option><option value="medium">medium</option><option value="high">high(じっくり)</option></select>
    </div>
    <div class="set-row"><label>モデル</label><input id="set-model" spellcheck="false"></div>
    <div class="set-row"><label>フォールバック</label><input id="set-fallback" placeholder="カンマ区切り" disabled></div>
    <div class="set-row"><label>権限モード</label>
      <select id="set-perm"><option value="normal">normal(要承認)</option><option value="auto">auto(自動許可)</option></select>
    </div>
    <div class="set-row"><label>MCPサーバー</label><span class="mono" id="set-mcp" style="font-size:11px;color:var(--sub)"></span></div>
    <div class="set-row"><label>メモリ</label><span class="mono" id="set-mem" style="font-size:11px;color:var(--sub)"></span></div>
    <div class="row">
      <button class="btn" id="settings-cancel">閉じる</button>
      <button class="btn primary" id="settings-save">保存</button>
    </div>
  </dialog>
  <dialog id="dlg">
    <h3 id="dlg-title"></h3>
    <div class="body" id="dlg-body"></div>
    <input id="dlg-input">
    <div class="row">
      <button class="btn" id="dlg-cancel">キャンセル</button>
      <button class="btn primary" id="dlg-ok">決定</button>
    </div>
  </dialog>
  <div id="toasts"></div>

<script>
/* ================= 状態 ================= */
let selectedThread = "__main__";
// スラッシュコマンドの定義(/helpはこの一覧から自動生成)
const COMMANDS = {
  help: "コマンド一覧",
  workflow: "ワークフロー実行(/workflow <名前>)",
  tasks: "現在のタスク一覧",
  usage: "エージェント別の消費",
  threads: "スレッド一覧",
  session: "セッションの保存/復元(/session save <名前>)",
  model: "現在のモデル表示",
  thread: "スレッドを直接開く(/thread <名前> <目標>)",
  close: "スレッドを閉じる(/close <名前>)",
};
let customCommands = {};
let uiEffort = null;
let uiModelName = null;
let selectedAgent = null;
let ctxTab = "tasks";
let projectFilter = "";
const unread = {}; // thread => 件数
let lastState = null;
// ボード描画の窓(末尾N件)とマージ差分の展開状態。スレッド切替でリセット
const BOARD_WINDOW = 200;
let boardWindow = BOARD_WINDOW;
const expandedMerges = new Set();
let anchorPid = null;
const NAMES = { alpha: "アルファ", beta: "ベータ", gamma: "ガンマ", delta: "デルタ", system: "システム", you: "あなた", lead: "リーダー" };
// ワーカー識別色: エージェントIDのハッシュから色相を安定生成する(状態はドットの色が担う)
const agentHue = (id) => {
  let h = 0;
  for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) % 360;
  return h;
};
const STATUS_JA = { idle: "待機", thinking: "思考中", working: "作業中", done: "完了", error: "エラー", "budget-stop": "停止" };
const statusJa = (s) => STATUS_JA[s ?? "idle"] ?? (s ?? "idle");
const KIND_JA = { think: "思考", say: "発言", tool: "ツール", result: "結果", status: "状態", compact: "要約" };
const threadOf = (a) => a?.thread ?? "__main__";
const $ = (id) => document.getElementById(id);

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

/* ================= 左ナビ ================= */
let navQuery = "";
function renderNav(threads) {
  // メインはスレッド一覧から分離してナビ最上部の独立セクションに置く
  const all = (threads ?? []).filter((t) => t.name !== "__main__");
  const q = navQuery.trim().toLowerCase();
  const ths = q ? all.filter((t) => t.name.toLowerCase().includes(q) || (t.goal ?? "").toLowerCase().includes(q) || (t.folder ?? "").toLowerCase().includes(q)) : all;
  $("nav-thread-label").textContent = `スレッド${all.length ? ` (${ths.length}/${all.length})` : ""}`;
  const makeRoom = (parent, t) => {
    const d = document.createElement("div");
    d.className = "room" + (selectedThread === t.id ? " active" : "");
    // 進捗(タスクの完了率)をサブに足す
    let prog = "";
    if (t.id !== "__main__") {
      const all = (lastState?.taskList ?? { open: [], claimed: [], done: [] });
      const inP = [...all.open, ...all.claimed, ...all.done].filter((x) => (x.project || "") === t.id);
      if (inP.length) {
        const doneN = inP.filter((x) => x.state === "done").length;
        prog = `${doneN}/${inP.length} 完了`;
      }
    }
    d.innerHTML = `${escapeHtml(t.label)}<span class="sub">${escapeHtml((t.sub ?? "") + (prog ? ` (${prog})` : ""))}</span>`;
    if (unread[t.id]) {
      const b = document.createElement("span");
      b.className = "badge";
      b.textContent = unread[t.id];
      d.appendChild(b);
    }
    d.onclick = () => {
      selectedThread = t.id;
      unread[t.id] = 0;
      selectedAgent = null;
      projectFilter = t.id === "__main__" ? "" : t.id;
      boardWindow = BOARD_WINDOW;
      expandedMerges.clear();
      renderAll();
    };
    if (t.id !== "__main__" && t.name) {
      const fb = document.createElement("button");
      fb.className = "room-folder-btn";
      fb.title = "フォルダを編集";
      fb.textContent = "編";
      fb.onclick = async (e) => {
        e.stopPropagation();
        const cur = (lastState?.live.threads ?? []).find((x) => x.name === t.id)?.folder ?? "";
        const v = await askText({ title: "フォルダを編集", label: `#${t.id} のフォルダ(空欄で未分類)`, value: cur, ok: "保存" });
        if (v === null) return;
        const r = await (await fetch("/api/folder", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ project: t.id, folder: v }) })).json();
        if (r.error) toast(r.error);
        else refresh();
      };
      d.appendChild(fb);
    }
    parent.appendChild(d);
  };
  const mainBox = $("nav-main");
  mainBox.innerHTML = "";
  makeRoom(mainBox, { id: "__main__", label: "メイン", sub: "リーダーと壁打ち・計画" });
  const list = $("nav-rooms");
  list.innerHTML = "";
  if (ths.length && ths.some((t) => t.folder)) {
    // フォルダが1つでもあるときはフォルダ単位でグループ化
    const groups = {};
    for (const t of ths) (groups[t.folder || "未分類"] ??= []).push(t);
    for (const f of Object.keys(groups).sort((a, b) => a.localeCompare(b, "ja"))) {
      const h = document.createElement("div");
      h.className = "folder-h";
      h.textContent = f;
      list.appendChild(h);
      for (const t of groups[f]) makeRoom(list, { id: t.name, label: "# " + t.name, sub: t.goal });
    }
  } else {
    for (const t of ths) makeRoom(list, { id: t.name, label: "# " + t.name, sub: t.goal });
  }
}

/* ================= 中央: 会話 ================= */
function currentMembers(state) {
  return Object.entries(state.live.agents).filter(([id, a]) => threadOf(a) === selectedThread);
}

function renderRoomHead(state) {
  const th = (state.live.threads ?? []).find((t) => t.name === selectedThread);
  if (selectedThread === "__main__") {
    $("room-title").textContent = "メイン";
    $("room-goal").textContent = "リーダーと壁打ち・計画。実行はサブスレッドへ";
  } else {
    $("room-title").textContent = "# " + selectedThread;
    $("room-goal").textContent = th?.goal ?? "";
  }
  const mem = $("room-members");
  mem.innerHTML = "";
  let sumTokens = 0;
  let sumCost = 0;
  for (const [id, a] of currentMembers(state)) {
    sumTokens += a.tokens ?? 0;
    sumCost += a.costUsd ?? 0;
    const chip = document.createElement("span");
    chip.className = "member" + (selectedAgent === id ? " sel" : "");
    chip.style.setProperty("--ah", agentHue(id));
    chip.innerHTML = `<span class="dot ${(a.status ?? "idle").replace(/\s/g, "")}"></span><span class="anm">${escapeHtml(a.displayName ?? NAMES[id] ?? id)}</span>`;
    chip.title = `${statusJa(a.status)} · turn ${a.turn ?? 0} · クリックでログ`;
    chip.onclick = () => { selectedAgent = selectedAgent === id ? null : id; ctxTab = "agents"; renderAll(); };
    mem.appendChild(chip);
  }
  if (sumTokens > 0) {
    const s = document.createElement("span");
    s.className = "member passive";
    s.innerHTML = `計 ${sumTokens.toLocaleString()} tok · $${sumCost.toFixed(4)}`;
    s.title = "このスレッドのメンバーの合計消費";
    mem.appendChild(s);
  }
  const hint = $("composer-hint");
  hint.textContent = selectedThread === "__main__" ? "宛先: リーダー" : `宛先: ${selectedThread} のメンバー全員`;
  $("saytext").placeholder = selectedThread === "__main__" ? "リーダーへメッセージ" : `${selectedThread} のメンバーへメッセージ`;
}

function renderStream(state) {
  const stream = $("stream");
  const nearBottom = stream.scrollHeight - stream.scrollTop - stream.clientHeight < 120;
  const prevTop = stream.scrollTop;
  const prevHeight = stream.scrollHeight;
  stream.innerHTML = "";
  // 描画は末尾200件に絞る(履歴が増えても軽く)。それより前は読み込みボタンで展開
  const posts = state.live.board.filter((p) => (p.thread ?? "__main__") === selectedThread);
  let shown = posts;
  if (posts.length > boardWindow) {
    shown = posts.slice(-boardWindow);
    const more = document.createElement("div");
    more.className = "loadmore";
    more.textContent = `以前の投稿を読み込む(${Math.max(0, ((state.live.boardTotal ?? posts.length) - (state.live.board?.length ?? posts.length)) + (posts.length - boardWindow))}件)`;
    more.onclick = () => loadOlderPosts(shown[0]?.id ?? null);
    stream.appendChild(more);
  }
  for (const p of shown) {
    if (p.from === "system") {
      const d = document.createElement("div");
      d.className = "sysline";
      d.textContent = p.text.replace(/^\[[^\]]+\]\s*/, "");
      d.title = p.text;
      // マージ行はクリックでマージ差分を開閉できる
      const tm = p.text.match(/^\[マージ\].*?タスク (\S+) の成果/);
      const rec = tm && (state.live.merges ?? []).find((m) => m.taskId === tm[1]);
      if (tm && rec && (rec.patch || rec.stat)) {
        d.classList.add("merge");
        d.title = "クリックでマージ差分";
        d.onclick = () => {
          if (expandedMerges.has(tm[1])) expandedMerges.delete(tm[1]);
          else expandedMerges.add(tm[1]);
          renderStream(lastState);
        };
        stream.appendChild(d);
        if (expandedMerges.has(tm[1])) {
          const pre = document.createElement("pre");
          pre.className = "mergediff";
          pre.textContent = (rec.stat ? rec.stat + "\n" : "") + (rec.patch ?? "");
          stream.appendChild(pre);
        }
        continue;
      }
      stream.appendChild(d);
      continue;
    }
    const mine = p.from === "you";
    const d = document.createElement("div");
    d.className = "msg" + (mine ? " mine" : "");
    d.dataset.pid = p.id;
    const who = document.createElement("div");
    who.className = "who " + p.from;
    if (!mine) d.style.setProperty("--ah", agentHue(p.from));
    who.textContent = mine ? "あなた" : (NAMES[p.from] ?? p.from);
    const body = document.createElement("div");
    body.innerHTML = renderMarkdown(p.text);
    d.append(who, body);
    stream.appendChild(d);
  }
  // スラッシュコマンドの応答(ローカル)。board再描画の最後に足す
  for (const e of ephemeral) {
    const d = document.createElement("div");
    d.className = "msg mine";
    const who = document.createElement("div");
    who.className = "who";
    who.textContent = "/";
    const body = document.createElement("div");
    body.textContent = e.text;
    d.append(who, body);
    stream.appendChild(d);
  }
  if (anchorPid !== null) {
    // 読み込み展開後は、展開前に見ていた先頭メッセージへスクロールを戻す
    const el = stream.querySelector(`[data-pid="${anchorPid}"]`);
    anchorPid = null;
    if (el) {
      stream.scrollTop = el.getBoundingClientRect().top - stream.getBoundingClientRect().top + stream.scrollTop - 12;
      return;
    }
  }
  if (nearBottom) stream.scrollTop = stream.scrollHeight;
  // 下端以外で再描画された場合は読書中の位置を保つ(最上部へのジャンプ防止)
  else stream.scrollTop = stream.scrollHeight - prevHeight + prevTop;
}

function renderPerms(requests) {
  const el = $("permzone");
  el.innerHTML = "";
  for (const r of (requests ?? []).filter((x) => x.state === "pending")) {
    const d = document.createElement("div");
    d.className = "permcard";
    d.innerHTML = `<b>承認要求 #${r.id}</b><div class="cmd">${escapeHtml(r.command)}</div>`;
    const ok = document.createElement("button");
    ok.className = "btn primary";
    ok.textContent = "承認";
    ok.onclick = () => decide(r.id, true);
    const no = document.createElement("button");
    no.className = "btn";
    no.textContent = "拒否";
    no.onclick = () => decide(r.id, false);
    d.append(ok, no);
    el.appendChild(d);
  }
}

/* ================= 右: 状況パネル ================= */
function renderCtx(state) {
  for (const b of document.querySelectorAll("#ctx-tabs .ct")) {
    b.classList.toggle("active", b.dataset.tab === ctxTab);
  }
  const body = $("ctx-body");
  const browsing = ctxTab === "browser";
  if (browsing) initBrowserPane();
  $("browserpane").style.display = browsing ? "flex" : "none";
  body.style.display = browsing ? "none" : "";
  document.body.classList.toggle("widepanel", browsing && !document.body.classList.contains("nopanel"));
  body.innerHTML = "";
  if (ctxTab === "tasks") renderTasksTab(body, state);
  if (ctxTab === "agents") renderAgentsTab(body, state);
  if (ctxTab === "files") renderFilesTab(body);
  if (ctxTab === "status") renderStatusTab(body);
  if (ctxTab === "memory") renderMemoryTab(body);
  if (ctxTab === "term") renderTerminalTab();
}

function renderTasksTab(body, state) {
  const list = state.taskList ?? { open: [], claimed: [], done: [] };
  const inThread = selectedThread !== "__main__";
  const all = [...list.open, ...list.claimed, ...list.done].filter((t) => !inThread || (t.project || "") === selectedThread);
  const projects = [...new Set(all.map((t) => t.project || ""))].sort();

  if (inThread) {
    const s = document.createElement("div");
    s.className = "sec";
    s.textContent = `${selectedThread} のタスク`;
    body.appendChild(s);
  } else {
    const sel = document.createElement("select");
    sel.className = "filter";
    const opts = ["", ...projects, "__none__"];
    const cur = projectFilter;
    for (const p of opts) {
      const o = document.createElement("option");
      o.value = p;
      o.textContent = p === "" ? "すべてのプロジェクト" : p === "__none__" ? "(未分類)" : p;
      sel.appendChild(o);
    }
    sel.value = cur;
    if (!opts.includes(cur)) { projectFilter = ""; sel.value = ""; }
    sel.onchange = (e) => { projectFilter = e.target.value; renderCtx(lastState); };
    body.appendChild(sel);
  }

  const visible = all.filter((t) => inThread || projectFilter === "" || (projectFilter === "__none__" ? !t.project : (t.project || "") === projectFilter));
  const groups = inThread ? [["", ""]] : [...projects.map((p) => [p, p]), ["", "(未分類)"]];
  const secs = [
    ["open", "未着手", () => ({ label: "中止", action: "cancel" })],
    ["claimed", "作業中", () => ({ label: "解放", action: "release" })],
    ["done", "完了", () => ({ label: "再開", action: "reopen" })],
  ];
  for (const [proj, label] of groups) {
    const inProj = visible.filter((t) => (t.project || "") === proj);
    if (!inProj.length) continue;
    const ph = document.createElement("div");
    ph.className = "proj";
    ph.textContent = label;
    body.appendChild(ph);
    for (const [st, stLabel, btn] of secs) {
      const rows = inProj.filter((t) => t.state === st);
      if (!rows.length) continue;
      const sh = document.createElement("div");
      sh.className = "sec";
      sh.textContent = `${stLabel}(${rows.length})`;
      body.appendChild(sh);
      for (const t of rows) {
        const row = document.createElement("div");
        row.className = "taskrow";
        const id = document.createElement("span");
        id.className = "tid";
        id.textContent = t.id + (t.agent && !["auto", "you"].includes(t.agent) ? ` @${t.agent}` : "");
        id.title = t.summary;
        id.onclick = () => showTaskBody(t);
        const sum = document.createElement("span");
        sum.className = "tsum";
        sum.textContent = t.summary;
        sum.onclick = () => showTaskBody(t);
        const mv = document.createElement("button");
        mv.className = "btn";
        mv.textContent = "移動";
        mv.title = "プロジェクトを付け替える";
        mv.onclick = async (e) => {
          e.stopPropagation();
          const p = await askText({ title: "プロジェクトを付け替え", label: `${t.id} のプロジェクト名(空欄で未分類)`, value: t.project || "" });
          if (p === null) return;
          await taskAction({ action: "reproject", path: t.path, project: p });
        };
        const b = document.createElement("button");
        b.className = "btn";
        const spec = btn(t);
        b.textContent = spec.label;
        b.onclick = (e) => { e.stopPropagation(); taskAction({ action: spec.action, id: t.id, agent: t.agent }); };
        row.append(id, sum, mv, b);
        body.appendChild(row);
      }
    }
  }

  const form = document.createElement("div");
  form.id = "newtask";
  form.innerHTML = `
    <div class="sec">新しいタスク${inThread ? ` · ${escapeHtml(selectedThread)}` : ""}</div>
    <input id="nt-id" placeholder="task_id(空欄で自動採番)">
    ${inThread ? "" : '<input id="nt-project" placeholder="project(任意、例: cuda-compress)">'}
    <input id="nt-role" placeholder="role(impl/review等、空欄で誰でも)">
    <textarea id="nt-body" placeholder="何を / どう確認するか / 完了条件"></textarea>
    <button id="nt-add" class="btn">投入(トークン消費なし)</button>`;
  body.appendChild(form);
  form.querySelector("#nt-add").onclick = createTask;
}

}

async function sendSay() {
  const el = $("saytext");
  const text = el.value.trim();
  if (!text && !pendingImage) return;
  el.value = "";
  if (text.startsWith("/")) { handleCommand(text); return; }
  const img = pendingImage;
  pendingImage = null;
  if (img) {
    // 画像添付: 保存→メンバーへマルチモーダルで届く。テキストがあれば本文としても送る
    await fetch("/api/attach", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ thread: selectedThread === "__main__" ? null : selectedThread, dataUrl: img.dataUrl, note: text }) });
    if (text) await fetch("/api/say", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ text, thread: selectedThread === "__main__" ? null : selectedThread }) });
    refresh();
    return;
  }
  await sendSayText(text);
}

// スラッシュコマンド: 入力欄からローカル操作(エージェントを起こさない)
// スラッシュコマンドの応答(ローカル表示)。5秒ごとの再描画で消えないよう保持する
const ephemeral = [];
function pushEphemeral(text) {
  ephemeral.push({ at: Date.now(), text });
  if (ephemeral.length > 30) ephemeral.shift();
}

async function handleCommand(text) {
  const [cmd, ...args] = text.slice(1).split(/\s+/);
  const post = (t) => {
    pushEphemeral(t);
    renderStream(lastState ?? { live: { board: [] } });
  };
  if (cmd === "help") {
    const rows = Object.entries(COMMANDS).map(([c, d]) => `/${c} — ${d}`);
    const custom = Object.entries(lastState?.commands ?? {});
    if (custom.length) rows.push(...custom.map(([c, d]) => `/${c} — ${d}(カスタム)`));
    post("コマンド一覧:\n" + rows.join("\n"));
  } else if (cmd === "session" || cmd === "sessions") {
    const arg = text.slice(("/" + cmd).length).trim();
    const [op, ...rest] = arg.split(/\s+/);
    const name = rest.join("-");
    if (!op || op === "list") {
      const r = await (await fetch("/api/session", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ action: "list" }) })).json();
      post(r.list?.length ? "保存済みセッション:\n" + r.list.join("\n") : "保存済みセッションはありません(/session save <名前> で保存)");
    } else if (op === "save" || op === "load") {
      if (!name) { post("セッション名を指定してください"); return; }
      const r = await (await fetch("/api/session", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ action: op, name }) })).json();
      post(r.error ? `エラー: ${r.error}` : `セッション ${name} を${op === "save" ? "保存" : "復元"}しました${op === "load" ? "(反映には再起動が必要です)" : ""}`);
    }
  } else if (cmd === "tasks") {
    if (!lastState) return post("まだ状態を取得していません");
    const l = lastState.taskList;
    const rows = [...l.open, ...l.claimed, ...l.done]
      .filter((t) => selectedThread === "__main__" || (t.project || "") === selectedThread)
      .map((t) => `${t.state}: ${t.id}${t.project ? ` (${t.project})` : ""}`);
    post(rows.length ? rows.join("\n") : "タスクはありません");
  } else if (cmd === "usage") {
    if (!lastState) return post("まだ状態を取得していません");
    const rows = Object.entries(lastState.live.agents).map(([id, a]) =>
      `${a.displayName ?? id}: ${statusJa(a.status)} / ${a.tokens?.toLocaleString() ?? 0}tok / $${(a.costUsd ?? 0).toFixed(4)}`);
    post(rows.length ? rows.join("\n") : "usageはまだありません");
  } else if (cmd === "threads") {
    const ts = lastState?.live.threads ?? [];
    post(ts.map((t) => `${t.name} — ${t.goal}`).join("\n") || "開いているスレッドはありません");
  } else if (cmd === "thread") {
    const rest = text.slice(("/" + cmd).length).trim();
    const sp = rest.search(/\s/);
    const name = sp === -1 ? rest : rest.slice(0, sp);
    const goal = sp === -1 ? "" : rest.slice(sp + 1).trim();
    if (!name) { post("スレッド名を指定してください(/thread <名前> <目標>)"); return; }
    const r = await (await fetch("/api/thread", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ project: name, goal }) })).json();
    post(r.error ? `エラー: ${r.error}` : `スレッド ${name} を開きました(3ワーカー並行開始)`);
  } else if (cmd === "close") {
    const name = text.slice(("/" + cmd).length).trim();
    if (!name) { post("スレッド名を指定してください"); return; }
    const r = await (await fetch("/api/close", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ project: name }) })).json();
    post(r.error ? `エラー: ${r.error}` : `スレッド ${name} を閉じました`);
  } else if (cmd === "workflow") {
    const name = args[0];
    if (!name) {
      const list = lastState?.workflows ?? [];
      post(list.length ? "実行可能なワークフロー:\n" + list.join("\n") : "ワークフローがありません(workspace/workflows/ に <名前>.mjs を置いてください)");
      return;
    }
    const r = await (await fetch("/api/workflow", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ name }) })).json();
    post(r.error ? `エラー: ${r.error}` : `ワークフロー ${name} を実行開始しました`);
  } else if (cmd === "model") {
    const m = lastState?.model;
    if (!args[0]) {
      const e = lastState?.live.modelEffort;
      post(`モデル: ${m?.name ?? "(不明)"}\n思考レベル: ${e ?? lastState?.live.modelEffort ?? "config値"}\nフォールバック: ${m?.fallbacks?.join(" → ") || "なし"}\n\n変更: /model <名前> / /effort <low|medium|high>`);
    } else {
      const r = await (await fetch("/api/model", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ model: args[0] }) })).json();
      if (!r.error) { uiEffort = null; uiModelName = r.model; }
      post(r.error ? `エラー: ${r.error}` : `モデルを ${r.model} に変更しました(次のラウンドから)`);
    }
  } else if (cmd === "effort") {
    const lv = (args[0] ?? "").toLowerCase();
    if (!["low", "medium", "high"].includes(lv)) { post("low / medium / high のいずれかを指定してください"); return; }
    const r = await (await fetch("/api/model", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ effort: lv }) })).json();
    if (!r.error) uiEffort = r.effort;
    post(r.error ? `エラー: ${r.error}` : `思考レベルを ${r.effort} に変更しました(次のラウンドから)`);
  } else if (cmd === "perm") {
    const mode = (args[0] ?? "").toLowerCase();
    if (!["normal", "auto"].includes(mode)) { post("normal または auto を指定してください"); return; }
    const r = await (await fetch("/api/perm", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ mode }) })).json();
    post(r.error ? `エラー: ${r.error}` : `権限モードを ${r.mode} に変更しました(${mode === "auto" ? "承認要求を自動許可" : "承認要求は都度確認"})`);
  } else if (cmd === "git") {
    const r = await (await fetch("/api/git")).json();
    post(`[GIT状況]\n${r.text ?? r.error}`);
  } else if (customCommands[cmd]) {
    // configで定義したカスタムプロンプトコマンド → リーダーへ送信
    sendSayText(customCommands[cmd].replace(/\$ARGS/g, text.slice(cmd.length + 2).trim()));
  } else {
    post(`不明なコマンド: ${cmd}(/help で一覧)`);
  }
}

/* ================= ダイアログとトースト ================= */
function toast(msg, kind = "err") {
  const t = document.createElement("div");
  t.className = "toast " + kind;
  t.textContent = msg;
  $("toasts").appendChild(t);
  setTimeout(() => t.remove(), 4200);
}

// ブラウザ標準のpromptの代替。テキスト入力つきダイアログ。キャンセル/Escはnull
function askText({ title, label, value = "", ok = "決定" }) {
  return new Promise((resolve) => {
    const dlg = $("dlg");
    $("dlg-title").textContent = title;
    $("dlg-body").textContent = label;
    const inp = $("dlg-input");
    inp.value = value;
    $("dlg-ok").textContent = ok;
    dlg.showModal();
    inp.focus();
    inp.select();
    const done = (v) => { dlg.close(); resolve(v); };
    $("dlg-ok").onclick = () => done(inp.value.trim());
    $("dlg-cancel").onclick = () => done(null);
    dlg.oncancel = () => resolve(null);
    inp.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); $("dlg-ok").click(); } };
  });
}

/* ================= 全体描画 ================= */
function renderAll() {
  if (!lastState) return;
  renderNav(lastState.live.threads);
  renderRoomHead(lastState);
  renderStream(lastState);
  renderPerms(lastState.live.requests);
  renderCtx(lastState);
  const permTxt = lastState.live.permMode === "auto" ? "perm:auto" : "perm:normal";
  const effTxt = uiEffort ?? lastState?.live?.modelEffort ? `effort:${uiEffort ?? lastState.live.modelEffort}` : null;
  const mdl = uiModelName ?? lastState.live.modelName ?? lastState.model?.name ?? "";
  const bits = [mdl, effTxt, permTxt, lastState.live.scenario ? `[${lastState.live.scenario.phase}]` : null].filter(Boolean);
  $("nav-foot").textContent = bits.join(" · ");
}


// 頁送りAPIで以前の投稿を取得し、表示に前置きする(アンカーへスクロール復帰)
async function loadOlderPosts(beforeId) {
  if (beforeId == null) return;
  const r = await fetch(`/api/board?before=${beforeId}`);
  if (!r.ok) return;
  const data = await r.json();
  const older = (data.posts ?? []).filter((p) => (p.thread ?? "__main__") === selectedThread);
  if (!older.length) return;
  // 取得した古い投稿をlastStateの先頭側へ統合し、窓を広げて再描画
  const known = new Set(lastState.live.board.map((p) => p.id));
  const fresh = older.filter((p) => !known.has(p.id));
  if (fresh.length) lastState.live.board = [...fresh, ...lastState.live.board].sort((a, b) => a.id - b.id);
  anchorPid = beforeId;
  boardWindow += fresh.length || BOARD_WINDOW;
  renderStream(lastState);
}

async function refresh() {
  lastState = await (await fetch("/api/state")).json();
  customCommands = lastState.commands ?? {};
  $("monitor-btn").style.display = lastState.monitorPort ? "" : "none";
  renderAll();
}

let refreshQueued = false;
function refreshSoon() {
  if (refreshQueued) return;
  refreshQueued = true;
  setTimeout(() => { refreshQueued = false; refresh(); }, 600);
}

/* ================= イベント配線 ================= */
$("nav-search").addEventListener("input", (e) => { navQuery = e.target.value; renderAll(); });
$("nav-search").addEventListener("keydown", (e) => {
  if (e.key === "Escape") { e.target.value = ""; navQuery = ""; renderAll(); }
});

/* ================= 設定ウィンドウ(エージェントを起こさない操作) ================= */
function openSettings() {
  // 現在値: UIから変更済みならその値、未変更ならサーバーが配る実値(live)/config値
  const liveModel = lastState?.live?.modelName ?? null;
  const liveEffort = lastState?.live?.modelEffort ?? null;
  $("set-effort").value = uiEffort ?? liveEffort ?? "low";
  $("set-model").value = uiModelName ?? "";
  $("set-model").placeholder = liveModel ?? lastState?.model?.name ?? "";
  $("set-fallback").value = (lastState?.model?.fallbacks ?? []).join(",");
  $("set-perm").value = lastState?.live?.permMode ?? "normal";
  const servers = Object.entries(lastState?.mcp ?? {});
  $("set-mcp").textContent = servers.length
    ? servers.map(([name, c]) => `${name}(${c.command}${(c.args ?? []).length ? " " + (c.args ?? []).join(" ") : ""})`).join(", ")
    : "なし(hive.config.json の mcp.servers で追加)";
  const memFiles = (lastState?.files ?? []).filter((f) => f.startsWith("memory/") && f.endsWith(".md"));
  $("set-mem").textContent = memFiles.length ? `${memFiles.length}件(メモリタブで閲覧可)` : "なし";
  $("settings-dlg").showModal();
}
$("settings-btn").onclick = openSettings;
$("monitor-btn").onclick = () => {
  const v = $("monview");
  const f = $("monframe");
  if (!v.style.display || v.style.display === "none") {
    if (!f.src) f.src = "http://127.0.0.1:" + (lastState?.monitorPort ?? 7791) + "/";
    v.style.display = "flex";
  } else {
    v.style.display = "none";
  }
};
$("monclose").onclick = () => { $("monview").style.display = "none"; };
function applyPanel() {
  const hidden = localStorage.getItem("hive.panel") === "hidden";
  document.body.classList.toggle("nopanel", hidden);
}
$("panel-btn").onclick = () => {
  const hidden = localStorage.getItem("hive.panel") === "hidden";
  localStorage.setItem("hive.panel", hidden ? "shown" : "hidden");
  applyPanel();
  renderCtx(lastState);
};
applyPanel();
let browserWired = false;
function initBrowserPane() {
  if (browserWired) return;
  browserWired = true;
  const v = $("bview");
  const norm = (u) => {
    u = u.trim();
    if (!u) return u;
    if (!/^https?:\/\//i.test(u)) u = "https://" + u;
    return u;
  };
  // iframeはcross-originの履歴操作ができないため、URL履歴を自前で持つ
  const history = [];
  let pointer = -1;
  let internal = false;
  const show = (u, push = true) => {
    if (push) { history.splice(pointer + 1); history.push(u); pointer = history.length - 1; }
    $("burl").value = u;
    internal = true;
    v.src = u;
  };
  const go = () => { const u = norm($("burl").value); if (u) show(u); };
  $("bgo").onclick = go;
  $("burl").addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
  $("bback").onclick = () => { if (pointer > 0) { pointer -= 1; show(history[pointer], false); } };
  $("bfwd").onclick = () => { if (pointer < history.length - 1) { pointer += 1; show(history[pointer], false); } };
  $("breload").onclick = () => { if (history[pointer]) show(history[pointer], false); };
  $("bwindow").onclick = () => { if (history[pointer]) window.open(history[pointer], "_blank", "width=1100,height=800"); };
}
$("settings-cancel").onclick = () => $("settings-dlg").close();
$("settings-dlg").addEventListener("click", (e) => { if (e.target === $("settings-dlg")) $("settings-dlg").close(); });
$("settings-save").onclick = async () => {
  const effort = $("set-effort").value;
  const model = $("set-model").value.trim();
  const perm = $("set-perm").value;
  const re = await (await fetch("/api/model", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ effort }) })).json();
  if (re.error) { toast(re.error); return; }
  uiEffort = re.effort;
  const cur = uiModelName ?? lastState?.live?.modelName ?? "";
  if (model && model !== cur) {
    const rm = await (await fetch("/api/model", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ model }) })).json();
    if (rm.error) { toast(rm.error); return; }
    uiModelName = rm.model;
  }
  const rp = await (await fetch("/api/perm", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ mode: perm }) })).json();
  if (rp.error) { toast(rp.error); return; }
  $("settings-dlg").close();
  toast("設定を保存しました", "ok");
  await refresh();
};

const es = new EventSource("/events");
es.onmessage = (e) => {
  const { type, payload } = JSON.parse(e.data);
  if (type === "board") {
    const th = payload.thread ?? "__main__";
    if (th === selectedThread) {
      refreshSoon(); // デバウンス付きで全再描画(ストリームは毎回全件から組み直す)
    } else {
      unread[th] = (unread[th] ?? 0) + 1;
      if (lastState) renderNav(lastState.live.threads);
    }
    return;
  }
  if (["agent.turn", "agent.delta", "tool.call", "tool.result", "agent.status", "agent.spawned", "thread.opened", "merge.completed",
       "task.claimed", "task.finished", "task.created", "task.released", "task.cancelled", "task.autoResolved",
       "scenario.started", "scenario.finished"].includes(type)) {
    refreshSoon();
  }
};
const ALL_COMMANDS = () => ({
    ...COMMANDS,
    ...Object.fromEntries(Object.entries(customCommands ?? {}).map(([c, d]) => [c, d + "(カスタム)"])),
  });
  function renderSuggestions(input) {
    const box = document.getElementById("suggest");
    if (!input.startsWith("/")) { box.style.display = "none"; return; }
    const word = input.slice(1).split(/\s/)[0].toLowerCase();
    const matches = Object.entries(ALL_COMMANDS()).filter(([c]) => word === "" || c.toLowerCase().startsWith(word));
    if (!matches.length) { box.style.display = "none"; return; }
    box.style.display = "block";
    box.innerHTML = "";
    for (const [c, d] of matches) {
      const div = document.createElement("div");
      div.className = "sug";
      div.innerHTML = "<b>/" + c + "</b><span class='d'>" + d + "</span>";
      div.onclick = () => {
        const needsArgs = ["session", "thread", "close"].includes(c) || customCommands[c];
        document.getElementById("saytext").value = "/" + c + (needsArgs ? " " : "");
        box.style.display = "none";
        document.getElementById("saytext").focus();
      };
      box.appendChild(div);
    }
  }
  $("saytext").addEventListener("input", () => renderSuggestions($("saytext").value));
  function renderTerminalTab() {
    const body = document.getElementById("ctx-body");
    body.innerHTML = "";
    const out = document.createElement("pre");
    out.className = "fileview mono";
    out.style.minHeight = "200px";
    out.style.marginTop = "8px";
    out.textContent = window.__termOut ?? "";
    const input = document.createElement("input");
    input.className = "filter mono";
    input.placeholder = "コマンド(ワークスペース直下で実行)";
    input.addEventListener("keydown", async (e) => {
      if (e.key !== "Enter" || !input.value.trim()) return;
      const cmd = input.value.trim();
      input.value = "";
      window.__termOut = (window.__termOut ?? "") + "$ " + cmd + "\n";
      out.textContent = window.__termOut + "実行中...";
      const r = await (await fetch("/api/exec", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ command: cmd }) })).json();
      window.__termOut += (r.text ?? "") + "\n";
      out.textContent = window.__termOut;
      out.scrollTop = out.scrollHeight;
    });
    body.appendChild(input);
    body.appendChild(out);
  }
  $("saybtn").onclick = sendSay;
$("saytext").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) sendSay(); });
// 画像添付: 添付ボタン or 入力欄へのペースト。dataURL化してからサーバーへ保存させる
let pendingImage = null;
const attachFile = document.getElementById("attachfile");
$("attachbtn").onclick = () => attachFile.click();
attachFile.onchange = () => {
  const f = attachFile.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => { pendingImage = { dataUrl: reader.result, name: f.name }; $("composer-hint").textContent = `添付: ${f.name} — 送信で一緒に届きます`; };
  reader.readAsDataURL(f);
};
$("saytext").addEventListener("paste", (e) => {
  const item = [...(e.clipboardData?.items ?? [])].find((i) => i.type.startsWith("image/"));
  if (!item) return;
  const f = item.getAsFile();
  if (!f) return;
  e.preventDefault();
  const reader = new FileReader();
  reader.onload = () => { pendingImage = { dataUrl: reader.result, name: "paste.png" }; $("composer-hint").textContent = `添付: 画像(ペースト) — 送信で一緒に届きます`; };
  reader.readAsDataURL(f);
});
for (const b of document.querySelectorAll("#ctx-tabs .ct")) {
  b.onclick = () => { ctxTab = b.dataset.tab; renderCtx(lastState); };
}
refresh();
setInterval(refresh, 5000);
</script>
