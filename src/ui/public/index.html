<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>agent-hive</title>
<script src="/markdown.js"></script>
<style>
  /* apple-hig-ui トークン(light既定+dark)。コンポーネントは変数のみ参照しhexを直書きしない */
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --bg-elevated: #ffffff;
    --label: rgba(0, 0, 0, 0.85);
    --label-secondary: rgba(60, 60, 67, 0.60);
    --label-tertiary: rgba(60, 60, 67, 0.30);
    --separator: rgba(60, 60, 67, 0.18);
    --fill: rgba(120, 120, 128, 0.12);
    --fill-strong: rgba(120, 120, 128, 0.20);
    --accent: #0071e3;
    --accent-fill: rgba(0, 113, 227, 0.10);
    --ok: #34c759; --warn: #ff9f0a; --err: #ff3b30;
    --radius-control: 8px;
    --radius-container: 12px;
    --ease: cubic-bezier(0.25, 0.1, 0.25, 1);
    --duration: 200ms;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e20;
      --bg-elevated: #2a2a2d;
      --label: rgba(255, 255, 255, 0.85);
      --label-secondary: rgba(235, 235, 245, 0.60);
      --label-tertiary: rgba(235, 235, 245, 0.30);
      --separator: rgba(255, 255, 255, 0.12);
      --fill: rgba(120, 120, 128, 0.24);
      --fill-strong: rgba(120, 120, 128, 0.32);
      --accent: #0a84ff;
      --accent-fill: rgba(10, 132, 255, 0.16);
      --ok: #30d158; --warn: #ffd60a; --err: #ff453a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: var(--bg); color: var(--label);
    display: grid; grid-template-columns: 230px 1fr 360px;
    grid-template-rows: minmax(0, 1fr); /* 行をコンテンツサイズに任せると縦が無限に伸びてスクロール不能になる */
    font-size: 15px;
  }

  /* ============ 左: ナビ ============ */
  #nav { background: var(--bg-elevated); border-right: 1px solid var(--separator); display: flex; flex-direction: column; padding: 14px 10px; gap: 2px; min-height: 0; overflow-y: auto; }
  #nav .logo { padding: 2px 8px 14px; color: var(--label); font-weight: 700; font-size: 16px; letter-spacing: -0.01em; }
  .navlabel { font-size: 12px; color: var(--label-secondary); padding: 12px 8px 4px; }
  .room { padding: 8px 10px; border-radius: var(--radius-control); cursor: pointer; font-size: 13px; position: relative; transition: background var(--duration) var(--ease); }
  .room:hover { background: var(--fill); }
  .room.active { background: var(--accent); color: #fff; }
  .room .sub { display: block; font-size: 12px; color: var(--label-secondary); margin-top: 2px; }
  .room.active .sub { color: rgba(255, 255, 255, 0.75); }
  .badge { position: absolute; right: 8px; top: 8px; background: var(--err); color: #fff; border-radius: 9px; font-size: 10px; padding: 1px 6px; }
  #nav .foot { margin-top: auto; font-size: 12px; color: var(--label-tertiary); padding: 8px; }

  /* ============ 中央: 会話 ============ */
  #chat { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #roomhead { border-bottom: 1px solid var(--separator); padding: 12px 18px; background: var(--bg-elevated); }
  #room-title { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
  #room-goal { font-size: 12px; color: var(--label-secondary); margin-top: 2px; }
  #room-members { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .member { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; background: var(--fill); border: none; border-radius: 14px; padding: 3px 10px; cursor: pointer; color: var(--label); transition: background var(--duration) var(--ease), box-shadow var(--duration) var(--ease); }
  .member:hover { background: var(--fill-strong); }
  .member.sel { background: var(--accent-fill); box-shadow: 0 0 0 1px var(--accent); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--label-tertiary); }
  .dot.working { background: var(--warn); }
  .dot.done { background: var(--ok); }
  .dot.error, .dot.budget-stop { background: var(--err); }
  #permzone { padding: 0 18px; }
  .permcard { background: var(--bg-elevated); border: 1px solid var(--separator); border-radius: var(--radius-container); padding: 10px 12px; margin-top: 10px; font-size: 13px; }
  .permcard b { color: var(--err); }
  .permcard .cmd { font-family: ui-monospace, Consolas, monospace; color: var(--label); margin: 4px 0 8px; word-break: break-all; }
  .permcard button { background: var(--fill); border: none; color: var(--label); border-radius: var(--radius-control); padding: 4px 14px; margin-right: 6px; cursor: pointer; font-size: 13px; transition: filter var(--duration) var(--ease); }
  .permcard button:hover { filter: brightness(0.95); }
  .permcard button.ok { background: var(--accent); color: #fff; }

  #stream { flex: 1; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 82%; border-radius: var(--radius-container); padding: 9px 13px; font-size: 13px; background: var(--bg-elevated); }
  .msg .who { font-size: 12px; color: var(--label-secondary); margin-bottom: 3px; font-weight: 600; }
  .msg p { margin: 4px 0; }
  .msg h1, .msg h2, .msg h3, .msg h4 { margin: 8px 0 4px; font-size: 13px; color: var(--label); }
  .msg ul, .msg ol { margin: 4px 0; padding-left: 20px; }
  .msg blockquote { border-left: 2px solid var(--separator); margin: 4px 0; padding: 2px 10px; color: var(--label-secondary); }
  .msg code { background: var(--fill); border-radius: 4px; padding: 0 4px; font-size: 12px; }
  .msg img.md-img { min-height: 48px; object-fit: contain; background: var(--bg); border-radius: 6px; display: block; margin: 4px 0; }
  .msg pre { background: var(--bg); border-radius: var(--radius-control); padding: 8px; overflow-x: auto; font-size: 12px; }
  .msg pre code { padding: 0; background: none; }
  .msg table { border-collapse: collapse; margin: 6px 0; font-size: 12px; }
  .msg th, .msg td { border: 1px solid var(--separator); padding: 3px 8px; text-align: left; }
  .msg a { color: var(--accent); }
  .msg hr { border: none; border-top: 1px solid var(--separator); margin: 8px 0; }
  .msg.mine { align-self: flex-end; background: var(--accent-fill); }
  .msg.mine .who { color: var(--accent); text-align: right; }
  .sysline { align-self: center; font-size: 12px; color: var(--label-tertiary); padding: 2px 10px; max-width: 90%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #composer { border-top: 1px solid var(--separator); padding: 10px 18px 14px; background: var(--bg-elevated); position: relative; }
  #suggest { position: absolute; bottom: 100%; left: 18px; right: 18px; background: var(--bg-elevated); border: 1px solid var(--separator); border-radius: 8px; box-shadow: var(--shadow-overlay); max-height: 240px; overflow-y: auto; z-index: 5; }
  #suggest .sug { padding: 5px 12px; cursor: pointer; font-size: 12px; color: var(--label); }
  #suggest .sug .d { color: var(--sub); margin-left: 8px; font-size: 11px; }
  #suggest .sug:hover { background: var(--accent-fill); }
  .msg img.md-img { min-height: 48px; max-width: 100%; border-radius: 6px; display: block; margin: 4px 0; background: var(--bg); }
  .room .prog { display: block; font-size: 11px; color: var(--ok); margin-top: 1px; }
  #composer .row { display: flex; gap: 8px; }
  #saytext { flex: 1; background: var(--bg); border: 1px solid var(--separator); color: var(--label); border-radius: var(--radius-control); padding: 8px 12px; font-size: 13px; }
  #saytext:focus { outline: none; border-color: var(--accent); }
  #saybtn { background: var(--accent); border: none; color: #fff; border-radius: var(--radius-control); padding: 8px 18px; cursor: pointer; font-size: 13px; transition: filter var(--duration) var(--ease); }
  #saybtn:hover { filter: brightness(1.08); }
  #composer .hint { font-size: 12px; color: var(--label-tertiary); margin-top: 5px; }

  /* ============ 右: 状況パネル ============ */
  #ctx { background: var(--bg-elevated); border-left: 1px solid var(--separator); display: flex; flex-direction: column; min-height: 0; }
  #ctx-tabs { display: flex; border-bottom: 1px solid var(--separator); }
  #ctx-tabs .ct { flex: 1; text-align: center; padding: 10px 0; font-size: 13px; color: var(--label-secondary); cursor: pointer; border-bottom: 2px solid transparent; transition: color var(--duration) var(--ease); }
  #ctx-tabs .ct.active { color: var(--accent); border-bottom-color: var(--accent); }
  #ctx-body { flex: 1; overflow-y: auto; padding: 12px; }
  .sec { font-size: 12px; color: var(--label-secondary); margin: 12px 0 4px; }
  .sec:first-child { margin-top: 0; }
  .proj { font-size: 13px; color: var(--label); font-weight: 600; margin: 10px 0 2px; }
  .taskrow { display: flex; align-items: baseline; gap: 6px; padding: 3px 4px; border-radius: 6px; font-size: 13px; }
  .taskrow:hover { background: var(--fill); }
  .taskrow .tid { color: var(--accent); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 52%; flex-shrink: 0; }
  .taskrow .tsum { flex: 1; color: var(--label-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .taskrow button { background: var(--fill); border: none; color: var(--label); border-radius: 6px; font-size: 11px; padding: 2px 8px; cursor: pointer; white-space: nowrap; flex-shrink: 0; transition: filter var(--duration) var(--ease); }
  .taskrow button:hover { filter: brightness(0.95); }
  select.filter { width: 100%; background: var(--bg); border: 1px solid var(--separator); color: var(--label); border-radius: var(--radius-control); padding: 4px 6px; font-size: 12px; }
  #newtask { display: flex; flex-direction: column; gap: 4px; margin-top: 12px; border-top: 1px solid var(--separator); padding-top: 12px; }
  #newtask input, #newtask textarea { background: var(--bg); border: 1px solid var(--separator); color: var(--label); border-radius: var(--radius-control); padding: 5px 7px; font-size: 12px; }
  #newtask input:focus, #newtask textarea:focus { outline: none; border-color: var(--accent); }
  #newtask textarea { min-height: 44px; resize: vertical; }
  #newtask button { align-self: flex-end; background: var(--accent); border: none; color: #fff; border-radius: var(--radius-control); padding: 5px 12px; cursor: pointer; font-size: 12px; transition: filter var(--duration) var(--ease); }
  #newtask button:hover { filter: brightness(1.08); }

  .agentcard { background: var(--bg); border-radius: var(--radius-control); padding: 8px 10px; margin-bottom: 8px; cursor: pointer; font-size: 12px; transition: background var(--duration) var(--ease), box-shadow var(--duration) var(--ease); }
  .agentcard:hover { background: var(--fill); }
  .agentcard.sel { background: var(--accent-fill); box-shadow: 0 0 0 1px var(--accent); }
  .agentcard .nm { font-weight: 600; }
  .agentcard .st { float: right; color: var(--label-secondary); font-size: 11px; }
  .agentcard .st.working { color: var(--warn); }
  .agentcard .st.done { color: var(--ok); }
  .agentcard .st.error, .agentcard .st.budget-stop { color: var(--err); }
  .agentcard .meta { color: var(--label-secondary); font-size: 11px; margin-top: 3px; }

  .alog { max-height: 46vh; overflow-y: auto; background: var(--bg); border-radius: var(--radius-control); padding: 6px 8px; font-size: 12px; }
  .alog .entry { padding: 3px 0; border-bottom: 1px solid var(--separator); white-space: pre-wrap; word-break: break-word; }
  .alog .entry:last-child { border-bottom: none; }
  .alog .entry .k { color: var(--label-tertiary); margin-right: 4px; }
  .alog .entry.think .txt { color: var(--label-secondary); }
  .alog .entry.say .txt { color: var(--label); }
  .alog .entry.tool .txt, .alog .entry.result .txt { font-family: ui-monospace, Consolas, monospace; font-size: 11px; color: var(--label-secondary); }
  .alog .entry.compact .txt { color: var(--label-secondary); font-size: 11px; }
  .hint { color: var(--label-tertiary); font-size: 12px; padding: 6px 2px; }
  ul.files { list-style: none; padding: 0; margin: 4px 0; font-size: 12px; }
  ul.files li { cursor: pointer; padding: 3px 6px; border-radius: 6px; }
  ul.files li:hover { background: var(--fill); }
  pre.fileview { background: var(--bg); border-radius: var(--radius-control); padding: 8px; font-size: 12px; overflow-x: auto; white-space: pre-wrap; }
</style>
</head>
<body>
  <aside id="nav">
    <div class="logo">agent-hive</div>
    <div class="navlabel">スレッド</div>
    <div id="nav-rooms"></div>
    <div class="foot" id="nav-foot"></div>
  </aside>

  <main id="chat">
    <header id="roomhead">
      <div id="room-title"></div>
      <div id="room-goal"></div>
      <div id="room-members"></div>
    </header>
    <div id="permzone"></div>
    <div id="stream"></div>
    <div id="composer">
      <div id="suggest" style="display:none"></div>
      <div class="row">
        <input id="saytext" placeholder="メッセージ">
        <button id="attachbtn" title="画像を添付">📎</button>
        <button id="saybtn">送信</button>
        <input type="file" id="attachfile" accept="image/png,image/jpeg,image/gif,image/webp" style="display:none">
      </div>
      <div class="hint" id="composer-hint"></div>
    </div>
  </main>

  <aside id="ctx">
    <div id="ctx-tabs">
      <div class="ct active" data-tab="tasks">タスク</div>
      <div class="ct" data-tab="agents">エージェント</div>
      <div class="ct" data-tab="files">ファイル</div>
      <div class="ct" data-tab="term">ターミナル</div>
    </div>
    <div id="ctx-body"></div>
  </aside>

<script>
/* ================= 状態 ================= */
let selectedThread = "__main__";
// スラッシュコマンドの定義(/helpはこの一覧から自動生成)
const COMMANDS = {
  help: "コマンド一覧",
  tasks: "現在のタスク一覧",
  usage: "エージェント別の消費",
  threads: "スレッド一覧",
  session: "セッションの保存/復元(/session save <名前>)",
  model: "現在のモデル表示",
  thread: "スレッドを直接開く(/thread <名前> <目標>)",
  close: "スレッドを閉じる(/close <名前>)",
};
let customCommands = {};
let uiEffort = null;
let selectedAgent = null;
let ctxTab = "tasks";
let projectFilter = "";
const unread = {}; // thread => 件数
let lastState = null;
const NAMES = { alpha: "アルファ", beta: "ベータ", gamma: "ガンマ", delta: "デルタ", system: "システム", you: "あなた", lead: "リーダー" };
const threadOf = (a) => a?.thread ?? "__main__";
const $ = (id) => document.getElementById(id);

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

/* ================= 左ナビ ================= */
function renderNav(threads) {
  const el = $("nav-rooms");
  el.innerHTML = "";
  const rooms = [
    { id: "__main__", label: "🤝 メイン", sub: "リーダーと壁打ち・計画" },
    ...(threads ?? []).filter((t) => t.name !== "__main__").map((t) => ({ id: t.name, label: "🧵 " + t.name, sub: t.goal })),
  ];
  for (const t of rooms) {
    const d = document.createElement("div");
    d.className = "room" + (selectedThread === t.id ? " active" : "");
    // 進捗(タスクの完了率)をサブに足す
    let prog = "";
    if (t.id !== "__main__") {
      const all = (lastState?.taskList ?? { open: [], claimed: [], done: [] });
      const inP = [...all.open, ...all.claimed, ...all.done].filter((x) => (x.project || "") === t.id);
      if (inP.length) {
        const doneN = inP.filter((x) => x.state === "done").length;
        prog = `${doneN}/${inP.length} 完了`;
      }
    }
    d.innerHTML = `${escapeHtml(t.label)}<span class="sub">${escapeHtml((t.sub ?? "") + (prog ? ` (${prog})` : ""))}</span>`;
    if (unread[t.id]) {
      const b = document.createElement("span");
      b.className = "badge";
      b.textContent = unread[t.id];
      d.appendChild(b);
    }
    d.onclick = () => {
      selectedThread = t.id;
      unread[t.id] = 0;
      selectedAgent = null;
      projectFilter = t.id === "__main__" ? "" : t.id;
      renderAll();
    };
    el.appendChild(d);
  }
}

/* ================= 中央: 会話 ================= */
function currentMembers(state) {
  return Object.entries(state.live.agents).filter(([id, a]) => threadOf(a) === selectedThread);
}

function renderRoomHead(state) {
  const th = (state.live.threads ?? []).find((t) => t.name === selectedThread);
  if (selectedThread === "__main__") {
    $("room-title").textContent = "🤝 メイン(壁打ち)";
    $("room-goal").textContent = "リーダーと計画を固める。実行はサブスレッドへ";
  } else {
    $("room-title").textContent = "🧵 " + selectedThread;
    $("room-goal").textContent = th?.goal ?? "";
  }
  const mem = $("room-members");
  mem.innerHTML = "";
  let sumTokens = 0;
  let sumCost = 0;
  for (const [id, a] of currentMembers(state)) {
    sumTokens += a.tokens ?? 0;
    sumCost += a.costUsd ?? 0;
    const chip = document.createElement("span");
    chip.className = "member" + (selectedAgent === id ? " sel" : "");
    chip.innerHTML = `<span class="dot ${(a.status ?? "idle").replace(/\s/g, "")}"></span>${escapeHtml(a.displayName ?? NAMES[id] ?? id)}`;
    chip.title = `${a.status ?? "idle"} / turn ${a.turn ?? 0} — クリックで思考と活動`;
    chip.onclick = () => { selectedAgent = selectedAgent === id ? null : id; ctxTab = "agents"; renderAll(); };
    mem.appendChild(chip);
  }
  if (sumTokens > 0) {
    const s = document.createElement("span");
    s.className = "member";
    s.style.cursor = "default";
    s.innerHTML = `Σ ${sumTokens.toLocaleString()}tok / $${sumCost.toFixed(4)}`;
    s.title = "このスレッドのメンバーの合計消費";
    mem.appendChild(s);
  }
  const hint = $("composer-hint");
  hint.textContent = selectedThread === "__main__"
    ? "このメッセージは リーダー に届きます"
    : `このメッセージは ${selectedThread} のメンバー全員に届きます`;
  $("saytext").placeholder = selectedThread === "__main__" ? "リーダーへメッセージ" : `${selectedThread} のメンバーへメッセージ`;
}

function renderStream(state) {
  const stream = $("stream");
  const nearBottom = stream.scrollHeight - stream.scrollTop - stream.clientHeight < 120;
  stream.innerHTML = "";
  for (const p of state.live.board) {
    if ((p.thread ?? "__main__") !== selectedThread) continue;
    if (p.from === "system") {
      const d = document.createElement("div");
      d.className = "sysline";
      d.textContent = "⚙ " + p.text.replace(/^\[[^\]]+\]\s*/, "");
      d.title = p.text;
      stream.appendChild(d);
      continue;
    }
    const mine = p.from === "you";
    const d = document.createElement("div");
    d.className = "msg" + (mine ? " mine" : "");
    const who = document.createElement("div");
    who.className = "who " + p.from;
    who.textContent = (mine ? "あなた" : (NAMES[p.from] ?? p.from)) + (mine ? "" : ` #${p.id}`);
    const body = document.createElement("div");
    body.innerHTML = renderMarkdown(p.text);
    d.append(who, body);
    stream.appendChild(d);
  }
  // スラッシュコマンドの応答(ローカル)。board再描画の最後に足す
  for (const e of ephemeral) {
    const d = document.createElement("div");
    d.className = "msg mine";
    const who = document.createElement("div");
    who.className = "who";
    who.textContent = "⌘";
    const body = document.createElement("div");
    body.textContent = e.text;
    d.append(who, body);
    stream.appendChild(d);
  }
  if (nearBottom) stream.scrollTop = stream.scrollHeight;
}

function renderPerms(requests) {
  const el = $("permzone");
  el.innerHTML = "";
  for (const r of (requests ?? []).filter((x) => x.state === "pending")) {
    const d = document.createElement("div");
    d.className = "permcard";
    d.innerHTML = `<b>🔐 コマンドの承認要求 #${r.id}</b><div class="cmd">${escapeHtml(r.command)}</div>`;
    const ok = document.createElement("button");
    ok.className = "ok";
    ok.textContent = "承認";
    ok.onclick = () => decide(r.id, true);
    const no = document.createElement("button");
    no.textContent = "拒否";
    no.onclick = () => decide(r.id, false);
    d.append(ok, no);
    el.appendChild(d);
  }
}

/* ================= 右: 状況パネル ================= */
function renderCtx(state) {
  for (const b of document.querySelectorAll("#ctx-tabs .ct")) {
    b.classList.toggle("active", b.dataset.tab === ctxTab);
  }
  const body = $("ctx-body");
  body.innerHTML = "";
  if (ctxTab === "tasks") renderTasksTab(body, state);
  if (ctxTab === "agents") renderAgentsTab(body, state);
  if (ctxTab === "files") renderFilesTab(body);
  if (ctxTab === "term") renderTerminalTab();
}

function renderTasksTab(body, state) {
  const list = state.taskList ?? { open: [], claimed: [], done: [] };
  const inThread = selectedThread !== "__main__";
  const all = [...list.open, ...list.claimed, ...list.done].filter((t) => !inThread || (t.project || "") === selectedThread);
  const projects = [...new Set(all.map((t) => t.project || ""))].sort();

  if (inThread) {
    const s = document.createElement("div");
    s.className = "sec";
    s.textContent = `このスレッド(${selectedThread})のタスク`;
    body.appendChild(s);
  } else {
    const sel = document.createElement("select");
    sel.className = "filter";
    const opts = ["", ...projects, "__none__"];
    const cur = projectFilter;
    for (const p of opts) {
      const o = document.createElement("option");
      o.value = p;
      o.textContent = p === "" ? "すべてのプロジェクト" : p === "__none__" ? "(未分類)" : p;
      sel.appendChild(o);
    }
    sel.value = cur;
    if (!opts.includes(cur)) { projectFilter = ""; sel.value = ""; }
    sel.onchange = (e) => { projectFilter = e.target.value; renderCtx(lastState); };
    body.appendChild(sel);
  }

  const visible = all.filter((t) => inThread || projectFilter === "" || (projectFilter === "__none__" ? !t.project : (t.project || "") === projectFilter));
  const groups = inThread ? [["", ""]] : [...projects.map((p) => [p, p]), ["", "(未分類)"]];
  const secs = [
    ["open", "未着手", () => ({ label: "中止", action: "cancel" })],
    ["claimed", "作業中", () => ({ label: "解放", action: "release" })],
    ["done", "完了", () => ({ label: "再開", action: "reopen" })],
  ];
  for (const [proj, label] of groups) {
    const inProj = visible.filter((t) => (t.project || "") === proj);
    if (!inProj.length) continue;
    const ph = document.createElement("div");
    ph.className = "proj";
    ph.textContent = "◆ " + label;
    body.appendChild(ph);
    for (const [st, stLabel, btn] of secs) {
      const rows = inProj.filter((t) => t.state === st);
      if (!rows.length) continue;
      const sh = document.createElement("div");
      sh.className = "sec";
      sh.textContent = `${stLabel}(${rows.length})`;
      body.appendChild(sh);
      for (const t of rows) {
        const row = document.createElement("div");
        row.className = "taskrow";
        const id = document.createElement("span");
        id.className = "tid";
        id.textContent = t.id + (t.agent && !["auto", "you"].includes(t.agent) ? ` @${t.agent}` : "");
        id.title = t.summary;
        id.onclick = () => showTaskBody(t);
        const sum = document.createElement("span");
        sum.className = "tsum";
        sum.textContent = t.summary;
        sum.onclick = () => showTaskBody(t);
        const mv = document.createElement("button");
        mv.textContent = "移動";
        mv.title = "プロジェクトを付け替える";
        mv.onclick = async (e) => {
          e.stopPropagation();
          const p = prompt(`プロジェクト名(空欄で未分類):`, t.project || "");
          if (p === null) return;
          await taskAction({ action: "reproject", path: t.path, project: p });
        };
        const b = document.createElement("button");
        const spec = btn(t);
        b.textContent = spec.label;
        b.onclick = (e) => { e.stopPropagation(); taskAction({ action: spec.action, id: t.id, agent: t.agent }); };
        row.append(id, sum, mv, b);
        body.appendChild(row);
      }
    }
  }

  const form = document.createElement("div");
  form.id = "newtask";
  form.innerHTML = `
    <div class="sec">新しいタスクを投入${inThread ? `(project: ${escapeHtml(selectedThread)})` : ""}</div>
    <input id="nt-id" placeholder="task_id(空欄で自動採番)">
    ${inThread ? "" : '<input id="nt-project" placeholder="project(任意、例: cuda-compress)">'}
    <input id="nt-role" placeholder="role(impl/review等、空欄で誰でも)">
    <textarea id="nt-body" placeholder="何を / どう確認するか / 完了条件"></textarea>
    <button id="nt-add">投入(トークン消費なし)</button>`;
  body.appendChild(form);
  form.querySelector("#nt-add").onclick = createTask;
}

function renderAgentsTab(body, state) {
  const members = currentMembers(state);
  const sel = document.createElement("div");
  sel.className = "sec";
  sel.textContent = "このスレッドのエージェント(クリックで思考ログ)";
  body.appendChild(sel);
  for (const [id, a] of members) {
    const card = document.createElement("div");
    card.className = "agentcard" + (selectedAgent === id ? " sel" : "");
    const label = a.displayName ?? NAMES[id] ?? id;
    card.innerHTML = `<span class="nm">${escapeHtml(label)}</span><span class="st ${(a.status ?? "idle").replace(/\s/g, "")}">${escapeHtml(a.status ?? "idle")}</span>` +
      `<div class="meta">turn ${a.turn ?? 0}${a.lastTool ? ` / ${escapeHtml(a.lastTool)}` : ""}${a.tokens ? ` / ${a.tokens.toLocaleString()}tok / $${(a.costUsd ?? 0).toFixed(4)}` : ""}</div>`;
    card.onclick = () => { selectedAgent = selectedAgent === id ? null : id; renderCtx(lastState); };
    body.appendChild(card);
    if (selectedAgent === id) body.appendChild(renderAgentLog(a));
  }
  if (!members.length) {
    const h = document.createElement("div");
    h.className = "hint";
    h.textContent = "このスレッドにはまだエージェントがいません。";
    body.appendChild(h);
  }
}

function renderAgentLog(a) {
  const wrap = document.createElement("div");
  wrap.className = "alog";
  const icons = { think: "💭", say: "💬", tool: "🔧", result: "↳", status: "●", compact: "🗜" };
  if (a.live && (a.live.think || a.live.say)) {
    const d = document.createElement("div");
    d.className = "entry think";
    const k = document.createElement("span");
    k.className = "k";
    k.textContent = "⚡";
    const t = document.createElement("span");
    t.className = "txt";
    t.textContent = (a.live.think ? "思考中: " + a.live.think.slice(-400) : "") + (a.live.say ? (a.live.think ? "\n" : "") + "生成中: " + a.live.say.slice(-400) : "");
    d.append(k, t);
    wrap.appendChild(d);
  }
  if (!a.log?.length && !(a.live && (a.live.think || a.live.say))) {
    const h = document.createElement("div");
    h.className = "hint";
    h.textContent = "まだ活動がありません。稼働すると思考(💭)・発言(💬)・ツール(🔧)・結果(↳)が流れます。";
    wrap.appendChild(h);
  }
  for (const e of a.log ?? []) {
    const d = document.createElement("div");
    d.className = "entry " + e.kind;
    const k = document.createElement("span");
    k.className = "k";
    k.textContent = icons[e.kind] ?? "•";
    const t = document.createElement("span");
    t.className = "txt";
    t.textContent = e.text;
    d.append(k, t);
    wrap.appendChild(d);
  }
  requestAnimationFrame(() => { wrap.scrollTop = wrap.scrollHeight; });
  return wrap;
}

async function renderFilesTab(body) {
  const files = lastState?.files ?? [];
  const ul = document.createElement("ul");
  ul.className = "files";
  for (const f of files) {
    const li = document.createElement("li");
    li.textContent = f;
    li.onclick = async () => {
      const r = await (await fetch("/api/file?path=" + encodeURIComponent(f))).json();
      let pre = body.querySelector("pre.fileview");
      if (pre) pre.remove();
      pre = document.createElement("pre");
      pre.className = "fileview";
      pre.textContent = r.content ?? "";
      body.appendChild(pre);
    };
    ul.appendChild(li);
  }
  body.appendChild(ul);
  const h = document.createElement("div");
  h.className = "hint";
  h.textContent = "ファイル名をクリックすると内容が下に表示されます。";
  body.appendChild(h);
}

async function showTaskBody(t) {
  const r = await (await fetch("/api/file?path=" + encodeURIComponent(t.path))).json();
  ctxTab = "tasks";
  const body = $("ctx-body");
  let pre = body.querySelector("pre.fileview");
  if (pre) pre.remove();
  pre = document.createElement("pre");
  pre.className = "fileview";
  pre.textContent = `# ${t.id}\n\n` + (r.content ?? "");
  body.appendChild(pre);
}

/* ================= アクション ================= */
async function taskAction(payload) {
  const r = await (await fetch("/api/tasks", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(payload) })).json();
  if (r.error) alert(r.error);
  refresh();
}

async function createTask() {
  const id = $("nt-id")?.value.trim() ?? "";
  const projectInput = $("nt-project");
  const project = projectInput ? projectInput.value.trim() : selectedThread === "__main__" ? "" : selectedThread;
  const role = $("nt-role").value.trim();
  const body = $("nt-body").value.trim();
  if (!body) { alert("本文(何を/完了条件)を書いてください"); return; }
  const r = await (await fetch("/api/tasks", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ action: "create", id, project, role, body }) })).json();
  if (r.error) { alert(r.error); return; }
  $("nt-id").value = "";
  if (projectInput) projectInput.value = "";
  $("nt-role").value = "";
  $("nt-body").value = "";
  refresh();
}

async function decide(id, approve) {
  await fetch("/api/permission", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ id, approve }) });
  refresh();
}

function sendSayText(t) {
  return fetch("/api/say", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ text: t, thread: selectedThread === "__main__" ? null : selectedThread }) });
}

async function sendSay() {
  const el = $("saytext");
  const text = el.value.trim();
  if (!text && !pendingImage) return;
  el.value = "";
  if (text.startsWith("/")) { handleCommand(text); return; }
  const img = pendingImage;
  pendingImage = null;
  if (img) {
    // 画像添付: 保存→メンバーへマルチモーダルで届く。テキストがあれば本文としても送る
    await fetch("/api/attach", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ thread: selectedThread === "__main__" ? null : selectedThread, dataUrl: img.dataUrl, note: text }) });
    if (text) await fetch("/api/say", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ text, thread: selectedThread === "__main__" ? null : selectedThread }) });
    refresh();
    return;
  }
  await sendSayText(text);
}

// スラッシュコマンド: 入力欄からローカル操作(エージェントを起こさない)
// スラッシュコマンドの応答(ローカル表示)。5秒ごとの再描画で消えないよう保持する
const ephemeral = [];
function pushEphemeral(text) {
  ephemeral.push({ at: Date.now(), text });
  if (ephemeral.length > 30) ephemeral.shift();
}

async function handleCommand(text) {
  const [cmd] = text.slice(1).split(/\s+/);
  const post = (t) => {
    pushEphemeral(t);
    renderStream(lastState ?? { live: { board: [] } });
  };
  if (cmd === "help") {
    const rows = Object.entries(COMMANDS).map(([c, d]) => `/${c} — ${d}`);
    const custom = Object.entries(lastState?.commands ?? {});
    if (custom.length) rows.push(...custom.map(([c, d]) => `/${c} — ${d}(カスタム)`));
    post("コマンド一覧:\n" + rows.join("\n"));
  } else if (cmd === "session" || cmd === "sessions") {
    const arg = text.slice(("/" + cmd).length).trim();
    const [op, ...rest] = arg.split(/\s+/);
    const name = rest.join("-");
    if (!op || op === "list") {
      const r = await (await fetch("/api/session", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ action: "list" }) })).json();
      post(r.list?.length ? "保存済みセッション:\n" + r.list.join("\n") : "保存済みセッションはありません(/session save <名前> で保存)");
    } else if (op === "save" || op === "load") {
      if (!name) { post("セッション名を指定してください"); return; }
      const r = await (await fetch("/api/session", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ action: op, name }) })).json();
      post(r.error ? `エラー: ${r.error}` : `セッション ${name} を${op === "save" ? "保存" : "復元"}しました${op === "load" ? "(反映には再起動が必要です)" : ""}`);
    }
  } else if (cmd === "tasks") {
    if (!lastState) return post("まだ状態を取得していません");
    const l = lastState.taskList;
    const rows = [...l.open, ...l.claimed, ...l.done]
      .filter((t) => selectedThread === "__main__" || (t.project || "") === selectedThread)
      .map((t) => `${t.state}: ${t.id}${t.project ? ` (${t.project})` : ""}`);
    post(rows.length ? rows.join("\n") : "タスクはありません");
  } else if (cmd === "usage") {
    if (!lastState) return post("まだ状態を取得していません");
    const rows = Object.entries(lastState.live.agents).map(([id, a]) =>
      `${a.displayName ?? id}: ${a.status} / ${a.tokens?.toLocaleString() ?? 0}tok / $${(a.costUsd ?? 0).toFixed(4)}`);
    post(rows.length ? rows.join("\n") : "usageはまだありません");
  } else if (cmd === "threads") {
    const ts = lastState?.live.threads ?? [];
    post(ts.map((t) => `${t.name} — ${t.goal}`).join("\n") || "開いているスレッドはありません");
  } else if (cmd === "thread") {
    const rest = text.slice(("/" + cmd).length).trim();
    const sp = rest.indexOf(/\s/);
    const name = sp === -1 ? rest : rest.slice(0, sp);
    const goal = sp === -1 ? "" : rest.slice(sp + 1).trim();
    if (!name) { post("スレッド名を指定してください(/thread <名前> <目標>)"); return; }
    const r = await (await fetch("/api/thread", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ project: name, goal }) })).json();
    post(r.error ? `エラー: ${r.error}` : `スレッド ${name} を開きました(3ワーカー並行開始)`);
  } else if (cmd === "close") {
    const name = text.slice(("/" + cmd).length).trim();
    if (!name) { post("スレッド名を指定してください"); return; }
    const r = await (await fetch("/api/close", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ project: name }) })).json();
    post(r.error ? `エラー: ${r.error}` : `スレッド ${name} を閉じました`);
  } else if (cmd === "model") {
    const m = lastState?.model;
    if (!args[0]) {
      const e = lastState?.live.modelEffort;
      post(`モデル: ${m?.name ?? "(不明)"}\n思考レベル: ${e ?? lastState?.live.modelEffort ?? "config値"}\nフォールバック: ${m?.fallbacks?.join(" → ") || "なし"}\n\n変更: /model <名前> / /effort <low|medium|high>`);
    } else {
      const r = await (await fetch("/api/model", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ model: args[0] }) })).json();
      if (!r.error) uiEffort = null;
      post(r.error ? `エラー: ${r.error}` : `モデルを ${r.model} に変更しました(次のラウンドから)`);
    }
  } else if (cmd === "effort") {
    const lv = (args[0] ?? "").toLowerCase();
    if (!["low", "medium", "high"].includes(lv)) { post("low / medium / high のいずれかを指定してください"); return; }
    const r = await (await fetch("/api/model", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ effort: lv }) })).json();
    if (!r.error) uiEffort = r.effort;
    post(r.error ? `エラー: ${r.error}` : `思考レベルを ${r.effort} に変更しました(次のラウンドから)`);
  } else if (cmd === "perm") {
    const mode = (args[0] ?? "").toLowerCase();
    if (!["normal", "auto"].includes(mode)) { post("normal または auto を指定してください"); return; }
    const r = await (await fetch("/api/perm", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ mode }) })).json();
    post(r.error ? `エラー: ${r.error}` : `権限モードを ${r.mode} に変更しました(${mode === "auto" ? "承認要求を自動許可" : "承認要求は都度確認"})`);
  } else if (cmd === "git") {
    const r = await (await fetch("/api/git")).json();
    post(`[GIT状況]\n${r.text ?? r.error}`);
  } else if (customCommands[cmd]) {
    // configで定義したカスタムプロンプトコマンド → リーダーへ送信
    sendSayText(customCommands[cmd].replace(/\$ARGS/g, text.slice(cmd.length + 2).trim()));
  } else {
    post(`不明なコマンド: ${cmd}(/help で一覧)`);
  }
}

/* ================= 全体描画 ================= */
function renderAll() {
  if (!lastState) return;
  renderNav(lastState.live.threads);
  renderRoomHead(lastState);
  renderStream(lastState);
  renderPerms(lastState.live.requests);
  renderCtx(lastState);
  $("nav-foot").textContent = lastState.live.scenario ? `${lastState.live.scenario.name} [${lastState.live.scenario.phase}]` : "";
}

async function refresh() {
  lastState = await (await fetch("/api/state")).json();
  customCommands = lastState.commands ?? {};
  renderAll();
}

let refreshQueued = false;
function refreshSoon() {
  if (refreshQueued) return;
  refreshQueued = true;
  setTimeout(() => { refreshQueued = false; refresh(); }, 600);
}

/* ================= イベント配線 ================= */
const es = new EventSource("/events");
es.onmessage = (e) => {
  const { type, payload } = JSON.parse(e.data);
  if (type === "board") {
    const th = payload.thread ?? "__main__";
    if (th === selectedThread) {
      refreshSoon(); // デバウンス付きで全再描画(ストリームは毎回全件から組み直す)
    } else {
      unread[th] = (unread[th] ?? 0) + 1;
      if (lastState) renderNav(lastState.live.threads);
    }
    return;
  }
  if (["agent.turn", "agent.delta", "tool.call", "tool.result", "agent.status", "agent.spawned", "thread.opened",
       "task.claimed", "task.finished", "task.created", "task.released", "task.cancelled", "task.autoResolved",
       "scenario.started", "scenario.finished"].includes(type)) {
    refreshSoon();
  }
};
const ALL_COMMANDS = () => ({
    ...COMMANDS,
    ...Object.fromEntries(Object.entries(customCommands ?? {}).map(([c, d]) => [c, d + "(カスタム)"])),
  });
  function renderSuggestions(input) {
    const box = document.getElementById("suggest");
    if (!input.startsWith("/")) { box.style.display = "none"; return; }
    const word = input.slice(1).split(/\s/)[0].toLowerCase();
    const matches = Object.entries(ALL_COMMANDS()).filter(([c]) => word === "" || c.toLowerCase().startsWith(word));
    if (!matches.length) { box.style.display = "none"; return; }
    box.style.display = "block";
    box.innerHTML = "";
    for (const [c, d] of matches) {
      const div = document.createElement("div");
      div.className = "sug";
      div.innerHTML = "<b>/" + c + "</b><span class='d'>" + d + "</span>";
      div.onclick = () => {
        const needsArgs = ["session", "thread", "close"].includes(c) || customCommands[c];
        document.getElementById("saytext").value = "/" + c + (needsArgs ? " " : "");
        box.style.display = "none";
        document.getElementById("saytext").focus();
      };
      box.appendChild(div);
    }
  }
  $("saytext").addEventListener("input", () => renderSuggestions($("saytext").value));
  function renderTerminalTab() {
    const body = document.getElementById("ctx-body");
    body.innerHTML = "";
    const hint = document.createElement("div");
    hint.className = "hint";
    hint.textContent = "ワークスペース直下でコマンドを実行(120秒タイムアウト)";
    body.appendChild(hint);
    const out = document.createElement("pre");
    out.className = "fileview";
    out.style.minHeight = "200px";
    out.textContent = window.__termOut ?? "";
    const input = document.createElement("input");
    input.className = "filter";
    input.placeholder = "コマンドを入力してEnter";
    input.addEventListener("keydown", async (e) => {
      if (e.key !== "Enter" || !input.value.trim()) return;
      const cmd = input.value.trim();
      input.value = "";
      window.__termOut = (window.__termOut ?? "") + "$ " + cmd + "\n";
      out.textContent = window.__termOut + "実行中...";
      const r = await (await fetch("/api/exec", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ command: cmd }) })).json();
      window.__termOut += (r.text ?? "") + "\n";
      out.textContent = window.__termOut;
      out.scrollTop = out.scrollHeight;
    });
    body.appendChild(input);
    body.appendChild(out);
  }
  $("saybtn").onclick = sendSay;
$("saytext").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) sendSay(); });
// 画像添付: 📎ボタン or 入力欄へのペースト。dataURL化してからサーバーへ保存させる
let pendingImage = null;
const attachFile = document.getElementById("attachfile");
$("attachbtn").onclick = () => attachFile.click();
attachFile.onchange = () => {
  const f = attachFile.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => { pendingImage = { dataUrl: reader.result, name: f.name }; $("composer-hint").textContent = `添付: ${f.name} — 送信で画像ごと届きます`; };
  reader.readAsDataURL(f);
};
$("saytext").addEventListener("paste", (e) => {
  const item = [...(e.clipboardData?.items ?? [])].find((i) => i.type.startsWith("image/"));
  if (!item) return;
  const f = item.getAsFile();
  if (!f) return;
  e.preventDefault();
  const reader = new FileReader();
  reader.onload = () => { pendingImage = { dataUrl: reader.result, name: "paste.png" }; $("composer-hint").textContent = `添付: 画像(ペースト) — 送信で画像ごと届きます`; };
  reader.readAsDataURL(f);
});
for (const b of document.querySelectorAll("#ctx-tabs .ct")) {
  b.onclick = () => { ctxTab = b.dataset.tab; renderCtx(lastState); };
}
refresh();
setInterval(refresh, 5000);
</script>
