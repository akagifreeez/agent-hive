<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>agent-hive</title>
<script src="/markdown.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Meiryo", "Yu Gothic", sans-serif; background: #14171c; color: #d8dce2; display: flex; height: 100vh; }
  #board { flex: 1.2; overflow-y: auto; padding: 16px; border-right: 1px solid #262b33; }
  #side { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
  h1 { font-size: 15px; margin: 0 0 4px; color: #9fb3c8; }
  .post { background: #1b2028; border: 1px solid #2a313b; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; white-space: pre-wrap; word-break: break-word; }
  .post .from { font-weight: bold; color: #7fb5ff; margin-bottom: 4px; }
  .post.gamma .from { color: #ffd479; }
  .post.beta .from { color: #8fd6a5; }
  .post.delta .from { color: #d8a7ff; }
  .post.system .from { color: #9aa4b1; }
  .post.you { background: #232a35; border-color: #3a4453; }
  .post.you .from { color: #e8ecf2; }
  .post { white-space: normal; }
  .post h1, .post h2, .post h3, .post h4 { margin: 8px 0 4px; font-size: 14px; color: #cfe3ff; }
  .post p { margin: 4px 0; }
  .post ul, .post ol { margin: 4px 0; padding-left: 20px; }
  .post blockquote { border-left: 3px solid #3a4453; margin: 4px 0; padding: 2px 10px; color: #aab4c0; }
  .post code { background: #10131a; border: 1px solid #2a313b; border-radius: 3px; padding: 0 4px; font-size: 12px; }
  .post pre { background: #10131a; border: 1px solid #2a313b; border-radius: 6px; padding: 8px; overflow-x: auto; font-size: 12px; }
  .post pre code { border: none; padding: 0; background: none; }
  .post table { border-collapse: collapse; margin: 6px 0; font-size: 12px; }
  .post th, .post td { border: 1px solid #2a313b; padding: 3px 8px; text-align: left; }
  .post a { color: #7fb5ff; }
  .post hr { border: none; border-top: 1px solid #2a313b; margin: 8px 0; }
  .meta { font-size: 11px; color: #9aa4b1; margin-top: 2px; }
  #saybar { display: flex; gap: 6px; padding: 10px 12px; border-top: 1px solid #262b33; position: sticky; bottom: 0; background: #14171c; }
  #saybar input { flex: 1; background: #1b2028; border: 1px solid #2a313b; color: #d8dce2; border-radius: 6px; padding: 8px 10px; }
  #saybar button { background: #2b6cb0; border: none; color: #fff; border-radius: 6px; padding: 8px 14px; cursor: pointer; }
  .card { background: #1b2028; border: 1px solid #2a313b; border-radius: 8px; padding: 10px 12px; margin: 8px 12px; }
  .card .name { font-weight: bold; }
  .card .st { float: right; font-size: 12px; color: #9aa4b1; }
  .card.working .st { color: #ffd479; }
  .card.done .st { color: #8fd6a5; }
  .card.error .st { color: #ff7a7a; }
  .sec { padding: 0 12px; font-size: 12px; color: #9aa4b1; }
  pre { background: #10131a; border: 1px solid #2a313b; border-radius: 6px; padding: 8px; font-size: 12px; overflow-x: auto; white-space: pre-wrap; }
  #fileview { flex: 1; overflow: auto; padding: 8px 12px; }
  ul.files { list-style: none; padding: 0; margin: 4px 0; font-size: 12px; }
  ul.files li { cursor: pointer; padding: 2px 6px; border-radius: 4px; }
  ul.files li:hover { background: #232a35; }
  .phase { font-size: 12px; color: #9aa4b1; margin-bottom: 10px; }
  .taskrow { display: flex; align-items: baseline; gap: 6px; padding: 3px 4px; border-radius: 4px; font-size: 12px; }
  .taskrow:hover { background: #232a35; }
  .taskrow .tid { color: #7fb5ff; cursor: pointer; white-space: nowrap; }
  .taskrow .tsum { flex: 1; color: #aab4c0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .taskrow .tag { font-size: 10px; color: #9aa4b1; white-space: nowrap; }
  .taskrow button { background: #2a313b; border: 1px solid #3a4453; color: #d8dce2; border-radius: 4px; font-size: 11px; padding: 1px 7px; cursor: pointer; }
  .taskrow button:hover { background: #3a4453; }
  .tsec { margin: 8px 0 2px; font-size: 11px; color: #9aa4b1; }
  #newtask { margin-top: 6px; display: flex; flex-direction: column; gap: 4px; }
  #newtask input, #newtask textarea { background: #10131a; border: 1px solid #2a313b; color: #d8dce2; border-radius: 4px; padding: 4px 6px; font-size: 12px; }
  #newtask textarea { min-height: 44px; resize: vertical; }
  #newtask button { align-self: flex-end; background: #2b6cb0; border: none; color: #fff; border-radius: 4px; padding: 4px 10px; cursor: pointer; font-size: 12px; }
</style>
</head>
<body>
  <div id="board"><h1>共有ボード</h1><div class="phase" id="phase"></div><div id="permreq"></div><div id="posts"></div>
    <div id="saybar"><input id="saytext" placeholder="メインチャットへ指示(全メインに届く。@アルファ で個別呼び出し)"><button id="saybtn">送信</button></div>
  </div>
  <div id="side">
    <div id="agents"></div>
    <div class="card"><div class="name">タスク(UIから直接操作・チャット不要)</div>
      <div id="tasks"></div>
      <div id="newtask">
        <input id="nt-id" placeholder="task_id(空欄で自動採番)">
        <input id="nt-role" placeholder="role(impl/review等、空欄で誰でも)">
        <textarea id="nt-body" placeholder="何を / どう確認するか / 完了条件"></textarea>
        <button id="nt-add">タスク投入(ボードへ直接)</button>
      </div>
    </div>
    <div class="card"><div class="name">ワークスペースのファイル(クリックで表示)</div><ul class="files" id="files"></ul></div>
    <div id="fileview"></div>
  </div>
<script>
const agentsEl = document.getElementById("agents");
const postsEl = document.getElementById("posts");
let agentOrder = [];

function renderState(state) {
  const names = { alpha: "アルファ", beta: "ベータ", gamma: "ガンマ", delta: "デルタ", system: "システム" };
  agentsEl.innerHTML = "";
  for (const [id, a] of Object.entries(state.live.agents)) {
    const div = document.createElement("div");
    div.className = "card " + (a.status ?? "");
    const label = a.displayName ?? names[id] ?? id;
    const hier = a.depth ? `depth ${a.depth}${a.parent ? ` / 親:${names[a.parent] ?? a.parent}` : ""}` : "メイン";
    div.innerHTML = `<span class="name">${label}</span><span class="st">${a.status ?? "idle"} / turn ${a.turn ?? 0} ${a.lastTool ? "/ " + a.lastTool : ""}</span>` +
      `<div class="meta">${hier}${a.tokens ? ` / tokens ${a.tokens.toLocaleString()} / $${(a.costUsd ?? 0).toFixed(4)}` : ""}</div>`;
    agentsEl.appendChild(div);
  }
  renderTasks(state.taskList);
  document.getElementById("phase").textContent = state.live.scenario ? `シナリオ: ${state.live.scenario.name} [${state.live.scenario.phase}]` : "";
  renderFiles();
}

// タスクパネル: 状態ごとの一覧+UI直操作(クリックで本文、ボタンで解放/中止/再開)
function renderTasks(list) {
  const el = document.getElementById("tasks");
  el.innerHTML = "";
  const secs = [
    ["open", "未着手", (t) => ({ label: "中止", action: "cancel" })],
    ["claimed", "作業中", (t) => ({ label: "解放", action: "release" })],
    ["done", "完了", (t) => ({ label: "再開", action: "reopen" })],
  ];
  for (const [state, label, btn] of secs) {
    const rows = list[state] ?? [];
    const head = document.createElement("div");
    head.className = "tsec";
    head.textContent = `${label}(${rows.length})`;
    el.appendChild(head);
    for (const t of rows) {
      const row = document.createElement("div");
      row.className = "taskrow";
      const id = document.createElement("span");
      id.className = "tid";
      id.textContent = t.id + (t.agent && t.agent !== "auto" && t.agent !== "you" ? ` @${t.agent}` : "");
      id.title = t.summary;
      id.onclick = () => showTaskBody(t);
      const sum = document.createElement("span");
      sum.className = "tsum";
      sum.textContent = t.summary;
      sum.onclick = () => showTaskBody(t);
      const b = document.createElement("button");
      const spec = btn(t);
      b.textContent = spec.label;
      b.onclick = (e) => { e.stopPropagation(); taskAction({ action: spec.action, id: t.id, agent: t.agent }); };
      row.append(id, sum, b);
      el.appendChild(row);
    }
  }
}

async function showTaskBody(t) {
  const r = await (await fetch("/api/file?path=" + encodeURIComponent(t.path))).json();
  document.getElementById("fileview").innerHTML =
    `<div class="tsec">${escapeHtml(t.id)} の本文(<code>${escapeHtml(t.path)}</code>)</div>` +
    `<div class="post">${renderMarkdown(r.content ?? "")}</div>`;
}

async function taskAction(payload) {
  const r = await (await fetch("/api/tasks", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(payload) })).json();
  if (r.error) alert(r.error);
  refresh();
}

async function createTask() {
  const id = document.getElementById("nt-id").value.trim();
  const role = document.getElementById("nt-role").value.trim();
  const body = document.getElementById("nt-body").value.trim();
  if (!body) { alert("本文(何を/完了条件)を書いてください"); return; }
  const r = await (await fetch("/api/tasks", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ action: "create", id, role, body }) })).json();
  if (r.error) { alert(r.error); return; }
  document.getElementById("nt-id").value = "";
  document.getElementById("nt-role").value = "";
  document.getElementById("nt-body").value = "";
  refresh();
}

async function renderFiles() {
  const state = await (await fetch("/api/state")).json();
  const files = state.files ?? [];
  const ul = document.getElementById("files");
  ul.innerHTML = "";
  for (const f of files) {
    const li = document.createElement("li");
    li.textContent = f;
    li.onclick = async () => {
      const r = await (await fetch("/api/file?path=" + encodeURIComponent(f))).json();
      document.getElementById("fileview").innerHTML = `<pre>${escapeHtml(r.content ?? "")}</pre>`;
    };
    ul.appendChild(li);
  }
}

function addPost(p) {
  const div = document.createElement("div");
  div.className = "post " + p.from;
  const names = { alpha: "アルファ", beta: "ベータ", gamma: "ガンマ", delta: "デルタ", system: "システム", you: "あなた" };
  div.innerHTML = `<div class="from">${names[p.from] ?? p.from} #${p.id}</div>` + renderMarkdown(p.text);
  postsEl.appendChild(div);
  document.getElementById("board").scrollTop = document.getElementById("board").scrollHeight;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function renderRequests(requests) {
  const el = document.getElementById("permreq");
  el.innerHTML = "";
  for (const r of requests.filter((x) => x.state === "pending")) {
    const div = document.createElement("div");
    div.className = "post";
    div.innerHTML = `<div class="from" style="color:#ff9a9a">承認要求 #${r.id}</div><pre>${escapeHtml(r.command)}</pre>`;
    const row = document.createElement("div");
    const yes = document.createElement("button");
    yes.textContent = "承認";
    yes.onclick = () => decide(r.id, true);
    const no = document.createElement("button");
    no.textContent = "拒否";
    no.onclick = () => decide(r.id, false);
    row.append(yes, no);
    div.appendChild(row);
    el.appendChild(div);
  }
  if (el.childElementCount) document.getElementById("board").scrollTop = 0;
}

async function decide(id, approve) {
  await fetch("/api/permission", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ id, approve }) });
  refresh();
}

async function refresh() {
  const state = await (await fetch("/api/state")).json();
  postsEl.innerHTML = "";
  for (const p of state.live.board) addPost(p);
  renderRequests(state.live.requests ?? []);
  renderState(state);
}

const es = new EventSource("/events");
es.onmessage = (e) => {
  const { type, payload } = JSON.parse(e.data);
  if (type === "board") addPost(payload);
  if (type === "agent.spawned") refresh();
  if (type === "scenario.started" || type === "scenario.finished") refresh();
  if (type === "task.claimed" || type === "task.finished" || type === "task.created" || type === "task.released" || type === "task.cancelled" || type === "task.autoResolved") refresh();
};
document.getElementById("nt-add").onclick = createTask;
document.getElementById("saybtn").onclick = sendSay;
document.getElementById("saytext").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) sendSay();
});
async function sendSay() {
  const el = document.getElementById("saytext");
  const text = el.value.trim();
  if (!text) return;
  el.value = "";
  await fetch("/api/say", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ text }) });
}
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
